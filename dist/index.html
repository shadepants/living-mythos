const PRESETS = [
  // Golden Hour: low warm amber key, violet fill, golden horizon
  makePreset({ sunDir: [-0.55, 0.30, 0.78], sunColor: [1.0, 0.68, 0.38], sunI: 3.6, hemiSky: [0.55, 0.42, 0.85], hemiGround: [0.40, 0.26, 0.22],
    hemiI: 1.0, fog: [0.85, 0.56, 0.42], fogD: 0.010, skyTop: [0.20, 0.17, 0.52], skyHor: [1.0, 0.62, 0.34], exposure: 1.25,
    wet: 0.0, wind: 0.35, rain: 0.0, night: 0.0, aurora: 0.0 }),
  // Midnight Aurora: deep indigo, cool moon key
  makePreset({ sunDir: [0.40, 0.62, -0.45], sunColor: [0.45, 0.58, 1.0], sunI: 1.9, hemiSky: [0.14, 0.20, 0.50], hemiGround: [0.05, 0.05, 0.13],
    hemiI: 1.5, fog: [0.04, 0.06, 0.17], fogD: 0.012, skyTop: [0.003, 0.007, 0.04], skyHor: [0.02, 0.04, 0.13], exposure: 2.4,
    wet: 0.1, wind: 0.25, rain: 0.0, night: 1.0, aurora: 1.0 }),
  // Monsoon: overcast slate, wet sheen, wind
  makePreset({ sunDir: [0.20, 0.75, 0.30], sunColor: [0.58, 0.66, 0.74], sunI: 1.1, hemiSky: [0.40, 0.46, 0.52], hemiGround: [0.20, 0.22, 0.24],
    hemiI: 1.3, fog: [0.26, 0.30, 0.34], fogD: 0.026, skyTop: [0.14, 0.17, 0.21], skyHor: [0.30, 0.34, 0.38], exposure: 1.3,
    wet: 1.0, wind: 1.5, rain: 1.0, night: 0.55, aurora: 0.0 }),
];

function lerpPreset(out, a, b, t) {
  out.sunDir.lerpVectors(a.sunDir, b.sunDir, t).normalize();
  out.sunColor.lerpColors(a.sunColor, b.sunColor, t);
  out.hemiSky.lerpColors(a.hemiSky, b.hemiSky, t);
  out.hemiGround.lerpColors(a.hemiGround, b.hemiGround, t);
  out.fog.lerpColors(a.fog, b.fog, t);
  out.skyTop.lerpColors(a.skyTop, b.skyTop, t);
  out.skyHor.lerpColors(a.skyHor, b.skyHor, t);
  out.sunI = a.sunI + (b.sunI - a.sunI) * t;
  out.hemiI = a.hemiI + (b.hemiI - a.hemiI) * t;
  out.fogD = a.fogD + (b.fogD - a.fogD) * t;
  out.exposure = a.exposure + (b.exposure - a.exposure) * t;
  out.wet = a.wet + (b.wet - a.wet) * t;
  out.wind = a.wind + (b.wind - a.wind) * t;
  out.rain = a.rain + (b.rain - a.rain) * t;
  out.night = a.night + (b.night - a.night) * t;
  out.aurora = a.aurora + (b.aurora - a.aurora) * t;
}

// Live atmosphere: `state` eases toward `target`; every frame the blended preset is pushed to lights, fog and shared uniforms.
function createAtmosphere(scene, sun, hemi, composite) {
  const cur = makePreset({ sunDir: [0, 1, 0], sunColor: [1, 1, 1], sunI: 1, hemiSky: [1, 1, 1], hemiGround: [1, 1, 1], hemiI: 1, fog: [1, 1, 1],
    fogD: 0.01, skyTop: [1, 1, 1], skyHor: [1, 1, 1], exposure: 1, wet: 0, wind: 0, rain: 0, night: 0, aurora: 0 });
  const atmo = {
    state: 0, target: 0, pinned: false, drift: true, driftClock: 0, cur,
    setTarget(v) { atmo.target = v < 0 ? 0 : v > 1 ? 1 : v; atmo.pinned = true; atmo.driftClock = 0; },
  };

  atmo.update = function update(dt) {
    // Drift: slowly walk Golden -> Aurora -> Monsoon -> Golden unless the player pinned a state (spec 1.3).
    if (atmo.drift && !atmo.pinned) {
      atmo.driftClock += dt;
      const cycle = atmo.driftClock / 360;               // ~6 minute loop
      const ph = cycle - Math.floor(cycle);
      // 0..1/3 golden hold -> aurora, 1/3..2/3 aurora hold -> monsoon, 2/3..1 monsoon hold -> golden
      const seg = ph * 3, k = seg - Math.floor(seg), idx = Math.floor(seg);
      const ease = k < 0.7 ? 0 : (k - 0.7) / 0.3;
      const s = ease * ease * (3 - 2 * ease);
      atmo.target = idx === 0 ? 0.5 * s : idx === 1 ? 0.5 + 0.5 * s : 1 - s;
    }
    const a = 1 - Math.exp(-dt / 1.1);
    atmo.state += (atmo.target - atmo.state) * a;
    const st = atmo.state;
    if (st <= 0.5) lerpPreset(cur, PRESETS[0], PRESETS[1], st * 2);
    else lerpPreset(cur, PRESETS[1], PRESETS[2], (st - 0.5) * 2);

    SHARED.uAtmo.value = st;
    SHARED.uSunDir.value.copy(cur.sunDir);
    SHARED.uSunColor.value.copy(cur.sunColor).multiplyScalar(cur.sunI / 3.6);
    SHARED.uSkyTop.value.copy(cur.skyTop);
    SHARED.uSkyHor.value.copy(cur.skyHor);
    SHARED.uFogColor.value.copy(cur.fog);
    SHARED.uFogDensity.value = cur.fogD;
    SHARED.uWet.value = cur.wet; SHARED.uWind.value = cur.wind; SHARED.uRain.value = cur.rain;
    SHARED.uNight.value = cur.night; SHARED.uAurora.value = cur.aurora;

    sun.color.copy(cur.sunColor);
    sun.intensity = cur.sunI;
    sun.position.copy(cur.sunDir).multiplyScalar(30);
    hemi.color.copy(cur.hemiSky);
    hemi.groundColor.copy(cur.hemiGround);
    hemi.intensity = cur.hemiI;
    scene.fog.color.copy(cur.fog);
    scene.fog.density = cur.fogD;
    scene.background.copy(cur.skyHor);
    composite.material.uniforms.uExposure.value = cur.exposure;
  };
  return atmo;
}

// ---- gl/terrain.js ----
// 128x128 vertices at cell centres, flat at y=0; the shader displaces them from the sim textures.
function createGridGeometry() {
  const n = GRID_W * GRID_H;
  const pos = new Float32Array(n * 3);
  const nor = new Float32Array(n * 3);
  for (let z = 0; z < GRID_H; z++) {
    for (let x = 0; x < GRID_W; x++) {
      const i = z * GRID_W + x;
      pos[i * 3] = -10 + (x + 0.5) * CELL_SIZE;
      pos[i * 3 + 2] = -10 + (z + 0.5) * CELL_SIZE;
      nor[i * 3 + 1] = 1;
    }
  }
  const idx = new Uint32Array((GRID_W - 1) * (GRID_H - 1) * 6);
  let k = 0;
  for (let z = 0; z < GRID_H - 1; z++) {
    for (let x = 0; x < GRID_W - 1; x++) {
      const i = z * GRID_W + x;
      idx[k++] = i; idx[k++] = i + GRID_W; idx[k++] = i + 1;
      idx[k++] = i + 1; idx[k++] = i + GRID_W; idx[k++] = i + GRID_W + 1;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 20);
  g.boundingBox = new THREE.Box3(new THREE.Vector3(-10, -1, -10), new THREE.Vector3(10, 3, 10));
  return g;
}

function addSimUniforms(shader) {
  shader.uniforms.uSimTexA = SHARED.uSimTexA;
  shader.uniforms.uSimTexB = SHARED.uSimTexB;
  shader.uniforms.uSimTexC = SHARED.uSimTexC;
  shader.uniforms.uTime = SHARED.uTime;
  shader.uniforms.uCell = SHARED.uCell;
  shader.uniforms.uWet = SHARED.uWet;
  shader.uniforms.uRingA = SHARED.uRingA;
  shader.uniforms.uRingB = SHARED.uRingB;
  shader.uniforms.uGlow = SHARED.uGlow;
  shader.uniforms.uNight = SHARED.uNight;
}

function createIslandTop(grid, caps) {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.86, metalness: 0.0 });
  if (!caps.floatLinear) mat.defines = { MANUAL_BILINEAR: '' };
  mat.onBeforeCompile = (shader) => {
    addSimUniforms(shader);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWP;\nvarying vec3 vWN;\nvarying vec2 vSimUv;\n${GLSL_SIM}\n${GLSL_TERRAIN_HEIGHT}`)
      .replace('#include <beginnormal_vertex>', GLSL_ISLAND_VERT_NORMAL)
      .replace('#include <begin_vertex>', GLSL_ISLAND_VERT_POS);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWP;\nvarying vec3 vWN;\nvarying vec2 vSimUv;\nuniform float uWet;\nuniform vec4 uRingA[8];\nuniform vec4 uRingB[8];\nuniform vec4 uGlow[24];\nuniform float uNight;\nuniform sampler2D uSimTexC;\n${GLSL_SIM}`)
      .replace('#include <color_fragment>', GLSL_ISLAND_FRAG_COLOR)
      .replace('#include <roughnessmap_fragment>', GLSL_ISLAND_FRAG_ROUGH)
      .replace('#include <emissivemap_fragment>', GLSL_ISLAND_FRAG_EMISSIVE)
      .replace('#include <lights_fragment_end>', GLSL_ISLAND_SHADE);
  };
  const depth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  if (!caps.floatLinear) depth.defines = { MANUAL_BILINEAR: '' };
  depth.onBeforeCompile = (shader) => {
    addSimUniforms(shader);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${GLSL_SIM}\n${GLSL_TERRAIN_HEIGHT}`)
      .replace('#include <begin_vertex>', 'vec2 sPxz; float sElev = terrainHeight(position.xz, sPxz);\nvec3 transformed = vec3(sPxz.x, sElev, sPxz.y);');
  };
  const mesh = new THREE.Mesh(grid, mat);
  mesh.customDepthMaterial = depth;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}

function createWaterSurface(grid, caps) {
  const mat = new THREE.ShaderMaterial({
    vertexShader: GLSL_WATER_VERT,
    fragmentShader: GLSL_WATER_FRAG,
    uniforms: {
      uSimTexA: SHARED.uSimTexA, uSimTexB: SHARED.uSimTexB, uTime: SHARED.uTime, uCell: SHARED.uCell,
      uSunDir: SHARED.uSunDir, uSunColor: SHARED.uSunColor, uSkyTop: SHARED.uSkyTop, uSkyHor: SHARED.uSkyHor,
      uFogColor: SHARED.uFogColor, uFogDensity: SHARED.uFogDensity, uRain: SHARED.uRain,
    },
    transparent: true, depthWrite: false,
    defines: caps.floatLinear ? {} : { MANUAL_BILINEAR: '' },
  });
  const mesh = new THREE.Mesh(grid, mat);
  mesh.renderOrder = 2;
  mesh.frustumCulled = false;
  return mesh;
}

// Faceted basalt column skirt tapering to a tip at y = -9.5 (spec 4.1). Flat shaded, vertex coloured.
function createBasaltSkirt() {
  const COLS = 56, ROWS = 18, TOP_Y = -0.6, TIP_Y = -9.5, R0 = 9.2;
  const ring = (c, r) => {
    const t = r / ROWS;
    const a = (c % COLS) / COLS * Math.PI * 2;
    const col = hash2(c % COLS, 7, 11);
    const ledge = hash2(c % COLS, r, 23);
    const bulge = Math.sin(Math.min(1, t * 1.6) * Math.PI) ;
    let rad = R0 * Math.pow(1 - t, 0.78);
    if (r > 0) rad *= 1 + (col - 0.5) * 0.22 * bulge + (ledge - 0.5) * 0.06;
    const y = TOP_Y + (TIP_Y - TOP_Y) * Math.pow(t, 0.92);
    return [Math.cos(a) * rad, y, Math.sin(a) * rad, col, t];
  };
  const tris = [];
  const cols = [];
  const color = new THREE.Color();
  const push = (p, shade) => {
    tris.push(p[0], p[1], p[2]);
    const t = p[4];
    const lip = 1 - Math.min(1, t * 14);
    const moss = hash2(Math.floor(p[3] * 977), Math.floor(t * 40), 5) > 0.82 ? 0.05 : 0;
    const base = 0.17 + shade * 0.12 + t * 0.02;
    color.setRGB(base + lip * 0.38 + moss * 0.2, base * 0.95 + lip * 0.22 + moss * 1.4, base * 1.1 + lip * 0.08, THREE.SRGBColorSpace);
    cols.push(color.r, color.g, color.b);
  };
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const p00 = ring(c, r), p10 = ring(c + 1, r), p01 = ring(c, r + 1), p11 = ring(c + 1, r + 1);
      const sh = hash2(c, r, 31);
      push(p00, sh); push(p10, sh); push(p01, sh);
      if (r < ROWS - 1) { push(p10, sh); push(p11, sh); push(p01, sh); }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tris, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.92, metalness: 0.0 }));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ---- sim/rng.js ----
// mulberry32. Persistent object so frame-time use allocates nothing.
class Rng {
  constructor(seed) { this.s = seed >>> 0; }
  next() {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
}

// ---- sim/island.js ----
// Seeded island: basalt+clay height, rim drains, springs near high ground, initial fertility.
function generateIsland(world) {
  const { elev, mask, fertility, culturalBias, soil } = world;
  const seed = world.seed;
  const rng = new Rng(seed ^ 0x9e3779b9);
  let rimCount = 0;

  for (let z = 0; z < GRID_H; z++) {
    for (let x = 0; x < GRID_W; x++) {
      const i = z * GRID_W + x;
      const nx = ((x + 0.5) / GRID_W) * 2 - 1;
      const nz = ((z + 0.5) / GRID_H) * 2 - 1;
      const r = Math.sqrt(nx * nx + nz * nz);
      const rw = r + 0.10 * (fbm(nx * 2.2 + 7, nz * 2.2 + 3, seed + 1, 3) - 0.5);
      const shape = 1 - smoothstep(TUNING.taperStart, TUNING.taperEnd, rw);
      const hills = fbm(nx * 1.6, nz * 1.6, seed, 4);
      const rn = 1 - Math.abs(2 * valueNoise(nx * 2.4 + 11, nz * 2.4 + 5, seed + 2) - 1);
      const base = 0.25 + 1.1 * (0.65 * hills + 0.35 * rn * rn);
      const land = base * (0.35 + 0.65 * shape);
      const cliff = 1 - smoothstep(TUNING.cliffStart, TUNING.rimRadius, rw);
      const rimElev = -0.6 - 0.8 * Math.max(0, r - TUNING.rimRadius);
      elev[i] = rimElev + (land - rimElev) * cliff;
      if (r > TUNING.rimRadius) { mask[i] = 1; rimCount++; } else mask[i] = 0;

      const low = Math.min(1, Math.max(0, 0.75 - land * 0.35 + (fbm(nx * 5, nz * 5, seed + 3, 3) - 0.5) * 0.5));
      fertility[i] = mask[i] ? 0 : low;
      soil[i] = 0.55 + 0.9 * fbm(nx * 3.2 + 9, nz * 3.2 + 4, seed + 7, 3);
      culturalBias[i] = (valueNoise(nx * 2 + 31, nz * 2 + 17, seed + 4) - 0.5) * 0.2;
    }
  }

  world.rimCells = new Int32Array(rimCount);
  let k = 0;
  for (let i = 0; i < GRID_W * GRID_H; i++) if (mask[i]) world.rimCells[k++] = i;

  // Springs: highest cells in the inner island, kept apart from each other.
  const want = world.springs.length;
  let placed = 0;
  const minDist2 = 20 * 20;
  for (let attempt = 0; attempt < 4000 && placed < want; attempt++) {
    const x = Math.floor(rng.range(24, GRID_W - 24)), z = Math.floor(rng.range(24, GRID_H - 24));
    const nx = ((x + 0.5) / GRID_W) * 2 - 1, nz = ((z + 0.5) / GRID_H) * 2 - 1;
    const r = Math.sqrt(nx * nx + nz * nz);
    if (r < 0.12 || r > 0.62) continue;
    const i = z * GRID_W + x;
    // Hill-climb to the local maximum.
    let bx = x, bz = z;
    for (let s = 0; s < 40; s++) {
      let best = elev[bz * GRID_W + bx], mx = bx, mz = bz;
      for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
        const px = bx + dx, pz = bz + dz;
        if (px < 1 || pz < 1 || px >= GRID_W - 1 || pz >= GRID_H - 1) continue;
        const e = elev[pz * GRID_W + px];
        if (e > best) { best = e; mx = px; mz = pz; }
      }
      if (mx === bx && mz === bz) break;
      bx = mx; bz = mz;
    }
    let ok = true;
    for (let j = 0; j < placed; j++) {
      const sx = world.springs[j] % GRID_W, sz = (world.springs[j] / GRID_W) | 0;
      if ((sx - bx) * (sx - bx) + (sz - bz) * (sz - bz) < minDist2) { ok = false; break; }
    }
    if (!ok) continue;
    world.springs[placed++] = bz * GRID_W + bx;
    void i;
  }
  for (let j = placed; j < want; j++) world.springs[j] = world.springs[0];
}

// ---- sim/world.js ----
// All simulation state, allocated once (spec 3.1).
function createWorld(seed) {
  const f = () => new Float32Array(GRID_N);
  const world = {
    seed: (seed === undefined ? TUNING.seedDefault : seed) | 0,
    elev: f(), water: f(),
    fluxL: f(), fluxR: f(), fluxT: f(), fluxB: f(),
    vx: f(), vz: f(), sediment: f(),
    moisture: f(), fertility: f(), compaction: f(), frustration: f(), culturalBias: f(),
    structureIdx: new Int32Array(GRID_N).fill(-1),
    mask: new Uint8Array(GRID_N),        // 0 land, 1 rim (drain)
    rimOut: f(),                         // water drained over the cliff by the last substep, per rim cell
    sedTmp: f(),                         // scratch for sediment advection
    ecoTmp: f(),                         // scratch for ecology diffusion
    shade: new Float32Array(GRID_N).fill(1),   // sun shadow factor from the heightfield (runtime only)
    soil: f(),                           // fixed soil quality 0.55..1.45 (regenerated from the seed, not saved)
    ecoCount: 0,
    events: createEventRing(),
    monoliths: new Float32Array(8 * 4),   // x, z, placedAt, active
    monoPulse: new Float32Array(8),
    rng: new Rng(((seed === undefined ? TUNING.seedDefault : seed) ^ 0x5bd1e995) >>> 0),
    engCover: new Uint8Array(GRID_N),     // 0 none, 2 bridge, 3 steps, 4 paving
    civ: null,
    springs: new Int32Array(TUNING.springCount),
    rimCells: null,
    params: {
      dt: TUNING.dtSim, gravity: TUNING.gravity, fluxDamp: TUNING.fluxDamp,
      rain: TUNING.rain, evap: TUNING.evap, springRate: TUNING.springRate,
      rimDrainRate: TUNING.rimDrainRate, drainRim: true, erosion: true,
      kCap: TUNING.kCap, kErode: TUNING.kErode, kDeposit: TUNING.kDeposit,
      ecoGrow: 1.0, evapMul: 1.0,
    },
    stats: { rimDrained: 0, flux: 0, substeps: 0, time: 0 },
  };
  generateIsland(world);
  world.civ = createCiv();
  return world;
}

// ---- sim/hydro.js ----
// One virtual-pipe substep (spec 3.2). Allocation-free: only typed-array reads/writes and locals.
function hydroStep(world) {
  const p = world.params;
  const dt = p.dt;
  const { elev, water, fluxL, fluxR, fluxT, fluxB, vx, vz, sediment, fertility, mask, rimOut, sedTmp, springs } = world;
  const g = p.gravity, damp = p.fluxDamp;

  // sources
  if (p.rain > 0) {
    const add = p.rain * dt;
    for (let i = 0; i < GRID_N; i++) if (mask[i] === 0) water[i] += add;
  }
  if (p.springRate > 0) {
    const add = p.springRate * dt;
    for (let s = 0; s < springs.length; s++) water[springs[s]] += add;
  }

  // 1+2: flux acceleration and conservation scaling
  for (let z = 0; z < GRID_H; z++) {
    for (let x = 0; x < GRID_W; x++) {
      const i = z * GRID_W + x;
      const h0 = elev[i] + water[i];
      let fl = 0, fr = 0, ft = 0, fb = 0;
      if (x > 0) { fl = fluxL[i] * damp + dt * g * (h0 - elev[i - 1] - water[i - 1]); if (fl < 0) fl = 0; }
      if (x < GRID_W - 1) { fr = fluxR[i] * damp + dt * g * (h0 - elev[i + 1] - water[i + 1]); if (fr < 0) fr = 0; }
      if (z > 0) { ft = fluxT[i] * damp + dt * g * (h0 - elev[i - GRID_W] - water[i - GRID_W]); if (ft < 0) ft = 0; }
      if (z < GRID_H - 1) { fb = fluxB[i] * damp + dt * g * (h0 - elev[i + GRID_W] - water[i + GRID_W]); if (fb < 0) fb = 0; }
      let k = water[i] / (dt * (fl + fr + ft + fb) + 1e-6);
      if (k > 1) k = 1;
      fluxL[i] = fl * k; fluxR[i] = fr * k; fluxT[i] = ft * k; fluxB[i] = fb * k;
    }
  }

  // 3+4a: continuity, rim drain, evaporation, derived velocity
  let fluxTotal = 0, drainedTotal = 0;
  const drainFrac = Math.min(1, p.rimDrainRate * dt);
  const evap = p.evap * dt;
  const velMax = TUNING.velMax;
  for (let z = 0; z < GRID_H; z++) {
    for (let x = 0; x < GRID_W; x++) {
      const i = z * GRID_W + x;
      const inL = x > 0 ? fluxR[i - 1] : 0;
      const inR = x < GRID_W - 1 ? fluxL[i + 1] : 0;
      const inT = z > 0 ? fluxB[i - GRID_W] : 0;
      const inB = z < GRID_H - 1 ? fluxT[i + GRID_W] : 0;
      const out = fluxL[i] + fluxR[i] + fluxT[i] + fluxB[i];
      const d0 = water[i];
      let d1 = d0 + dt * (inL + inR + inT + inB - out);
      if (d1 < 0) d1 = 0;
      fluxTotal += out;

      const dbar = 0.5 * (d0 + d1);
      if (dbar > TUNING.minDepthVel) {
        let ux = 0.5 * (inL - fluxL[i] + fluxR[i] - inR) / dbar;
        let uz = 0.5 * (inT - fluxT[i] + fluxB[i] - inB) / dbar;
        if (ux > velMax) ux = velMax; else if (ux < -velMax) ux = -velMax;
        if (uz > velMax) uz = velMax; else if (uz < -velMax) uz = -velMax;
        vx[i] = ux; vz[i] = uz;
      } else { vx[i] = 0; vz[i] = 0; }

      if (mask[i] === 1) {
        if (p.drainRim) {
          const dr = d1 * drainFrac;
          d1 -= dr;
          rimOut[i] = dr;
          drainedTotal += dr;
        }
      } else if (evap > 0) {
        d1 -= evap;
        if (d1 < 0) d1 = 0;
      }
      water[i] = d1;
    }
  }
  world.stats.rimDrained += drainedTotal;
  world.stats.flux = fluxTotal;

  // 4b: erosion / deposition, then semi-Lagrangian sediment transport
  if (p.erosion) {
    const kCap = p.kCap, kEr = p.kErode * dt, kDep = p.kDeposit * dt;
    const maxD = TUNING.maxDElev, floor = TUNING.elevFloor, gain = TUNING.alluvialGain;
    for (let i = 0; i < GRID_N; i++) {
      if (mask[i] === 1) { if (p.drainRim) sediment[i] = 0; continue; }
      const dep = water[i];
      let cap = 0;
      if (dep > TUNING.erodeMinDepth) {
        const s = Math.sqrt(vx[i] * vx[i] + vz[i] * vz[i]);
        cap = s * (dep < 0.08 ? dep : 0.08) * kCap;
      }
      const sed = sediment[i];
      if (cap > sed) {
        let d = kEr * (cap - sed);
        if (d > maxD) d = maxD;
        if (elev[i] - d < floor) d = elev[i] - floor > 0 ? elev[i] - floor : 0;
        elev[i] -= d;
        sediment[i] = sed + d;
      } else {
        let d = kDep * (sed - cap);
        if (d > maxD) d = maxD;
        if (d > sed) d = sed;
        // sediment never builds a spike above all four neighbours (it would be washed on in reality)
        const xx = i % GRID_W, zz = (i / GRID_W) | 0;
        const eL = xx > 0 ? elev[i - 1] : elev[i], eR = xx < GRID_W - 1 ? elev[i + 1] : elev[i];
        const eU = zz > 0 ? elev[i - GRID_W] : elev[i], eD = zz < GRID_H - 1 ? elev[i + GRID_W] : elev[i];
        let hmax = eL > eR ? eL : eR;
        if (eU > hmax) hmax = eU;
        if (eD > hmax) hmax = eD;
        const room = hmax + TUNING.depositLip - elev[i];
        if (d > room) d = room > 0 ? room : 0;
        elev[i] += d;
        sediment[i] = sed - d;
        const f = fertility[i] + d * gain;
        fertility[i] = f > 1 ? 1 : f;
      }
    }
    // conservative donor-cell transport: each cell hands a velocity-proportional fraction to its downstream neighbours
    sedTmp.set(sediment);
    for (let z = 0; z < GRID_H; z++) {
      for (let x = 0; x < GRID_W; x++) {
        const i = z * GRID_W + x;
        const sed = sediment[i];
        if (sed <= 0) continue;
        const ux = vx[i] * dt, uz = vz[i] * dt;
        let ax = ux < 0 ? -ux : ux, az = uz < 0 ? -uz : uz;
        const nx = ux < 0 ? x - 1 : x + 1, nz = uz < 0 ? z - 1 : z + 1;
        if (nx < 0 || nx >= GRID_W) ax = 0;
        if (nz < 0 || nz >= GRID_H) az = 0;
        const tot = ax + az;
        const scale = tot > 0.9 ? 0.9 / tot : 1;
        ax *= scale; az *= scale;
        sedTmp[i] -= (ax + az) * sed;
        if (ax > 0) sedTmp[z * GRID_W + nx] += ax * sed;
        if (az > 0) sedTmp[nz * GRID_W + x] += az * sed;
      }
    }
    sediment.set(sedTmp);
  }
  world.stats.substeps++;
}

// ---- sim/ecology.js ----
// Soil moisture, crop/humus fertility, footpath relaxation and cultural drift (spec 3.3). Allocation-free.
function ecologyStep(world, dt) {
  const p = world.params;
  const { elev, soil, water, moisture, fertility, compaction, culturalBias, mask, ecoTmp, frustration, engCover } = world;
  const absorb = Math.min(1, TUNING.moistAbsorb * dt);
  const evap = TUNING.moistEvap * dt * p.evapMul;
  const rainGain = p.rain * dt * TUNING.moistFromRain;
  const grow = TUNING.fertGrow * p.ecoGrow * dt * 1.0;
  const decay = TUNING.fertDecay * dt;
  const cdecay = TUNING.fertCompactDecay * dt;
  const relax = TUNING.compactRelax * dt;
  const fDecay = TUNING.frustrateDecay * dt, fCover = TUNING.coverDecay * dt;

  for (let i = 0; i < GRID_N; i++) {
    if (mask[i] === 1) { moisture[i] = 0; fertility[i] = 0; compaction[i] = 0; continue; }
    let wet = water[i] * TUNING.moistFromWater;
    if (wet > 1) wet = 1;
    let m = moisture[i];
    if (wet > m) m += (wet - m) * absorb; else m -= m * evap * (1 + TUNING.moistElevEvap * (elev[i] > 0 ? elev[i] : 0)) / (soil[i] * soil[i]);   // good soil holds water
    m += rainGain;
    if (m > 1) m = 1; else if (m < 0) m = 0;
    moisture[i] = m;

    const c = compaction[i];
    let f = fertility[i];
    // fertility relaxes toward a target set by soil moisture, soil quality and trampling
    let sm = (m - 0.12) / 0.73; sm = sm < 0 ? 0 : sm > 1 ? 1 : sm; sm = sm * sm * (3 - 2 * sm);
    let target = sm * (0.35 + 0.8 * soil[i]) * (1 - c);
    if (target > 1) target = 1;
    f += (target - f) * (target > f ? grow : decay + cdecay * c);
    fertility[i] = f > 1 ? 1 : f < 0 ? 0 : f;
    const cr = engCover[i] === 4 ? relax * 25 : relax;
    compaction[i] = c > cr ? c - cr : 0;
    const fr = frustration[i];
    if (fr > 0) { const d = engCover[i] !== 0 ? fCover : fDecay; frustration[i] = fr > d ? fr - d : 0; }
  }

  // diffusion of moisture and cultural bias (4-neighbour average into scratch, then blend)
  const kd = TUNING.moistDiffuse, kb = TUNING.biasDiffuse * dt, kdec = TUNING.biasDecay * dt;
  for (let z = 0; z < GRID_H; z++) {
    for (let x = 0; x < GRID_W; x++) {
      const i = z * GRID_W + x;
      const l = x > 0 ? i - 1 : i, r = x < GRID_W - 1 ? i + 1 : i, u = z > 0 ? i - GRID_W : i, d = z < GRID_H - 1 ? i + GRID_W : i;
      ecoTmp[i] = (moisture[l] + moisture[r] + moisture[u] + moisture[d]) * 0.25;
    }
  }
  for (let i = 0; i < GRID_N; i++) if (mask[i] === 0) moisture[i] += (ecoTmp[i] - moisture[i]) * kd;

  for (let z = 0; z < GRID_H; z++) {
    for (let x = 0; x < GRID_W; x++) {
      const i = z * GRID_W + x;
      const l = x > 0 ? i - 1 : i, r = x < GRID_W - 1 ? i + 1 : i, u = z > 0 ? i - GRID_W : i, d = z < GRID_H - 1 ? i + GRID_W : i;
      ecoTmp[i] = (culturalBias[l] + culturalBias[r] + culturalBias[u] + culturalBias[d]) * 0.25;
    }
  }
  for (let i = 0; i < GRID_N; i++) {
    if (mask[i] === 1) { culturalBias[i] = 0; continue; }
    let b = culturalBias[i];
    b += (ecoTmp[i] - b) * kb - b * kdec;
    culturalBias[i] = b > 1 ? 1 : b < -1 ? -1 : b;
  }
}

// ---- sim/sim.js ----
// One fixed sim substep: hydrology every call, ecology every TUNING.ecoEvery calls.
function simStep(world) {
  hydroStep(world);
  world.stats.time += world.params.dt;
  civStep(world, world.params.dt);
  world.ecoCount++;
  if (world.ecoCount >= TUNING.ecoEvery) {
    world.ecoCount = 0;
    const edt = world.params.dt * TUNING.ecoEvery;
    ecologyStep(world, edt);
    monolithEffects(world, edt);
  }
}

// ---- sim/prewarm.js ----
// Boot pre-warm: runs synchronous ticks so basins, rivers and rim falls exist on frame 1 (spec 3.4).
function prewarm(world, ticks, substepsPerTick) {
  const t = ticks === undefined ? TUNING.prewarmTicks : ticks;
  const s = substepsPerTick === undefined ? TUNING.prewarmSubsteps : substepsPerTick;
  for (let i = 0; i < t; i++) for (let k = 0; k < s; k++) simStep(world);
}

// ---- sim/persist.js ----
// Save / restore of the living world (spec 1.6). Typed arrays travel as base64; everything else as small JSON.
const SAVE_KEY = 'mythos.save.v1';
const SAVE_VERSION = 1;

const WORLD_F32 = ['elev', 'water', 'sediment', 'moisture', 'fertility', 'compaction', 'frustration', 'culturalBias', 'monoliths', 'monoPulse'];
const WORLD_U8 = ['engCover'];
const CIV_F32 = ['vX', 'vZ', 'vVX', 'vVZ', 'vTX', 'vTZ', 'vCargo', 'vEnergy', 'vPhase', 'vTimer', 'vHeading',
  'sX', 'sZ', 'sRot', 'sBias', 'sBuild', 'sDecay', 'sLum', 'sDirX', 'sDirZ', 'sLen', 'mX', 'mZ', 'mT0', 'mSeed', 'monoX', 'monoZ'];
const CIV_U8 = ['vRole', 'vState', 'sKind', 'sActive', 'mKind', 'mMotif'];
const CIV_I32 = ['vHome', 'vAux', 'mStruct', 'mAnniv', 'monoStruct'];
const CIV_NUM = ['nS', 'dwellings', 'nM', 'food', 'masons', 'built', 'bridges', 'revived', 'mythFlags', 'mythClock'];

function toB64(arr) {
  const bytes = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(str, Ctor, expectLen) {
  const bin = atob(str);
  if (bin.length !== expectLen * Ctor.BYTES_PER_ELEMENT) return null;
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Ctor(bytes.buffer);
}

function serializeWorld(world, extra) {
  const civ = world.civ;
  const out = { v: SAVE_VERSION, seed: world.seed, time: world.stats.time, extra: extra || null, w: {}, c: {}, n: {} };
  for (const k of WORLD_F32) out.w[k] = toB64(world[k]);
  for (const k of WORLD_U8) out.w[k] = toB64(world[k]);
  for (const k of CIV_F32) out.c[k] = toB64(civ[k]);
  for (const k of CIV_U8) out.c[k] = toB64(civ[k]);
  for (const k of CIV_I32) out.c[k] = toB64(civ[k]);
  for (const k of CIV_NUM) out.n[k] = civ[k];
  return JSON.stringify(out);
}

// Returns {ok, extra}. The world is only modified when the whole payload validates.
function restoreWorld(world, text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return { ok: false }; }
  if (!data || data.v !== SAVE_VERSION || data.seed !== world.seed || !data.w || !data.c || !data.n) return { ok: false };
  const civ = world.civ;
  const staged = [];
  try {
    for (const k of WORLD_F32) { const a = fromB64(data.w[k], Float32Array, world[k].length); if (!a) return { ok: false }; staged.push([world[k], a]); }
    for (const k of WORLD_U8) { const a = fromB64(data.w[k], Uint8Array, world[k].length); if (!a) return { ok: false }; staged.push([world[k], a]); }
    for (const k of CIV_F32) { const a = fromB64(data.c[k], Float32Array, civ[k].length); if (!a) return { ok: false }; staged.push([civ[k], a]); }
    for (const k of CIV_U8) { const a = fromB64(data.c[k], Uint8Array, civ[k].length); if (!a) return { ok: false }; staged.push([civ[k], a]); }
    for (const k of CIV_I32) { const a = fromB64(data.c[k], Int32Array, civ[k].length); if (!a) return { ok: false }; staged.push([civ[k], a]); }
    for (const k of CIV_NUM) if (typeof data.n[k] !== 'number' || !Number.isFinite(data.n[k])) return { ok: false };
  } catch (e) { return { ok: false }; }
  // sanity: elevations and fertility must be finite and in range before we trust the data
  for (const [target, src] of staged) {
    if (target === world.elev) { for (let i = 0; i < GRID_N; i++) if (!Number.isFinite(src[i]) || src[i] > 10 || src[i] < -10) return { ok: false }; }
    if (target === world.fertility) { for (let i = 0; i < GRID_N; i++) if (!(src[i] >= 0 && src[i] <= 1.0001)) return { ok: false }; }
  }
  for (const [target, src] of staged) target.set(src);
  for (const k of CIV_NUM) civ[k] = data.n[k];
  world.stats.time = data.time || 0;
  // runtime-only state that is not saved: orders restart, builders go home, unfinished works are considered done
  civ.oState.fill(0); civ.oWorker.fill(-1); civ.oStruct.fill(-1); civ.vJob.fill(-1);
  for (let v = 0; v < civ.nV; v++) { civ.vState[v] = 0; civ.vTimer[v] = Math.random() * 1.5; civ.vVX[v] = 0; civ.vVZ[v] = 0; }
  for (let s = 0; s < civ.nS; s++) if (civ.sKind[s] >= 2 && civ.sKind[s] <= 4 && civ.sBuild[s] < 1) civ.sBuild[s] = 1;
  world.vx.fill(0); world.vz.fill(0);
  world.fluxL.fill(0); world.fluxR.fill(0); world.fluxT.fill(0); world.fluxB.fill(0);
  civ.eventCursor.i = world.events.head;
  return { ok: true, extra: data.extra };
}

function saveToStorage(storage, world, extra) {
  try { storage.setItem(SAVE_KEY, serializeWorld(world, extra)); return true; } catch (e) { return false; }
}
function loadFromStorage(storage, world) {
  let text = null;
  try { text = storage.getItem(SAVE_KEY); } catch (e) { return { ok: false }; }
  if (!text) return { ok: false };
  return restoreWorld(world, text);
}

// ---- sim/shade.js ----
// Sun shadows from the heightfield (replaces a GPU shadow-map pass, which lost the WebGL context on the phone GPU).
// world.shade[i] in [0,1]: 1 = fully lit, 0 = in the shadow of higher ground. Refreshed a slice of rows per call.
function createShade() {
  return { rows: 0, sweepDone: 0 };
}

const STEPS = 14;

// Cast a ray from every cell in rows [row0, row1) toward the sun (dx,dy,dz unit vector pointing at the sun).
function computeShadeRows(world, dx, dy, dz, row0, row1) {
  const { elev, mask, shade } = world;
  const hl = Math.sqrt(dx * dx + dz * dz);
  const ux = hl > 1e-4 ? dx / hl : 0, uz = hl > 1e-4 ? dz / hl : 0;
  const slope = hl > 1e-4 ? dy / hl : 100;                  // rise per unit of horizontal travel toward the sun
  for (let z = row0; z < row1; z++) {
    for (let x = 0; x < GRID_W; x++) {
      const i = z * GRID_W + x;
      if (mask[i] === 1) { shade[i] = 1; continue; }
      const wx = -10 + (x + 0.5) * CELL_SIZE, wz = -10 + (z + 0.5) * CELL_SIZE;
      const h0 = elev[i] + 0.03;
      let lit = 1;
      let t = 0.12;
      for (let s = 0; s < STEPS; s++) {
        const px = wx + ux * t, pz = wz + uz * t;
        if (px < -10 || px > 10 || pz < -10 || pz > 10) break;
        const rayH = h0 + slope * t;
        const gap = rayH - sampleGrid(elev, px, pz);
        // soft penumbra: widen with distance travelled
        const soft = 0.04 + 0.05 * t;
        const f = gap <= -soft ? 0 : gap >= soft ? 1 : (gap + soft) / (2 * soft);
        if (f < lit) lit = f;
        if (lit <= 0) break;
        t *= 1.38;
      }
      shade[i] = lit;
    }
  }
  void GRID_H; void GRID_N;
}

// Amortised refresh: advance by `rows` rows each call; returns true when a full sweep just finished.
function stepShade(world, state, sun, rowsPerCall) {
  const r0 = state.rows;
  const r1 = Math.min(GRID_H, r0 + rowsPerCall);
  computeShadeRows(world, sun.x, sun.y, sun.z, r0, r1);
  stampObjectShadows(world, sun.x, sun.y, sun.z, r0, r1);
  state.rows = r1 >= GRID_H ? 0 : r1;
  if (r1 >= GRID_H) { state.sweepDone++; return true; }
  return false;
}

// Soft cast shadows of buildings, monoliths and myth stones as ellipses stretched away from the sun, stamped into the
// shade field for rows [row0, row1). Heights are rough world-space object heights.
function stampObjectShadows(world, dx, dy, dz, row0, row1) {
  const civ = world.civ, shade = world.shade;
  const hl = Math.sqrt(dx * dx + dz * dz);
  if (hl < 1e-4) return;
  const ux = dx / hl, uz = dz / hl;                     // toward the sun
  const rise = Math.max(0.2, dy / hl);
  for (let s = 0; s < civ.nS; s++) {
    const k = civ.sKind[s];
    let H, wide;
    if (k === KIND_DWELLING) { H = 0.55 * Math.min(1, civ.sBuild[s]); wide = 0.3; }
    else if (k === KIND_MONOLITH) { H = 1.2 * Math.min(1, civ.sBuild[s]); wide = 0.13; }
    else if (k === KIND_MYTH) { H = 0.55; wide = 0.16; }
    else continue;
    if (H <= 0.02) continue;
    const len = Math.min(1.5, H / rise);
    const along = len * 0.5 + wide;                      // semi-axis along the shadow
    const cx = civ.sX[s] - ux * len * 0.5, cz = civ.sZ[s] - uz * len * 0.5;
    const reach = along + 0.15;
    const gz0 = Math.max(row0, Math.floor(((cz - reach) + 10) / CELL_SIZE) - 1), gz1 = Math.min(row1 - 1, Math.ceil(((cz + reach) + 10) / CELL_SIZE) + 1);
    const gx0 = Math.max(0, Math.floor(((cx - reach) + 10) / CELL_SIZE) - 1), gx1 = Math.min(GRID_W - 1, Math.ceil(((cx + reach) + 10) / CELL_SIZE) + 1);
    for (let z = gz0; z <= gz1; z++) {
      for (let x = gx0; x <= gx1; x++) {
        const wx = -10 + (x + 0.5) * CELL_SIZE - cx, wz = -10 + (z + 0.5) * CELL_SIZE - cz;
        const a = wx * ux + wz * uz, b = -wx * uz + wz * ux;
        const q = (a * a) / (along * along) + (b * b) / (wide * wide);
        if (q >= 1) continue;
        const dark = 0.62 * (1 - q * q);                // soft edge, darkest at the core
        const i = z * GRID_W + x;
        const v = 1 - dark;
        if (v < shade[i]) shade[i] = v;
      }
    }
  }
}

// ---- main.js ----
const canvas = document.getElementById('stage');
const fallback = document.getElementById('fallback');
const query = new URLSearchParams(location.search);
const DEBUG = query.has('debug');
const NORENDER = DEBUG && query.has('norender');   // test aid: run the whole loop but skip the GL draw

function fail(msg) {
  fallback.textContent = msg;
  fallback.hidden = false;
  canvas.hidden = true;
}

function boot() {
  if (typeof WebGL2RenderingContext === 'undefined') {
    fail('Living Mythos needs WebGL2, which this browser does not provide.');
    return;
  }
  // Simulation first: the pre-warm blocks for a moment, and the GL context should not sit idle behind it.
  const seed = query.has('seed') ? parseInt(query.get('seed'), 10) : TUNING.seedDefault;
  const world = createWorld(seed);
  let storage = null;
  try { storage = window.localStorage; if (query.has('fresh')) storage.removeItem(SAVE_KEY); } catch (e) { storage = null; }
  // restore a saved island if there is a valid one for this seed; otherwise pre-warm and found a settlement
  const restored = storage ? loadFromStorage(storage, world) : { ok: false };
  if (!restored.ok) { prewarm(world); seedCivilization(world); }
  const particles = createParticles();
  particles.cursor.i = world.events.head;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  } catch (e) {
    fail('Could not start WebGL2 on this device.');
    return;
  }
  renderer.getContext().getExtension('OES_texture_float_linear');
  const lossLog = { lost: 0, restored: 0, lostAt: -1 };
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); lossLog.lost++; if (lossLog.lostAt < 0) lossLog.lostAt = performance.now() / 1000; }, false);
  canvas.addEventListener('webglcontextrestored', () => { lossLog.restored++; }, false);
  const caps = detectCaps(renderer);

  renderer.shadowMap.enabled = !query.has('noshadow');
  renderer.shadowMap.type = THREE.PCFShadowMap;
  if (query.get('shadowtype') === 'basic') renderer.shadowMap.type = THREE.BasicShadowMap;   // diagnostic switch
  renderer.toneMapping = THREE.NoToneMapping;

  const simTex = createSimTextures(caps.floatLinear);
  SHARED.uSimTexA.value = simTex.texA;
  SHARED.uSimTexB.value = simTex.texB;
  SHARED.uSimTexC.value = simTex.texC;
  const shadeState = createShade();
  computeShadeRows(world, SHARED.uSunDir.value.x, SHARED.uSunDir.value.y, SHARED.uSunDir.value.z, 0, 128);
  packShadeTexture(world, simTex);
  packSimTextures(world, simTex);

  // --- scene ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x6a5a78);
  scene.fog = new THREE.FogExp2(0xcc8c73, SHARED.uFogDensity.value);
  const atmoQuery = query.get('atmo');

  const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 140);
  camera.position.set(0, 8.5, 28);

  const hemi = new THREE.HemisphereLight(0x8f86c8, 0x5a4236, 1.1);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffb878, 3.2);
  sun.position.copy(SHARED.uSunDir.value).multiplyScalar(30);
  const REALSHADOW = query.has('realshadow');   // GPU shadow maps lost the WebGL context on the phone GPU; heightfield shading is the default
  sun.castShadow = REALSHADOW;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -13; sc.right = 13; sc.top = 13; sc.bottom = -13; sc.near = 1; sc.far = 80;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);

  const grid = createGridGeometry();
  scene.add(createSkyDome());
  const islandTop = createIslandTop(grid, caps);
  if (query.has('nocustomdepth')) islandTop.customDepthMaterial = null;
  scene.add(islandTop);
  scene.add(createBasaltSkirt());
  scene.add(createWaterSurface(grid, caps));
  const waterfalls = createWaterfalls(world);
  scene.add(waterfalls);
  const flora = createFlora(caps, 3500);
  scene.add(flora);
  const structures = createStructures(caps);
  scene.add(structures);
  const villagers = createVillagers(caps);
  scene.add(villagers);
  const particlePool = createParticlePool();
  scene.add(particlePool);
  scene.add(createCursor(caps));
  const cloudFx = createRaincloud();
  scene.add(cloudFx);
  const ringFx = createRingFx(world);

  if (!REALSHADOW) scene.traverse((o) => { o.castShadow = false; o.receiveShadow = false; });

  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0.5, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 9;
  controls.maxDistance = 58;
  controls.maxPolarAngle = 1.38;
  controls.update();
  controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

  // --- input + dock ---
  const dock = createDock(document.getElementById('ui'), {
    onTool: (i) => { ctl.setTool(i); },
    onAtmo: (v) => { atmo.setTarget(v); syncAtmoUi(); if (v === 0.5) dock.showHint('Orbit the camera low to see the aurora and the stars', 5000); },
    onDrift: () => { atmo.pinned = false; atmo.drift = true; syncAtmoUi(); },
  });
  const ctl = createController({
    canvas, camera, controls, world, cloud: cloudFx,
    onChange: (i) => { dock.setTool(i); dock.showHint(TOOL_HINTS[i]); },
  });
  // --- audio: created lazily on the first gesture (autoplay policy) ---
  const audio = createAudioEngine(() => new (window.AudioContext || window.webkitAudioContext)());
  const director = createDirector(world);
  const muteUi = createMuteButton(document.getElementById('ui'), (m) => audio.setMuted(m));
  const gesture = () => { if (!audio.ensure() && audio.ctx === null && !audio.failed) { audio.failed = true; } };
  window.addEventListener('pointerdown', gesture, { capture: true });
  window.addEventListener('keydown', gesture, { capture: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) audio.suspend(); else audio.resume(); });
  const aState = { atmo: 0, bias: 0, wind: 0, windSpeed: 0, flux: 0, sculpt: 0, night: 0, aurora: 0 };
  const aPv = new THREE.Vector3(), aCam = new THREE.Vector3(), aTgt = new THREE.Vector3();
  const spatial = (x, z, out) => {
    aPv.set(x, visualHeight(world.elev, x, z), z).project(camera);
    out.pan = Math.max(-1, Math.min(1, aPv.x * 0.8));
    aTgt.copy(controls.target);
    const d = Math.hypot(x - aTgt.x, z - aTgt.z);
    out.gain = (1 / (1 + d / 14)) * (Math.abs(aPv.x) > 1.2 || Math.abs(aPv.y) > 1.2 ? 0.4 : 1);
  };
  function syncAtmoUi() { dock.setAtmo(atmo.pinned ? (atmo.target < 0.25 ? 0 : atmo.target < 0.75 ? 1 : 2) : -1, !atmo.pinned && atmo.drift); }

  // --- post ---
  const post = createComposite(caps, 12);
  const atmo = createAtmosphere(scene, sun, hemi, post);
  if (restored.ok && restored.extra && restored.extra.atmo) {
    const ea = restored.extra.atmo;
    atmo.state = +ea.state || 0; atmo.target = +ea.target || 0; atmo.pinned = !!ea.pinned; atmo.drift = ea.drift !== false; atmo.driftClock = +ea.driftClock || 0;
  }
  if (atmoQuery !== null) { atmo.setTarget(parseFloat(atmoQuery)); atmo.state = atmo.target; }
  let sceneTarget = null;
  let pr = 1.5;
  let maxSubsteps = 2;
  const gov = createGovernor(pickInitialTier({
    coarse: window.matchMedia && window.matchMedia('(pointer: coarse)').matches,
    mem: navigator.deviceMemory, cores: navigator.hardwareConcurrency, override: query.get('q'),
  }));
  const dprNow = () => window.devicePixelRatio || 1;

  function resize() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Portrait phones: widen the vertical FOV so the whole island still fits across the narrow screen.
    const a = camera.aspect;
    camera.fov = a >= 1.2 ? 32 : 32 + (1.2 - Math.max(a, 0.45)) / 0.75 * 26;
    camera.updateProjectionMatrix();
    if (sceneTarget) sceneTarget.dispose();
    sceneTarget = createSceneTarget(Math.floor(w * pr), Math.floor(h * pr), caps);
    post.material.uniforms.tColor.value = sceneTarget.texture;
    post.material.uniforms.tDepth.value = sceneTarget.depthTexture;
    post.material.uniforms.uTexel.value.set(1 / sceneTarget.width, 1 / sceneTarget.height);
    post.material.uniforms.uMaxBlur.value = 6.0 * (sceneTarget.height / 900);
  }
  // Apply a quality tier (spec 2.3): pixel ratio, bokeh taps, shadow map, flora count, sim substeps per frame.
  function applyTier(i) {
    const q = QUALITY[TIER_NAMES[i]];
    pr = query.has('pr') ? parseFloat(query.get('pr')) : Math.min(dprNow(), q.pr);
    maxSubsteps = q.substeps;
    if (post.material.defines.TAPS !== q.taps) { post.material.defines.TAPS = q.taps; post.material.needsUpdate = true; }
    const shadowN = query.has('shadowsize') ? parseInt(query.get('shadowsize'), 10) : q.shadow;
    if (REALSHADOW && sun.shadow.mapSize.x !== shadowN) {
      sun.shadow.mapSize.set(shadowN, shadowN);
      if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    }
    flora.count = query.has('flora') ? Math.min(flora.userData.full, parseInt(query.get('flora'), 10)) : Math.min(flora.userData.full, q.flora);
    resize();
  }
  window.addEventListener('resize', resize);
  applyTier(gov.tier);
  if (camera.aspect < 0.9) { camera.position.multiplyScalar(1.2); controls.update(); }   // portrait phones: start a little further back

  const ATMO_KEYS = { KeyQ: 0, KeyW: 0.5, KeyE: 1 };
  window.addEventListener('keydown', (ev) => {
    if (ev.code in ATMO_KEYS) { atmo.setTarget(ATMO_KEYS[ev.code]); syncAtmoUi(); if (ev.code === 'KeyW') dock.showHint('Orbit the camera low to see the aurora and the stars', 5000); }
    else if (ev.code === 'KeyM') { audio.setMuted(!audio.muted); muteUi.set(audio.muted); }
    else if (ev.code === 'KeyP') takePhoto();
    else if (ev.code === 'KeyD') { atmo.pinned = false; atmo.drift = true; syncAtmoUi(); }
    else if (ev.code >= 'Digit1' && ev.code <= 'Digit4') ctl.setTool(parseInt(ev.code.slice(5), 10) - 1);
  });
  // --- autosave every 20 s and whenever the page is hidden; photo mode on P ---
  const save = () => { if (storage) saveToStorage(storage, world, { atmo: { state: atmo.state, target: atmo.target, pinned: atmo.pinned, drift: atmo.drift, driftClock: atmo.driftClock } }); };
  setInterval(save, 20000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  const uiEl = document.getElementById('ui');
  const photo = { busy: false, pending: false, paused: false, count: 0 };
  function takePhoto() {
    if (photo.busy) return;
    photo.busy = true;
    uiEl.classList.add('hidden');
    setTimeout(() => {
      photo.paused = true;
      pr = Math.min(dprNow(), 2.0);
      if (post.material.defines.TAPS !== 12) { post.material.defines.TAPS = 12; post.material.needsUpdate = true; }
      resize();
      photo.pending = true;
    }, 380);
  }
  function finishPhoto(blob) {
    if (blob) {
      const d = new Date(), z = (n) => String(n).padStart(2, '0');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `living-mythos-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    photo.count++;
    applyTier(gov.tier);
    photo.paused = false; photo.busy = false;
    uiEl.classList.remove('hidden');
  }
  createPhotoButton(uiEl, takePhoto);
  const debugUi = DEBUG ? createDebugOverlay() : null;
  const reporter = query.has('report') ? createReporter(renderer, canvas, {
    tier: () => TIER_NAMES[gov.tier], loss: () => lossLog, simTime: () => world.stats.time,
    input: () => ({ ...ctl.st.stats, log: ctl.st.stats.log.slice(-12), camDist: +camera.position.distanceTo(controls.target).toFixed(1), tool: ctl.st.tool, monoliths: world.monoliths.filter((v, i) => i % 4 === 3 && v).length, cursorA: +ctl.st.alpha.toFixed(2) }), villagers: () => world.civ.nV, structures: () => world.civ.nS, particles: () => particles.count,
  }) : null;
  let rock0 = 0;
  const landSum = (a, b) => { let t = 0; for (let i = 0; i < a.length; i++) if (!world.mask[i]) t += a[i] + (b ? b[i] : 0); return t; };
  if (DEBUG) rock0 = landSum(world.elev, world.sediment);

  ctl.setTool(0);
  syncAtmoUi();
  dock.showHint('Drag to orbit · pinch or scroll to zoom · pick a tool below', 6000);

  // Timer is core in three r186 (no addon copy ships in r186; see NOTES.md).
  const timer = new THREE.Timer();
  timer.connect(document);

  let simAcc = 0;
  let camSpeed = 0;
  const camPrev = new THREE.Vector3().copy(camera.position);
  let frame = 0;
  const SIM_SPEED = 2.0;      // sim seconds per real second

  function renderFrame() {
    if (query.has('nopost')) { renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
    renderer.setRenderTarget(sceneTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(post.scene, post.camera);
  }

  renderer.setAnimationLoop((time) => {
    timer.update(time);
    const rawDt = timer.getDelta();
    const dt = Math.min(rawDt, 0.05);
    SHARED.uTime.value += dt;
    if (!photo.busy) { const nt = governorSample(gov, Math.min(rawDt, 0.2)); if (nt >= 0) applyTier(nt); }

    const t0 = (DEBUG || query.has('report')) ? performance.now() : 0;
    let n = 0;
    if (!photo.paused) {
      simAcc += dt * SIM_SPEED;
      while (simAcc >= world.params.dt && n < maxSubsteps) { simStep(world); simAcc -= world.params.dt; n++; }
      if (n === 0 && simAcc > world.params.dt) simAcc = 0;
      if (n > 0) packSimTextures(world, simTex);
      if (stepShade(world, shadeState, SHARED.uSunDir.value, 8)) packShadeTexture(world, simTex);
    }
    const simMs = (DEBUG || query.has('report')) ? performance.now() - t0 : 0;

    controls.update();
    camSpeed += (camera.position.distanceTo(camPrev) / Math.max(dt, 1e-3) - camSpeed) * Math.min(1, dt * 6);
    camPrev.copy(camera.position);
    ctl.update(dt, SHARED.uTime.value);
    ringFx.update();
    {
      const cst = ctl.st;
      stepParticles(particles, world, dt, SHARED.uTime.value, SHARED.uRain.value, SHARED.uWind.value, cst.cloudVis > 0.5 && cst.rainAmt > 0.3, cst.spos[0], cst.spos[1] + 2.9, cst.spos[2], 0, 0);
      breezeLanterns(particles, cst.spos[0], cst.spos[2], 2.6, cst.breezeAmt, dt);
      particlePool.userData.update(particles);
      structures.userData.update(world, dt);
      waterfalls.userData.update(world, dt);
      villagers.userData.update(world);
    }
    if (audio.ready) {
      try {
        const sp = Math.hypot(ctl.st.svel[0], ctl.st.svel[2]);
        aCam.copy(camera.position);
        aState.atmo = SHARED.uAtmo.value; aState.night = SHARED.uNight.value; aState.aurora = SHARED.uAurora.value;
        aState.wind = Math.min(1, SHARED.uWind.value / 1.5);
        aState.windSpeed = Math.min(1, sp * 0.12 + ctl.st.breezeAmt * 0.4 + camSpeed * 0.02);
        aState.flux = Math.min(1, world.stats.flux / 120);
        aState.sculpt = Math.max(director.rumble, ctl.st.active && ctl.st.tool === 0 ? 0.55 : 0);
        aState.bias = sampleGrid(world.culturalBias, controls.target.x, controls.target.z);
        audio.update(dt, aState);
        directorStep(director, world, audio, aState, spatial, SHARED.uTime.value);
      } catch (err) { audio.ready = false; console.warn('[mythos] audio disabled:', err && err.message); }
    }
    atmo.update(dt);
    // the weather feeds back into the sim: monsoon rains harder and evaporates less; golden hour grows crops fastest
    world.params.rain = TUNING.rain * (1 + 8 * SHARED.uRain.value);
    world.params.evapMul = 1 - 0.6 * SHARED.uRain.value;
    world.params.ecoGrow = 1.3 - 0.6 * SHARED.uAurora.value - 0.3 * SHARED.uRain.value;
    post.material.uniforms.uFocusDist.value = camera.position.distanceTo(controls.target);
    if (!NORENDER) renderFrame();
    if (reporter) { reporter.maybeShot(query.get('report') || 'phone', 10); reporter.tick(rawDt, simMs, renderer.info.programs.length); }
    if (photo.pending) { photo.pending = false; canvas.toBlob(finishPhoto, 'image/png'); }
    frame++;
    if (debugUi) {
      debugUi.sample(dt, simMs);
      debugUi.update(dt, () => {
        let w = 0; for (let i = 0; i < world.water.length; i++) if (!world.mask[i]) w += world.water[i];
        const rock = landSum(world.elev, world.sediment);
        return { tier: TIER_NAMES[gov.tier], water: w, rock, drift: (rock - rock0) / rock0 * 100, villagers: world.civ.nV, structures: world.civ.nS, myths: world.civ.nM, particles: particles.count };
      });
    }
    if (DEBUG && frame === 1) console.info('[mythos] programs compiled:', renderer.info.programs.length);
  });

  if (DEBUG) {
    console.info('[mythos] caps', JSON.stringify(caps));
    // Test hook (debug builds only): lets tools/test-interact.mjs drive and inspect the live app.
    const pv = new THREE.Vector3();
    window.__mythos = {
      waterfalls,
      mods: { createAudioEngine, SCALES, degreeFreq, semiFreq, TIMBRE },
      world, ctl, atmo, camera, controls, flora, particles, structures, villagers, audio, director, photo, gov, save, takePhoto, restored,
      snapshot() { renderFrame(); return canvas.toDataURL('image/png'); },
      project(x, y, z) {
        pv.set(x, y, z).project(camera);
        const r = canvas.getBoundingClientRect();
        return [r.left + (pv.x * 0.5 + 0.5) * r.width, r.top + (-pv.y * 0.5 + 0.5) * r.height];
      },
    };
  }
}

boot();
</script>
</body>
</html>
