<!DOCTYPE html>
<html lang="en">
<head>

<title>Living Mythos</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a14; touch-action: none; overscroll-behavior: none; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2rem;
  color: #e8dcc4; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
#fallback[hidden] { display: none; }

/* ---- dock ---- */
#ui { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
#dock {
  position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex; align-items: stretch; gap: 4px; padding: 6px 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
  backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35);
  border: 1px solid rgba(255,255,255,0.20);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(255,255,255,0.05), 0 10px 30px rgba(8,6,20,0.40);
  pointer-events: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  max-width: calc(100vw - 16px);
}
#dock .sep { width: 1px; margin: 8px 4px; background: rgba(255,255,255,0.22); }
#dock button {
  all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 52px; min-height: 52px; padding: 6px 8px; border-radius: 22px;
  color: rgba(255,248,236,0.78); font-size: 10.5px; letter-spacing: 0.02em; line-height: 1;
  transition: background 0.18s, color 0.18s, transform 0.12s;
  -webkit-tap-highlight-color: transparent;
}
#dock button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#dock button:hover { background: rgba(255,255,255,0.10); color: #fff; }
#dock button:active { transform: scale(0.95); }
#dock button:focus-visible { outline: 2px solid rgba(255,225,170,0.9); outline-offset: 1px; }
#dock button[aria-pressed="true"] {
  background: linear-gradient(180deg, rgba(255,226,170,0.34), rgba(255,190,120,0.16));
  color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 0 14px rgba(255,200,130,0.28);
}
#hint {
  position: absolute; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 76px); transform: translateX(-50%);
  padding: 6px 14px; border-radius: 999px; font-size: 12.5px; color: rgba(255,250,240,0.92); white-space: nowrap;
  background: rgba(14,12,26,0.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.14);
  opacity: 0; transition: opacity 0.5s; pointer-events: none; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis;
}
#hint.show { opacity: 1; }
@media (pointer: coarse) { #dock button { min-width: 56px; min-height: 56px; } }
@media (max-width: 520px) { #dock button { min-width: 44px; padding: 6px 5px; font-size: 9.5px; } #dock { gap: 2px; padding: 5px 6px; } }
@media (prefers-reduced-motion: reduce) { #dock button, #hint { transition: none; } }

#mute {
  all: unset; box-sizing: border-box; cursor: pointer; position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto;
  color: rgba(255,248,236,0.85); background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
  backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); border: 1px solid rgba(255,255,255,0.20);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 8px 24px rgba(8,6,20,0.35); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#mute svg, #photo svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#mute:focus-visible { outline: 2px solid rgba(255,225,170,0.9); outline-offset: 2px; }
#mute[aria-pressed="true"] { color: rgba(255,200,170,0.95); }

#photo {
  all: unset; box-sizing: border-box; cursor: pointer; position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 54px); right: max(12px, env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto;
  color: rgba(255,248,236,0.85); background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
  backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); border: 1px solid rgba(255,255,255,0.20);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 8px 24px rgba(8,6,20,0.35); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#photo:focus-visible { outline: 2px solid rgba(255,225,170,0.9); outline-offset: 2px; }
#ui { transition: opacity 0.3s; }
#ui.hidden { opacity: 0; pointer-events: none; }
#ui.hidden * { pointer-events: none !important; }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"

<body>
<canvas id="stage"></canvas>
<div id="fallback" hidden></div>
<div id="ui"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- gl/caps.js ----
// Capability detection. Never throws; returns flags the renderer uses to pick fallbacks (spec 2.2).
function detectCaps(renderer) {
  const gl = renderer.getContext();
  const isGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
  const floatLinear = !!gl.getExtension('OES_texture_float_linear');
  const colorBufferFloat = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
  return {
    webgl2: isGL2,
    floatLinear,
    halfFloatTarget: colorBufferFloat,
    depthTexture: isGL2,
    maxTexSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  };
}

// ---- gl/glsl.js ----
// Shared GLSL snippets. Colours are authored in sRGB and linearised with lin().
const GLSL_SIM = /* glsl */`
uniform sampler2D uSimTexA;
uniform sampler2D uSimTexB;
uniform float uTime;
uniform float uCell;
vec2 worldToUv(vec2 xz) { return (xz + 10.0) / 20.0; }
vec4 fetchBil(sampler2D t, vec2 uv) {
#ifdef MANUAL_BILINEAR
  vec2 p = uv * 128.0 - 0.5;
  vec2 f = fract(p);
  vec2 i = (floor(p) + 0.5) / 128.0;
  float s = 1.0 / 128.0;
  vec4 a = texture(t, i), b = texture(t, i + vec2(s, 0.0));
  vec4 c = texture(t, i + vec2(0.0, s)), d = texture(t, i + vec2(s, s));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
#else
  return texture(t, uv);
#endif
}
vec4 simA(vec2 uv) { return fetchBil(uSimTexA, uv); }
vec4 simB(vec2 uv) { return fetchBil(uSimTexB, uv); }
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
`;

// Elevation with the perimeter collapsed onto the cliff ring (r = 9.2) so the basalt skirt meets it exactly.
const GLSL_TERRAIN_HEIGHT = /* glsl */`
float terrainHeight(vec2 xz, out vec2 pxz) {
  float r = length(xz) / 10.0;
  float rc = min(r, 0.92);
  pxz = r > 0.0001 ? xz * (rc / r) : xz;
  float e = simA(worldToUv(pxz)).r;
  return mix(e, -0.6, smoothstep(0.895, 0.92, r));
}
float terrainH(vec2 xz) { vec2 d; return terrainHeight(xz, d); }
`;

const GLSL_ISLAND_VERT_NORMAL = /* glsl */`
  vec2 sPxz;
  float sElev = terrainHeight(position.xz, sPxz);
  float eL = terrainH(sPxz - vec2(uCell, 0.0));
  float eR = terrainH(sPxz + vec2(uCell, 0.0));
  float eU = terrainH(sPxz - vec2(0.0, uCell));
  float eD = terrainH(sPxz + vec2(0.0, uCell));
  vec3 objectNormal = normalize(vec3(eL - eR, 2.0 * uCell, eU - eD));
`;

const GLSL_ISLAND_VERT_POS = /* glsl */`
  vec3 transformed = vec3(sPxz.x, sElev, sPxz.y);
  vWP = transformed;
  vWN = objectNormal;
  vSimUv = worldToUv(sPxz);
`;

const GLSL_ISLAND_FRAG_COLOR = /* glsl */`
  vec4 tA = simA(vSimUv);
  vec4 tB = simB(vSimUv);
  float elevF = vWP.y;
  float upN = normalize(vWN).y;
  float steep = 1.0 - smoothstep(0.55, 0.88, upN);
  float rr = length(vWP.xz) / 10.0;

  vec3 clayLo = lin(vec3(0.58, 0.40, 0.28));
  vec3 clayHi = lin(vec3(0.82, 0.68, 0.48));
  vec3 basalt = lin(vec3(0.20, 0.20, 0.24));
  vec3 dryOchre = lin(vec3(0.62, 0.54, 0.34));
  vec3 lush = lin(vec3(0.20, 0.50, 0.22));
  float hq = floor(elevF * 8.0) / 8.0;
  vec3 col = mix(clayLo, clayHi, clamp(hq / 1.2, 0.0, 1.0));
  float fert = clamp(tB.g, 0.0, 1.0) * (1.0 - tB.b * 0.8);
  vec3 grain = lin(vec3(0.74, 0.66, 0.30));
  vec3 greens = mix(mix(dryOchre, grain, smoothstep(0.12, 0.34, fert)), lush, smoothstep(0.34, 0.68, fert));
  col = mix(col, greens, smoothstep(0.04, 0.3, fert) * (1.0 - steep));
  col = mix(col, basalt, clamp(steep * 1.4 + smoothstep(0.83, 0.9, rr) * 0.9, 0.0, 1.0));
  col = mix(col, lin(vec3(0.34, 0.25, 0.18)), smoothstep(0.15, 0.6, tB.b) * 0.85);

  // stepped clay contour terraces (screen-space antialiased)
  float th = elevF * 9.0;
  float tf = fract(th);
  float fw = fwidth(th) + 1e-4;
  float lodFade = 1.0 - smoothstep(0.25, 0.6, fw);
  float lineMask = smoothstep(0.0, fw * 1.5, tf) * (1.0 - smoothstep(1.0 - fw * 1.5, 1.0, tf));
  col *= mix(1.0, mix(0.80, 1.0, lineMask), lodFade);
  float bev = smoothstep(fw, fw * 2.5, tf) * (1.0 - smoothstep(fw * 2.5, fw * 5.0, tf));
  col += 0.05 * bev * (1.0 - steep) * lodFade;

  // cavity AO / ridge highlight from the heightfield laplacian
  float tx = 2.0 / 128.0;
  float lap = (simA(vSimUv + vec2(tx, 0.0)).r + simA(vSimUv - vec2(tx, 0.0)).r
             + simA(vSimUv + vec2(0.0, tx)).r + simA(vSimUv - vec2(0.0, tx)).r) * 0.25 - tA.r;
  float cav = clamp(lap * 14.0, -0.5, 0.5);
  col *= 1.0 - 0.4 * max(cav, 0.0);
  col += 0.05 * max(-cav, 0.0);

  // wet shoreline / soaked soil
  float wetTerr = clamp(tA.g * 14.0 + tB.r * 0.6, 0.0, 1.0);
  col *= (1.0 - 0.45 * wetTerr) * (1.0 - 0.16 * uWet);
  diffuseColor.rgb = col;

  // expanding tectonic / harmonic ring waves from sculpting, monoliths and builders
  vec3 ringGlow = vec3(0.0);
  for (int k = 0; k < 8; k++) {
    vec4 rA = uRingA[k];
    vec4 rB = uRingB[k];
    float age = uTime - rA.z;
    if (rB.x > 0.0 && age > 0.0 && age < rB.y) {
      float R = age * rB.z;
      float d = length(vWP.xz - rA.xy);
      float band = exp(-pow((d - R) / 0.2, 2.0));
      float band2 = exp(-pow((d - R * 0.62) / 0.14, 2.0)) * step(0.5, rA.w) * 0.6;
      float fade = 1.0 - age / rB.y;
      vec3 gold = vec3(1.0, 0.72, 0.3), cyan = vec3(0.3, 0.95, 1.0), dust = vec3(0.75, 0.72, 0.65);
      vec3 rc = rA.w < 0.5 ? gold : (rA.w < 1.5 ? mix(gold, cyan, band2 / (band + band2 + 1e-3)) : dust);
      ringGlow += rc * (band + band2) * fade * rB.x;
    }
  }
  // warm light pools around hearths, lamps and monoliths after dark
  float pool = 0.0;
  for (int k = 0; k < 24; k++) {
    vec4 gP = uGlow[k];
    if (gP.w > 0.0) {
      vec2 gd = (vWP.xz - gP.xy) / gP.z;
      float gf = 1.0 / (1.0 + dot(gd, gd));
      pool += gP.w * gf * gf;
    }
  }
  ringGlow += col * vec3(1.0, 0.62, 0.28) * pool * uNight * 1.8;
`;

const GLSL_ISLAND_FRAG_EMISSIVE = /* glsl */`
  #include <emissivemap_fragment>
  totalEmissiveRadiance += ringGlow;
`;

// Sun-only shadowing from the CPU heightfield march: ambient light is untouched.
const GLSL_ISLAND_SHADE = /* glsl */`
  #include <lights_fragment_end>
  float shadeF = fetchBil(uSimTexC, vSimUv).r;
  reflectedLight.directDiffuse *= shadeF;
  reflectedLight.directSpecular *= shadeF;
`;

const GLSL_ISLAND_FRAG_ROUGH = /* glsl */`
  float roughnessFactor = mix(roughness, 0.26, clamp(wetTerr + uWet * 0.7, 0.0, 1.0));
`;

const GLSL_WATER_VERT = /* glsl */`
varying vec3 vWP;
varying vec2 vUv;
${GLSL_SIM}
void main() {
  vec2 xz = position.xz;
  float r = length(xz) / 10.0;
  float rc = min(r, 0.92);
  vec2 pxz = r > 0.0001 ? xz * (rc / r) : xz;
  vec4 a = simA(worldToUv(pxz));
  float y = mix(a.r + a.g + 0.004, -0.6, smoothstep(0.895, 0.92, r));
  vWP = vec3(pxz.x, y, pxz.y);
  vUv = worldToUv(pxz);
  gl_Position = projectionMatrix * viewMatrix * vec4(vWP, 1.0);
}
`;

const GLSL_WATER_FRAG = /* glsl */`
precision highp float;
varying vec3 vWP;
varying vec2 vUv;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uSkyTop;
uniform vec3 uSkyHor;
uniform vec3 uFogColor;
uniform float uFogDensity;
uniform float uRain;
${GLSL_SIM}
void main() {
  vec4 a = simA(vUv);
  float d = a.g;
  if (d < 0.008) discard;
  float t = uTime;
  vec2 flow = a.ba;
  float spd = length(flow);

  // surface normal from the water+bed height field, plus flow-advected ripples
  float s = 1.0 / 128.0;
  float hL = simA(vUv - vec2(s, 0.0)).r + simA(vUv - vec2(s, 0.0)).g;
  float hR = simA(vUv + vec2(s, 0.0)).r + simA(vUv + vec2(s, 0.0)).g;
  float hU = simA(vUv - vec2(0.0, s)).r + simA(vUv - vec2(0.0, s)).g;
  float hD = simA(vUv + vec2(0.0, s)).r + simA(vUv + vec2(0.0, s)).g;
  vec2 grad = vec2(hR - hL, hD - hU) / (2.0 * uCell);
  vec2 wp = vWP.xz * 5.0 - flow * t * 0.6;
  vec2 rip = vec2(vnoise(wp + t * 0.3) - 0.5, vnoise(wp.yx * 1.3 - t * 0.25) - 0.5);
  vec3 n = normalize(vec3(-grad.x * 0.6 - rip.x * (0.07 + 0.3 * uRain), 1.0, -grad.y * 0.6 - rip.y * (0.07 + 0.3 * uRain)));

  vec3 V = normalize(cameraPosition - vWP);
  vec3 L = normalize(uSunDir);
  vec3 R = reflect(-V, n);
  float fres = 0.04 + 0.96 * pow(1.0 - max(dot(n, V), 0.0), 5.0);

  // Beer-Lambert absorption over depth
  float trans = exp(-26.0 * d);
  vec3 shallowC = lin(vec3(0.16, 0.58, 0.62));
  vec3 deepC = lin(vec3(0.02, 0.14, 0.30));
  vec3 body = mix(deepC, shallowC, trans) * (0.45 + 0.55 * max(dot(n, L), 0.0)) * (0.5 + 0.5 * uSunColor);

  vec3 sky = mix(uSkyHor, uSkyTop, clamp(R.y, 0.0, 1.0));
  vec3 col = mix(body, sky, clamp(fres * 0.55, 0.0, 1.0));
  col += uSunColor * pow(max(dot(R, L), 0.0), 220.0) * 2.5;

  // whitewater streaks along fast flow, and shoreline foam / ripples
  vec2 fdir = spd > 0.01 ? flow / spd : vec2(1.0, 0.0);
  vec2 fp = vec2(dot(vWP.xz, fdir), dot(vWP.xz, vec2(-fdir.y, fdir.x)));
  float spc = min(spd, 2.5);
  float streak = vnoise(vec2(fp.x * 2.2 - t * spc * 0.35, fp.y * 6.0));
  float foam = smoothstep(2.4, 5.0, spd) * smoothstep(0.5, 0.85, streak) * 0.7 * (1.0 - smoothstep(0.05, 0.13, d));   // whitewater only where it is shallow and fast
  float shore = 1.0 - smoothstep(0.008, 0.028, d);
  float ring = 0.5 + 0.5 * sin(d * 110.0 - t * 1.6);
  foam = clamp(foam + shore * (0.25 + 0.25 * ring), 0.0, 0.75);
  col = mix(col, vec3(0.92, 0.96, 0.98), foam * 0.6);

  float fd = length(vWP - cameraPosition);
  col = mix(col, uFogColor, 1.0 - exp(-uFogDensity * uFogDensity * fd * fd));
  float alpha = mix(0.35, 0.95, 1.0 - trans) * smoothstep(0.008, 0.022, d);
  gl_FragColor = vec4(col, max(alpha, foam * 0.6));
}
`;

const GLSL_COMPOSITE_VERT = /* glsl */`
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// ACES filmic (Narkowicz fit) + exact sRGB encode: the only tone-map / gamma step in the pipeline.
const GLSL_COMPOSITE_FRAG = /* glsl */`
precision highp float;
varying vec2 vUv;
uniform sampler2D tColor;
uniform sampler2D tDepth;
uniform float uExposure;
uniform float uNear;
uniform float uFar;
uniform float uFocusDist;
uniform float uFocusY;
uniform float uBand;
uniform float uMaxBlur;
uniform vec2 uTexel;
uniform float uCA;
vec3 acesFilm(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 srgbEncode(vec3 c) {
  vec3 lo = c * 12.92;
  vec3 hi = 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055;
  return mix(lo, hi, step(vec3(0.0031308), c));
}
float viewDist(float d) {
  float z = d * 2.0 - 1.0;
  return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear));
}
// Circle of confusion: screen-space tilt-shift band combined with real view depth, so geometry sitting at the
// focal depth (peaks, spires, lanterns) stays razor sharp even inside the blurred bands.
float cocAt(vec2 uv) {
  float tilt = smoothstep(uBand, uBand + 0.30, abs(uv.y - uFocusY));
#ifdef NO_DEPTH
  return clamp(tilt, 0.0, 1.0);
#else
  float dist = viewDist(texture2D(tDepth, uv).x);
  float rel = abs(dist - uFocusDist) / uFocusDist;
  float inSlab = 1.0 - smoothstep(0.05, 0.24, rel);
  float depthBlur = smoothstep(0.30, 1.25, rel) * 0.26;
  return clamp(tilt * (1.0 - 0.93 * inSlab) + depthBlur, 0.0, 1.0);
#endif
}
void main() {
  float coc0 = cocAt(vUv);
  vec3 acc = texture2D(tColor, vUv).rgb;
  float wsum = 1.0;
  if (coc0 > 0.01) {
    vec2 px = uTexel * uMaxBlur * coc0;
    for (int i = 0; i < TAPS; i++) {
      float fi = float(i);
      float r = sqrt((fi + 0.5) / float(TAPS));
      float a = fi * 2.39996323;
      vec2 suv = vUv + vec2(cos(a), sin(a)) * r * px;
      float cs = cocAt(suv);
      float w = cs < coc0 * r ? cs / (coc0 * r + 1e-4) : 1.0;
      acc += texture2D(tColor, suv).rgb * w;
      wsum += w;
    }
  }
  vec3 c = acc / wsum;

  vec2 rc = vUv - 0.5;
  float r2 = dot(rc, rc);
  vec2 off = rc * r2 * uCA;
  c.r = mix(c.r, texture2D(tColor, vUv + off).r, 0.7);
  c.b = mix(c.b, texture2D(tColor, vUv - off).b, 0.7);

  float vig = smoothstep(0.92, 0.28, length(rc * vec2(1.0, 0.92) * 1.45));
  c *= mix(0.62, 1.0, vig) * uExposure;
  gl_FragColor = vec4(srgbEncode(acesFilm(c)), 1.0);
}
`;

// ---- gl/post.js ----
// Offscreen scene target (spec 4.4). Falls back to 8-bit color if half-float is unavailable.
function createSceneTarget(width, height, caps) {
  const opts = { depthBuffer: true };
  if (caps.halfFloatTarget) opts.type = THREE.HalfFloatType;
  if (caps.depthTexture) opts.depthTexture = new THREE.DepthTexture(width, height, THREE.UnsignedIntType);
  return new THREE.WebGLRenderTarget(width, height, opts);
}

// Fullscreen composite: the single place ACES tone mapping and sRGB encoding happen.
function createComposite(caps, taps) {
  const defines = { TAPS: taps };
  if (!caps.depthTexture) defines.NO_DEPTH = '';
  const material = new THREE.ShaderMaterial({
    vertexShader: GLSL_COMPOSITE_VERT,
    fragmentShader: GLSL_COMPOSITE_FRAG,
    defines,
    uniforms: {
      tColor: { value: null }, tDepth: { value: null }, uExposure: { value: 1.0 },
      uNear: { value: 0.5 }, uFar: { value: 140 }, uFocusDist: { value: 30 }, uFocusY: { value: 0.5 }, uBand: { value: 0.13 },
      uMaxBlur: { value: 6 }, uTexel: { value: new THREE.Vector2(1 / 800, 1 / 500) }, uCA: { value: 0.006 },
    },
    depthTest: false, depthWrite: false,
  });
  const scene = new THREE.Scene();
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  quad.frustumCulled = false;
  scene.add(quad);
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  return { scene, camera, material };
}

// ---- sim/grid.js ----
const GRID_W = 128;
const GRID_H = 128;
const GRID_N = GRID_W * GRID_H;
const WORLD_SIZE = 20;               // world X/Z span is [-10, 10]
const CELL_SIZE = WORLD_SIZE / GRID_W;

// ---- gl/simtex.js ----
// Two RGBA float DataTextures bridging CPU sim state to shaders (spec 3.3/4.1).
function createSimTextures(floatLinear) {
  const bufA = new Float32Array(GRID_N * 4);
  const bufB = new Float32Array(GRID_N * 4);
  const bufC = new Float32Array(GRID_N * 4);   // R = sun shade (heightfield shadows)
  const filter = floatLinear ? THREE.LinearFilter : THREE.NearestFilter;
  const make = (buf) => {
    const t = new THREE.DataTexture(buf, GRID_W, GRID_H, THREE.RGBAFormat, THREE.FloatType);
    t.magFilter = filter; t.minFilter = filter;
    t.wrapS = THREE.ClampToEdgeWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
    t.generateMipmaps = false;
    t.needsUpdate = true;
    return t;
  };
  return { bufA, bufB, bufC, texA: make(bufA), texB: make(bufB), texC: make(bufC) };
}

// A: elev, water, vx, vz   B: moisture, fertility, compaction, culturalBias
function packSimTextures(world, st) {
  const { elev, water, vx, vz, moisture, fertility, compaction, culturalBias } = world;
  const a = st.bufA, b = st.bufB;
  for (let i = 0, j = 0; i < GRID_N; i++, j += 4) {
    a[j] = elev[i]; a[j + 1] = water[i]; a[j + 2] = vx[i]; a[j + 3] = vz[i];
    b[j] = moisture[i]; b[j + 1] = fertility[i]; b[j + 2] = compaction[i]; b[j + 3] = culturalBias[i];
  }
  st.texA.needsUpdate = true;
  st.texB.needsUpdate = true;
}

// Shade factor (0 shadowed .. 1 lit) from the CPU heightfield march, into R of uSimTexC.
function packShadeTexture(world, st) {
  const sh = world.shade, c = st.bufC;
  for (let i = 0, j = 0; i < GRID_N; i++, j += 4) c[j] = sh[i];
  st.texC.needsUpdate = true;
}

// ---- gl/glsl_fx.js ----
// In-world cursor: a disc grid draped over the heightfield, drawn as a ring + aura + rotating ticks.
const GLSL_CURSOR_VERT = /* glsl */`
varying vec2 vLocal;
uniform vec4 uCursor;
${GLSL_SIM}
${GLSL_TERRAIN_HEIGHT}
void main() {
  vLocal = position.xz;
  vec2 p = uCursor.xz + position.xz * uCursor.w;
  float h = terrainH(p) + 0.06;
  gl_Position = projectionMatrix * viewMatrix * vec4(p.x, h, p.y, 1.0);
}
`;

const GLSL_CURSOR_FRAG = /* glsl */`
precision highp float;
varying vec2 vLocal;
uniform vec3 uCursorCol;
uniform float uCursorA;
uniform float uTime;
void main() {
  float r = length(vLocal);
  if (r > 1.0) discard;
  float ring = smoothstep(0.82, 0.9, r) * (1.0 - smoothstep(0.94, 1.0, r));
  float pulse = 0.5 + 0.5 * sin(uTime * 4.0 - r * 8.0);
  float aura = exp(-r * r * 2.5) * 0.12;
  float ticks = step(0.5, fract(atan(vLocal.y, vLocal.x) * 3.8197 + uTime * 0.1)) * smoothstep(0.55, 0.6, r) * (1.0 - smoothstep(0.64, 0.7, r)) * 0.35;
  vec3 c = uCursorCol;
  float a = (ring + aura + ticks * (0.6 + 0.4 * pulse)) * uCursorA;
  gl_FragColor = vec4(c * (ring * 0.9 + aura + ticks * 0.6), a);
}
`;

// ---- gl/cursor.js ----
function createCursor(caps) {
  const geo = new THREE.PlaneGeometry(2, 2, 40, 40);
  geo.rotateX(-Math.PI / 2);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 30);
  const mat = new THREE.ShaderMaterial({
    vertexShader: GLSL_CURSOR_VERT,
    fragmentShader: GLSL_CURSOR_FRAG,
    uniforms: {
      uSimTexA: SHARED.uSimTexA, uSimTexB: SHARED.uSimTexB, uTime: SHARED.uTime, uCell: SHARED.uCell,
      uCursor: SHARED.uCursor, uCursorCol: SHARED.uCursorCol, uCursorA: SHARED.uCursorA,
    },
    defines: caps.floatLinear ? {} : { MANUAL_BILINEAR: '' },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 5;
  mesh.frustumCulled = false;
  return mesh;
}

// ---- gl/cloud.js ----
const PUFFS = 16;

// Billowing cluster of cloud puffs that hovers above the filtered cursor while the Raincloud tool is used.
function createRaincloud() {
  const mat = new THREE.MeshStandardMaterial({ color: 0xe6ebf3, roughness: 1, metalness: 0, transparent: true, opacity: 0.93, emissive: 0x1a1e26 });
  const mesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), mat, PUFFS);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.castShadow = false;
  const off = new Float32Array(PUFFS * 5);
  for (let k = 0; k < PUFFS; k++) {
    const a = (k / PUFFS) * Math.PI * 2 * 2.3;
    const r = 0.15 + 0.85 * ((k * 0.61803) % 1);
    off[k * 5] = Math.cos(a) * r * 1.1;
    off[k * 5 + 1] = (((k * 0.37) % 1) - 0.4) * 0.45;
    off[k * 5 + 2] = Math.sin(a) * r * 1.1;
    off[k * 5 + 3] = 0.42 + 0.34 * ((k * 0.43) % 1);
    off[k * 5 + 4] = k * 1.7;
  }
  const m = new THREE.Matrix4();
  const slate = new THREE.Color(0x8d96a3), white = new THREE.Color(0xe6ebf3);
  mesh.userData.update = function update(t, cx, cy, cz, strength) {
    mesh.visible = strength > 0.02;
    if (!mesh.visible) return;
    mat.color.copy(white).lerp(slate, SHARED.uRain.value * 0.7);
    mat.opacity = 0.93 * Math.min(1, strength * 1.5);
    for (let k = 0; k < PUFFS; k++) {
      const o = k * 5, ph = off[o + 4];
      const s = off[o + 3] * strength * (1 + 0.13 * Math.sin(t * 1.7 + ph));
      m.makeScale(s * 1.25, s * 0.8, s * 1.25);
      m.setPosition(cx + off[o] + 0.12 * Math.sin(t * 0.6 + ph), cy + off[o + 1] + 0.05 * Math.sin(t * 1.1 + ph), cz + off[o + 2] + 0.12 * Math.cos(t * 0.5 + ph));
      mesh.setMatrixAt(k, m);
    }
    mesh.instanceMatrix.needsUpdate = true;
  };
  mesh.visible = false;
  return mesh;
}

// ---- sim/events.js ----
// Fixed-size event ring shared by renderer, particles and audio. Consumers keep their own cursor {i}.
const EV_SCULPT = 1;
const EV_RAIN_DROP = 2;
const EV_MONOLITH_PLACE = 3;
const EV_MONOLITH_PULSE = 4;
const EV_BUILD_DONE = 5;
const EV_LANTERN = 6;
const EV_CHIME = 7;
const EV_GREET = 8;
const EV_MYTH = 9;
const EV_ROCKFALL = 10;
const EV_DUST = 11;
const EV_REVIVE = 12;

const EVENT_CAP = 128;

function createEventRing() {
  return { type: new Uint8Array(EVENT_CAP), x: new Float32Array(EVENT_CAP), z: new Float32Array(EVENT_CAP), a: new Float32Array(EVENT_CAP), head: 0 };
}

function emitEvent(ring, type, x, z, a) {
  const k = ring.head % EVENT_CAP;
  ring.type[k] = type; ring.x[k] = x; ring.z[k] = z; ring.a[k] = a;
  ring.head++;
}

// Cursor object {i} starts at ring.head when the consumer is created. Returns the next unread slot index or -1.
function nextEvent(ring, cursor) {
  if (ring.head - cursor.i > EVENT_CAP) cursor.i = ring.head - EVENT_CAP;
  if (cursor.i >= ring.head) return -1;
  const k = cursor.i % EVENT_CAP;
  cursor.i++;
  return k;
}

// ---- gl/fxbridge.js ----
// Turns sim events into expanding shader ring waves (8 slots, oldest replaced).
function createRingFx(world) {
  const cursor = { i: world.events.head };
  let slot = 0;
  const birth = new Float32Array(8).fill(-100);
  const life = new Float32Array(8);

  function add(x, z, kind, strength, life_, speed) {
    const k = slot; slot = (slot + 1) % 8;
    SHARED.uRingA.value[k].set(x, z, SHARED.uTime.value, kind);
    SHARED.uRingB.value[k].set(strength, life_, speed, 0);
    birth[k] = SHARED.uTime.value; life[k] = life_;
  }

  return {
    add,
    update() {
      let k;
      while ((k = nextEvent(world.events, cursor)) >= 0) {
        const t = world.events.type[k], x = world.events.x[k], z = world.events.z[k];
        if (t === EV_SCULPT) add(x, z, 0, 0.42, 1.5, 4.0);
        else if (t === EV_MONOLITH_PLACE) add(x, z, 1, 0.8, 2.8, 5.0);
        else if (t === EV_MONOLITH_PULSE) add(x, z, 1, 0.5, 3.2, 4.2);
        else if (t === EV_BUILD_DONE) add(x, z, 2, 0.45, 1.6, 3.0);
        else if (t === EV_REVIVE) add(x, z, 1, 0.65, 2.4, 4.5);
      }
      for (let s = 0; s < 8; s++) if (SHARED.uTime.value - birth[s] > life[s]) SHARED.uRingB.value[s].x = 0;
    },
  };
}

// On-device test reporter: only active with ?report. Posts GPU info, frame stats, errors and a canvas snapshot back to the
// local server that served the page (tools/phone-server.mjs), so a real phone run can be inspected from the dev machine.
function createReporter(renderer, canvas, info) {
  const errors = [];
  const origError = console.error;
  console.error = function (...a) { errors.push(a.map(String).join(' ').slice(0, 600)); origError.apply(console, a); };
  window.addEventListener('error', (e) => errors.push('window.onerror: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => errors.push('unhandledrejection: ' + (e.reason && e.reason.message)));
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';
  const vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : 'unknown';
  let acc = 0, frames = 0, ms = 0, simMs = 0, worst = 0, sent = 0, t = 0, shotDone = false;
  const post = (path, body) => { try { fetch(path, { method: 'POST', body }); } catch (e) { /* ignore */ } };
  return {
    tick(dt, sim, programs) {
      frames++; ms += dt * 1000; simMs += sim; if (dt * 1000 > worst) worst = dt * 1000;
      acc += dt; t += dt;
      if (acc >= 2) {
        post('/report', JSON.stringify({
          t: +t.toFixed(1), n: sent++, fps: +(frames / acc).toFixed(1), frameMs: +(ms / frames).toFixed(1), worstMs: +worst.toFixed(0), simMs: +(simMs / frames).toFixed(2),
          tier: info.tier(), programs, gpu, vendor, webgl2: true, dpr: window.devicePixelRatio, screen: [screen.width, screen.height], inner: [innerWidth, innerHeight],
          canvas: [canvas.width, canvas.height], touch: navigator.maxTouchPoints, ua: navigator.userAgent, lost: gl.isContextLost(), loss: info.loss(), flags: location.search, saveKB: (() => { try { const v = localStorage.getItem('mythos.save.v1'); return v ? Math.round(v.length / 1024) : 0; } catch (e) { return -1; } })(), simTime: info.simTime ? +info.simTime().toFixed(0) : null, input: info.input ? info.input() : null, errors: errors.splice(0),
          villagers: info.villagers(), structures: info.structures(), particles: info.particles(), mem: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null,
        }));
        acc = 0; frames = 0; ms = 0; simMs = 0; worst = 0;
      }
    },
    // call right after renderFrame() in the same task so the drawing buffer is still valid
    maybeShot(label, when) {
      if (shotDone || t < when) return false;
      shotDone = true;
      try { post('/shot?name=' + label, canvas.toDataURL('image/png')); } catch (e) { errors.push('shot failed: ' + e.message); }
      return true;
    },
    post,
  };
}

// ---- gl/quality.js ----
// Quality tiers (spec 2.3). Auto-picked at boot, stepped down when frames run long; never stepped up mid-play.
const TIER_NAMES = ['low', 'mid', 'high'];
const QUALITY = {
  low: { pr: 1.0, taps: 6, shadow: 1024, flora: 1800, substeps: 1 },
  mid: { pr: 1.5, taps: 12, shadow: 2048, flora: 3500, substeps: 2 },
  high: { pr: 2.0, taps: 12, shadow: 2048, flora: 3500, substeps: 3 },
};

// env: {coarse, mem, cores, dpr, override}. Returns a tier index into TIER_NAMES.
function pickInitialTier(env) {
  if (env.override && TIER_NAMES.indexOf(env.override) >= 0) return TIER_NAMES.indexOf(env.override);
  if (env.coarse) return env.mem && env.mem <= 4 ? 0 : 1;          // phones/tablets: mid, or low on small devices
  if (env.cores && env.cores <= 2) return 0;
  return 2;
}

function createGovernor(tier) {
  return { tier, ema: 0.016, slow: 0, budget: 0.024, window: 2.0, warm: 4.0 };   // warm: ignore start-up hitches (shader compile, first uploads)
}

// Feed every frame's dt. Returns the new tier index when it drops one, else -1.
function governorSample(g, dt) {
  if (g.warm > 0) { g.warm -= dt; return -1; }
  if (dt > 0.1) dt = 0.1;                        // one hitch is not a trend
  g.ema += (dt - g.ema) * 0.1;
  if (g.ema > g.budget) g.slow += dt; else g.slow = Math.max(0, g.slow - dt * 2);
  if (g.slow > g.window && g.tier > 0) {
    g.tier--; g.slow = 0; g.ema = 0.016;                              // give the new tier a fair start
    return g.tier;
  }
  return -1;
}

// ---- audio/engine.js ----
// WebAudio synth: 16 persistent two-oscillator voices with LRU stealing, ping-pong delay, procedural convolution reverb
// and a continuous noise bus (wind / rapids / rumble). Nothing is created after boot except scheduled automation.

const VOICES = 16;
const IR_SECONDS = 3.5;

function clampFilterFreq(f) { return f < 40 ? 40 : f > 12000 ? 12000 : f; }
function clampFilterQ(q) { return q < 0.5 ? 0.5 : q > 8 ? 8 : q; }

// Stereo velvet-noise tail with an octave-up shimmer layer (spec 7).
function fillImpulseResponse(left, right, sampleRate) {
  const len = left.length;
  let s = 0x1234567;
  const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const density = 2400;                       // impulses per second
  const gap = sampleRate / density;
  for (let ch = 0; ch < 2; ch++) {
    const d = ch === 0 ? left : right;
    for (let i = 0; i < len; i += gap | 0 || 1) {
      const j = Math.min(len - 1, Math.floor(i + rnd() * gap));
      const t = j / sampleRate;
      const env = Math.exp(-t * (6.9 / 3.2)) * (t < 0.01 ? t / 0.01 : 1);     // ~60 dB over 3.2 s with a soft onset
      d[j] += (rnd() < 0.5 ? -1 : 1) * env;
    }
    // shimmer: the same tail read at double speed (one octave up), quieter and shorter
    const half = len >> 1;
    for (let i = 0; i < half; i++) d[i] += 0.32 * d[i * 2] * Math.exp(-(i / sampleRate) * 1.4);
    // gentle one-pole low-pass so the tail is velvet, not hiss
    let y = 0;
    for (let i = 0; i < len; i++) { y += (d[i] - y) * 0.55; d[i] = y * 0.35; }
  }
}

function noiseBuffer(ctx, seconds) {
  const sr = ctx.sampleRate, len = Math.floor(sr * seconds);
  const buf = ctx.createBuffer(2, len, sr);
  let s = 0xBEEF;
  const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 * 2 - 1; };
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;       // Paul Kellet pink noise
    for (let i = 0; i < len; i++) {
      const w = rnd();
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      const pink = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
      d[i] = pink * 0.8 + w * 0.2 * 0.5;
    }
  }
  return buf;
}

function createAudioEngine(makeCtx) {
  const E = {
    ctx: null, ready: false, muted: false, voices: [], order: 0, started: 0,
    nodes: null, tickClock: 0, lastTrigger: 0, triggersThisFrame: 0,
  };

  function build() {
    const ctx = makeCtx();
    E.ctx = ctx;
    // master: gain -> brickwall-ish limiter -> speakers, so dense passages (many voices + reverb + delay) can never clip
    const out = ctx.createGain(); out.gain.value = 0.8;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -9; limiter.knee.value = 6; limiter.ratio.value = 14; limiter.attack.value = 0.003; limiter.release.value = 0.22;
    out.connect(limiter); limiter.connect(ctx.destination);

    const master = ctx.createBiquadFilter(); master.type = 'lowpass'; master.frequency.value = 9000; master.Q.value = 0.7;
    const dry = ctx.createGain(); dry.gain.value = 0.85;
    master.connect(dry); dry.connect(out);

    // ping-pong delay: L -> damping low-pass -> R -> feedback -> L, with each line panned hard to its side
    const delaySend = ctx.createGain(); delaySend.gain.value = 0.22; master.connect(delaySend);
    const dL = ctx.createDelay(1.0), dR = ctx.createDelay(1.0);
    dL.delayTime.value = 0.28; dR.delayTime.value = 0.37;
    const fbR = ctx.createGain(); fbR.gain.value = 0.38;
    const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 3200;
    const pL = ctx.createStereoPanner(), pR = ctx.createStereoPanner(); pL.pan.value = -1; pR.pan.value = 1;
    delaySend.connect(dL); dL.connect(damp); damp.connect(dR); dR.connect(fbR); fbR.connect(dL);
    dL.connect(pL); dR.connect(pR); pL.connect(out); pR.connect(out);

    // convolution reverb with a procedurally synthesised 3.5 s stereo impulse response
    const conv = ctx.createConvolver();
    const ir = ctx.createBuffer(2, Math.floor(ctx.sampleRate * IR_SECONDS), ctx.sampleRate);
    fillImpulseResponse(ir.getChannelData(0), ir.getChannelData(1), ctx.sampleRate);
    conv.buffer = ir;
    const revSend = ctx.createGain(); revSend.gain.value = 0.34;
    const revOut = ctx.createGain(); revOut.gain.value = 0.9;
    master.connect(revSend); revSend.connect(conv); conv.connect(revOut); revOut.connect(out);

    // 16 persistent voices
    for (let i = 0; i < VOICES; i++) {
      const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 220;
      const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 440;
      const vg = ctx.createGain(); vg.gain.value = 0;
      const hg = ctx.createGain(); hg.gain.value = 0;
      const fm = ctx.createGain(); fm.gain.value = 0;
      const pan = ctx.createStereoPanner(); pan.pan.value = 0;
      o1.connect(vg); o2.connect(hg); hg.connect(vg); o2.connect(fm); fm.connect(o1.frequency);
      vg.connect(pan); pan.connect(master);
      o1.start(); o2.start();
      E.voices.push({ o1, o2, vg, hg, fm, pan, order: 0, busyUntil: 0 });
    }

    // continuous environment bus: one looping pink+white noise buffer through three parallel filters
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 4); src.loop = true;
    const envBus = ctx.createGain(); envBus.gain.value = 1;
    const mk = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; const g = ctx.createGain(); g.gain.value = 0; src.connect(b); b.connect(g); g.connect(envBus); return { f: b, g }; };
    const wind = mk('bandpass', 700, 1.2), river = mk('bandpass', 500, 1.5), rumble = mk('lowpass', 90, 0.8);
    envBus.connect(out);
    const envRev = ctx.createGain(); envRev.gain.value = 0.12; envBus.connect(envRev); envRev.connect(conv);
    src.start();

    E.nodes = { out, limiter, master, dry, delaySend, revSend, wind, river, rumble, envBus };
    E.ready = true;
  }

  // Create on the first user gesture only (autoplay policy), then resume.
  E.ensure = function ensure() {
    if (!E.ready) { try { build(); } catch (e) { E.ready = false; E.ctx = null; return false; } }
    if (E.ctx && E.ctx.state === 'suspended') E.ctx.resume();
    return E.ready;
  };

  function pickVoice(t) {
    let best = -1, bo = Infinity;
    for (let i = 0; i < E.voices.length; i++) { if (E.voices[i].busyUntil <= t) { if (E.voices[i].order < bo) { bo = E.voices[i].order; best = i; } } }
    let stolen = false;
    if (best < 0) {                                                     // everyone busy: steal the least recently triggered
      stolen = true; bo = Infinity;
      for (let i = 0; i < E.voices.length; i++) if (E.voices[i].order < bo) { bo = E.voices[i].order; best = i; }
    }
    E.pickedStolen = stolen;
    return E.voices[best];
  }

  // trigger a note. p: {vel, tim:{harm,harmAmt,fm,decay,attackGain}, pan, delay}
  E.trigger = function trigger(freq, vel, tim, pan, delay) {
    if (!E.ready || E.muted) return false;
    if (E.triggersThisFrame >= 8) return false;
    E.triggersThisFrame++;
    const ctx = E.ctx;
    const t = ctx.currentTime + (delay || 0);
    const v = pickVoice(t);
    const stolen = E.pickedStolen;
    v.order = ++E.order;
    const t0 = stolen ? t + 0.012 : t;                                  // stolen voices fade out first so the steal is click-free
    if (stolen) { v.vg.gain.cancelScheduledValues(t); v.vg.gain.setTargetAtTime(0, t, 0.002); }
    else v.vg.gain.cancelScheduledValues(t);
    v.o1.frequency.cancelScheduledValues(t0); v.o1.frequency.setValueAtTime(freq, t0);
    v.o2.frequency.cancelScheduledValues(t0); v.o2.frequency.setValueAtTime(freq * tim.harm, t0);
    v.fm.gain.cancelScheduledValues(t0); v.fm.gain.setValueAtTime(tim.fm * vel, t0); v.fm.gain.setTargetAtTime(0, t0, tim.decay * 0.5);
    v.hg.gain.cancelScheduledValues(t0); v.hg.gain.setValueAtTime(tim.harmAmt * vel, t0); v.hg.gain.setTargetAtTime(0, t0, tim.decay * 0.35);
    v.pan.pan.cancelScheduledValues(t0); v.pan.pan.setValueAtTime(pan < -1 ? -1 : pan > 1 ? 1 : pan, t0);
    // loudness shrinks as the texture thickens (1 voice: full; 8 busy voices: ~half)
    let busy = 0;
    for (let i = 0; i < E.voices.length; i++) if (E.voices[i].busyUntil > t) busy++;
    const peak = tim.attackGain * vel / (1 + 0.14 * busy);
    if (!stolen) v.vg.gain.setValueAtTime(0, t0);                       // fresh voices start silent; stolen ones decayed to ~0
    v.vg.gain.linearRampToValueAtTime(peak, t0 + 0.005);                // 5 ms linear attack
    v.vg.gain.setTargetAtTime(0, t0 + 0.005, tim.decay);                // exponential decay
    v.busyUntil = t0 + 0.005 + tim.decay * 5;
    return true;
  };

  function setFilter(slot, freq, q, gain, now) {
    slot.f.frequency.setTargetAtTime(clampFilterFreq(freq), now, 0.04);
    slot.f.Q.setTargetAtTime(clampFilterQ(q), now, 0.04);
    slot.g.gain.setTargetAtTime(gain < 0 ? 0 : gain > 1 ? 1 : gain, now, 0.04);
  }

  // s: {wind 0..1, windSpeed 0..1, flux 0..1, sculpt 0..1, night 0..1, aurora 0..1}
  E.update = function update(dt, s) {
    E.triggersThisFrame = 0;
    if (!E.ready) return;
    E.tickClock += dt;
    if (E.tickClock < 0.05) return;
    E.tickClock = 0;
    const now = E.ctx.currentTime, n = E.nodes;
    setFilter(n.wind, 350 + 1700 * s.wind + 900 * s.windSpeed, 0.9 + 2.5 * s.wind, 0.015 + 0.09 * s.wind + 0.05 * s.windSpeed, now);
    setFilter(n.river, 260 + 1900 * s.flux, 1.2 + 2 * s.flux, 0.01 + 0.16 * s.flux, now);
    setFilter(n.rumble, 55 + 260 * s.sculpt, 0.7 + 1.5 * s.sculpt, 0.02 + 0.5 * s.sculpt, now);
    n.master.frequency.setTargetAtTime(clampFilterFreq(9000 - 3500 * s.aurora), now, 0.2);
    n.revSend.gain.setTargetAtTime(0.3 + 0.2 * s.night, now, 0.3);
    n.out.gain.setTargetAtTime(E.muted ? 0 : 0.8, now, 0.05);
  };

  E.setMuted = function setMuted(m) {
    E.muted = !!m;
    if (E.ready) E.nodes.out.gain.setTargetAtTime(E.muted ? 0 : 0.8, E.ctx.currentTime, 0.05);
  };
  E.suspend = function suspend() { if (E.ctx && E.ctx.state === 'running') E.ctx.suspend(); };
  E.resume = function resume() { if (E.ctx && E.ctx.state === 'suspended') E.ctx.resume(); };
  return E;
}

// ---- audio/music.js ----
// Scale quantizer and timbre presets. Pentatonic / Dorian modes follow the atmosphere; the root leans with regional culture.
const SCALES = [
  { name: 'golden pentatonic', root: 62, steps: [0, 2, 4, 7, 9] },            // D major pentatonic
  { name: 'aurora dorian', root: 57, steps: [0, 2, 3, 5, 7, 9, 10] },         // A Dorian
  { name: 'monsoon minor pentatonic', root: 52, steps: [0, 3, 5, 7, 10] },    // E minor pentatonic
];

function scaleFor(atmo) { return atmo < 0.25 ? SCALES[0] : atmo < 0.75 ? SCALES[1] : SCALES[2]; }
function rootShift(bias) { return Math.round((bias < -1 ? -1 : bias > 1 ? 1 : bias) * 2); }   // -2..+2 semitones

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// degree 0 = root, counting up through the scale and across octaves (negative degrees go below the root)
function degreeMidi(scale, degree, bias) {
  const n = scale.steps.length;
  const oct = Math.floor(degree / n);
  const idx = ((degree % n) + n) % n;
  return scale.root + rootShift(bias) + scale.steps[idx] + 12 * oct;
}
function degreeFreq(scale, degree, bias) { return midiToFreq(degreeMidi(scale, degree, bias)); }
function semiFreq(scale, semis, bias) { return midiToFreq(scale.root + rootShift(bias) + semis); }

// True when a midi note belongs to the scale (any octave) at the given root shift.
function inScale(scale, midi, bias) {
  const rel = (((midi - scale.root - rootShift(bias)) % 12) + 12) % 12;
  return scale.steps.indexOf(rel) >= 0;
}

const TIMBRE = {
  marimba: { harm: 4.0, harmAmt: 0.34, fm: 0, decay: 0.20, attackGain: 0.34 },
  kalimba: { harm: 5.4, harmAmt: 0.24, fm: 0, decay: 0.34, attackGain: 0.26 },
  bell: { harm: 3.5, harmAmt: 0.38, fm: 85, decay: 0.85, attackGain: 0.22 },
  warm: { harm: 2.0, harmAmt: 0.10, fm: 0, decay: 0.65, attackGain: 0.20 },
  thump: { harm: 1.0, harmAmt: 0.0, fm: 0, decay: 0.22, attackGain: 0.40 },
};

// ---- sim/sample.js ----
// World <-> grid mapping. Cell (x,z) centre is at world -10 + (x+0.5)*CELL; the GPU textures use the same texel centres.
function worldToGridX(wx) { return (wx + WORLD_SIZE * 0.5) / WORLD_SIZE * GRID_W - 0.5; }
function worldToGridZ(wz) { return (wz + WORLD_SIZE * 0.5) / WORLD_SIZE * GRID_H - 0.5; }

// Bilinear sample of any grid channel at a world position (allocation-free).
function sampleGrid(arr, wx, wz) {
  let gx = worldToGridX(wx), gz = worldToGridZ(wz);
  if (gx < 0) gx = 0; else if (gx > GRID_W - 1.001) gx = GRID_W - 1.001;
  if (gz < 0) gz = 0; else if (gz > GRID_H - 1.001) gz = GRID_H - 1.001;
  const x0 = gx | 0, z0 = gz | 0, fx = gx - x0, fz = gz - z0;
  const i = z0 * GRID_W + x0;
  const a = arr[i], b = arr[i + 1], c = arr[i + GRID_W], d = arr[i + GRID_W + 1];
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}

// CPU twin of the vertex shader's terrainHeight(): elevation with the perimeter collapsed onto the cliff ring.
function visualHeight(elev, wx, wz) {
  const r = Math.sqrt(wx * wx + wz * wz) / 10;
  let px = wx, pz = wz;
  if (r > 0.92) { const k = 0.92 / r; px = wx * k; pz = wz * k; }
  const e = sampleGrid(elev, px, pz);
  let t = (r - 0.895) / (0.92 - 0.895);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  t = t * t * (3 - 2 * t);
  return e + (-0.6 - e) * t;
}

// 32-step march through the island's bounding volume, then 4 binary-search refinements (spec 6.1).
// Writes the hit to out.{x,y,z}; returns false on a miss. No allocation.
function raymarchHeightfield(elev, ox, oy, oz, dx, dy, dz, out) {
  const YMIN = -1.0, YMAX = 3.2, HALF = 10;
  let t0 = 0, t1 = 1e9;
  // slab test against [-HALF,HALF] x [YMIN,YMAX] x [-HALF,HALF]
  const o0 = ox, o1 = oy, o2 = oz, d0 = dx, d1 = dy, d2 = dz;
  for (let a = 0; a < 3; a++) {
    const o = a === 0 ? o0 : a === 1 ? o1 : o2;
    const d = a === 0 ? d0 : a === 1 ? d1 : d2;
    const lo = a === 1 ? YMIN : -HALF, hi = a === 1 ? YMAX : HALF;
    if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) return false; continue; }
    let ta = (lo - o) / d, tb = (hi - o) / d;
    if (ta > tb) { const s = ta; ta = tb; tb = s; }
    if (ta > t0) t0 = ta;
    if (tb < t1) t1 = tb;
    if (t0 > t1) return false;
  }
  const STEPS = 32;
  const dt = (t1 - t0) / STEPS;
  let prevT = t0;
  let tPrev = t0;
  let hit = false, tHi = 0, tLo = 0;
  for (let s = 0; s <= STEPS; s++) {
    const t = t0 + dt * s;
    const x = ox + dx * t, y = oy + dy * t, z = oz + dz * t;
    if (y <= visualHeight(elev, x, z)) { hit = true; tHi = t; tLo = s === 0 ? t0 : prevT; break; }
    prevT = t;
    tPrev = t;
  }
  if (!hit) return false;
  for (let k = 0; k < 4; k++) {
    const tm = 0.5 * (tLo + tHi);
    const x = ox + dx * tm, y = oy + dy * tm, z = oz + dz * tm;
    if (y <= visualHeight(elev, x, z)) tHi = tm; else tLo = tm;
  }
  const t = 0.5 * (tLo + tHi);
  out.x = ox + dx * t; out.y = oy + dy * t; out.z = oz + dz * t;
  void tPrev;
  return true;
}

// ---- audio/director.js ----
// Maps sim events to diegetic music (spec 7). spatial(x, z, out) fills out.pan (-1..1) and out.gain (0..1).
function createDirector(world) {
  return { cursor: { i: world.events.head }, last: new Float32Array(16), out: { pan: 0, gain: 1 }, rumble: 0, scale: SCALES[0] };
}

function play(eng, d, freq, vel, tim, delay) {
  return eng.trigger(freq, vel * d.out.gain, tim, d.out.pan, delay);
}

function directorStep(d, world, eng, s, spatial, now) {
  // s: {atmo, bias}; now = performance clock in seconds
  d.scale = scaleFor(s.atmo);
  const sc = d.scale;
  let k;
  d.rumble *= 0.94;
  while ((k = nextEvent(world.events, d.cursor)) >= 0) {
    const t = world.events.type[k], x = world.events.x[k], z = world.events.z[k], a = world.events.a[k];
    spatial(x, z, d.out);
    const bias = sampleGrid(world.culturalBias, x, z);
    if (t === EV_SCULPT) {
      // warm marimba / kalimba pluck pitched by the elevation under the brush
      const e = sampleGrid(world.elev, x, z);
      const deg = Math.max(-3, Math.min(9, Math.round(e * 4.5 - 1)));
      play(eng, d, degreeFreq(sc, deg, bias), a < 0 ? 0.55 : 0.8, TIMBRE.marimba, 0);
      d.rumble = Math.min(1, d.rumble + 0.25);
    } else if (t === EV_RAIN_DROP) {
      if (now - d.last[2] > 0.09 && Math.random() < 0.6) { d.last[2] = now; play(eng, d, degreeFreq(sc, 7 + ((Math.random() * 5) | 0), bias), 0.45, TIMBRE.kalimba, 0); }
    } else if (t === EV_BUILD_DONE) {
      // resonant warm fifth chord
      play(eng, d, semiFreq(sc, 0, bias), 0.8, TIMBRE.warm, 0);
      play(eng, d, semiFreq(sc, 7, bias), 0.7, TIMBRE.warm, 0.02);
      play(eng, d, semiFreq(sc, 12, bias), 0.6, TIMBRE.warm, 0.04);
    } else if (t === EV_MONOLITH_PLACE || t === EV_MONOLITH_PULSE || t === EV_LANTERN) {
      // crystalline bell arpeggio in the upper octave
      const up = t === EV_LANTERN ? 6 : 5;
      for (let j = 0; j < 4; j++) play(eng, d, degreeFreq(sc, up + j * 2 - (j > 2 ? 1 : 0), bias), 0.5 - j * 0.04, TIMBRE.bell, j * 0.09);
    } else if (t === EV_CHIME) {
      if (now - d.last[7] > 0.22) { d.last[7] = now; const n = 2 + ((Math.random() * 2) | 0); for (let j = 0; j < n; j++) play(eng, d, degreeFreq(sc, 8 + ((Math.random() * 4) | 0), bias), 0.32, TIMBRE.bell, j * 0.07); }
    } else if (t === EV_GREET) {
      play(eng, d, degreeFreq(sc, 2, bias), 0.4, TIMBRE.marimba, 0);
      play(eng, d, degreeFreq(sc, 4, bias), 0.34, TIMBRE.marimba, 0.12);
    } else if (t === EV_MYTH) {
      // the myth's own 4-note motif; anniversaries replay it with a root fifth underneath
      const idx = a >= 100 ? a - 100 : a;
      const civ = world.civ;
      const ann = a >= 100;
      for (let j = 0; j < 4; j++) play(eng, d, degreeFreq(sc, 4 + civ.mMotif[idx * 4 + j], bias), 0.5, TIMBRE.bell, j * (ann ? 0.26 : 0.18));
      if (ann) play(eng, d, semiFreq(sc, 7, bias) / 2, 0.5, TIMBRE.warm, 0);
    } else if (t === EV_REVIVE) {
      for (let j = 0; j < 5; j++) play(eng, d, degreeFreq(sc, 3 + j * 2, bias), 0.5, TIMBRE.bell, j * 0.07);
    } else if (t === EV_ROCKFALL) {
      d.rumble = Math.min(1, d.rumble + 0.35);
      if (now - d.last[10] > 0.25) { d.last[10] = now; play(eng, d, 55 * (1 + Math.random() * 0.3), 0.5, TIMBRE.thump, 0); }
    }
  }
}

// ---- sim/tuning.js ----
// Every pacing / physics constant lives here (spec 3.5). Runtime-mutable copies live in world.params.
const TUNING = Object.freeze({
  dtSim: 0.025,
  seedDefault: 1337,

  // hydrology
  gravity: 9.8,
  fluxDamp: 0.992,
  rain: 0.0002,          // standing-water depth/s over every land cell (soil moisture uses moistFromRain)
  evap: 0.0008,          // depth/s
  springRate: 0.5,       // depth/s at each spring cell
  springCount: 6,
  rimDrainRate: 6.0,     // fraction of water removed per second on rim cells
  velMax: 6.0,           // cells/s clamp on derived flow velocity
  minDepthVel: 1e-4,

  // erosion / deposition
  kCap: 0.35,
  kErode: 0.4,
  kDeposit: 0.6,
  maxDElev: 0.002,       // per substep
  elevFloor: 0.02,       // land never erodes below this
  erodeMinDepth: 0.002,
  depositLip: 0.03,      // deposition may raise a cell at most this far above its highest neighbour
  alluvialGain: 6.0,     // fertility gained per unit of deposited sediment

  // ecology (runs every ecoEvery hydro substeps)
  ecoEvery: 4,
  moistAbsorb: 0.8,       // 1/s toward standing-water wetness
  moistFromWater: 40.0,   // wetness = min(1, water * this)
  moistFromRain: 190,    // soil moisture gained per unit rain depth
  moistEvap: 0.03,        // 1/s
  moistElevEvap: 3.5,     // uplands dry faster: evap *= 1 + this * elev
  moistDiffuse: 0.4,
  fertGrow: 0.12,
  fertDecay: 0.05,
  fertCompactDecay: 0.08,
  compactRelax: 0.01,     // 1/s
  biasDiffuse: 0.05,
  biasDecay: 0.002,

  // player tools
  cloudRain: 0.12,        // standing water depth/s at the centre of a raincloud
  monolithRadius: 3.4,    // world units
  monolithPull: 0.45,     // 1/s pull of culturalBias toward +1 at the centre
  monolithPulseEvery: 6.0,
  steepSlope: 0.035,      // per-cell elevation gradient that counts as steep

  // civilization
  villagers: 120,
  structureCap: 600,
  dwellingCap: 40,
  startDwellings: 14,
  walkSpeed: 0.42,         // world units/s (was 0.55; slowed 2026-10-21, Jordan: villagers a little too fast)
  slopePenalty: 10,        // speed divisor: 1 + slope * this
  frustrateRate: 0.35,     // frustration/s added per villager standing on a steep or wet uncovered cell
  frustrateDecay: 0.01,    // 1/s everywhere
  coverDecay: 0.2,         // 1/s on cells under a bridge / steps / paving
  orderThreshold: 0.45,    // frustration that summons a Mason
  buildTime: 20.0,         // sim s per Mason work (was 6; pacing pass 2026-10-21)
  maxOpenOrders: 2,        // Mason orders open at once (was 4)
  orderGap: 45,            // sim s between new Mason orders, so works trickle in instead of a burst at boot
  dwellingRise: 0.04,      // build progress/s of a new dwelling (~25 sim s; was 0.08)
  maxMasons: 14,
  maxWorks: 40,            // total bridges / stairs / paving the community will ever build
  ruinFertility: 0.22,
  ruinRate: 0.045,         // decay/s when local fertility is below ruinFertility
  foodPerDwelling: 360,    // was 55: the town filled to the 40-dwelling cap within one real minute

  // island shape
  rimRadius: 0.92,
  taperStart: 0.5,
  taperEnd: 0.88,
  cliffStart: 0.86,

  // boot
  prewarmTicks: 250,

// ---- sim/tools.js ----
const MAX_MONOLITHS = 8;
const ELEV_MAX = 2.8;

// Gaussian elevation delta (positive raises, negative carves). sigma = radius / 2. Also bumps slope frustration.
function sculptAt(world, wx, wz, radius, amount) {
  const { elev, mask, frustration } = world;
  const gx = worldToGridX(wx), gz = worldToGridZ(wz);
  const rc = Math.ceil(radius / CELL_SIZE) + 1;
  const sigma = radius * 0.5, inv = 1 / (2 * sigma * sigma);
  const x0 = Math.max(1, Math.floor(gx - rc)), x1 = Math.min(GRID_W - 2, Math.ceil(gx + rc));
  const z0 = Math.max(1, Math.floor(gz - rc)), z1 = Math.min(GRID_H - 2, Math.ceil(gz + rc));
  const r2max = radius * radius;
  for (let z = z0; z <= z1; z++) {
    for (let x = x0; x <= x1; x++) {
      const i = z * GRID_W + x;
      if (mask[i] === 1) continue;
      const dx = (x - gx) * CELL_SIZE, dz = (z - gz) * CELL_SIZE;
      const d2 = dx * dx + dz * dz;
      if (d2 > r2max) continue;
      let e = elev[i] + amount * Math.exp(-d2 * inv);
      if (e > ELEV_MAX) e = ELEV_MAX; else if (e < TUNING.elevFloor) e = TUNING.elevFloor;
      elev[i] = e;
    }
  }
  // freshly steepened ground frustrates travellers immediately
  for (let z = z0; z <= z1; z++) {
    for (let x = x0; x <= x1; x++) {
      const i = z * GRID_W + x;
      if (mask[i] === 1) continue;
      const dx = (x - gx) * CELL_SIZE, dz = (z - gz) * CELL_SIZE;
      const d2 = dx * dx + dz * dz;
      if (d2 > r2max) continue;
      const sx = (elev[i + 1] - elev[i - 1]) * 0.5, sz = (elev[i + GRID_W] - elev[i - GRID_W]) * 0.5;
      if (Math.sqrt(sx * sx + sz * sz) > TUNING.steepSlope) {
        const f = frustration[i] + 0.12 * Math.exp(-d2 * inv) * Math.abs(amount) * 10;
        frustration[i] = f > 1 ? 1 : f;
      }
    }
  }
}

// Raincloud: injects standing water, soil moisture and fertility under the cloud.
function rainAt(world, wx, wz, radius, dt) {
  const { water, moisture, fertility, mask } = world;
  const gx = worldToGridX(wx), gz = worldToGridZ(wz);
  const rc = Math.ceil(radius / CELL_SIZE) + 1;
  const sigma = radius * 0.5, inv = 1 / (2 * sigma * sigma);
  const x0 = Math.max(1, Math.floor(gx - rc)), x1 = Math.min(GRID_W - 2, Math.ceil(gx + rc));
  const z0 = Math.max(1, Math.floor(gz - rc)), z1 = Math.min(GRID_H - 2, Math.ceil(gz + rc));
  const r2max = radius * radius;
  for (let z = z0; z <= z1; z++) {
    for (let x = x0; x <= x1; x++) {
      const i = z * GRID_W + x;
      if (mask[i] === 1) continue;
      const dx = (x - gx) * CELL_SIZE, dz = (z - gz) * CELL_SIZE;
      const d2 = dx * dx + dz * dz;
      if (d2 > r2max) continue;
      const w = Math.exp(-d2 * inv);
      water[i] += TUNING.cloudRain * dt * w;
      let m = moisture[i] + 0.9 * dt * w; moisture[i] = m > 1 ? 1 : m;
      let f = fertility[i] + 0.05 * dt * w; fertility[i] = f > 1 ? 1 : f;
    }
  }
}

// Up to 8 monoliths; the 9th recycles the oldest. Returns the slot used, or -1 if the spot is off-island.
function placeMonolith(world, wx, wz) {
  if (Math.sqrt(wx * wx + wz * wz) > 8.4) return -1;
  const m = world.monoliths;
  let slot = -1;
  for (let k = 0; k < MAX_MONOLITHS; k++) if (m[k * 4 + 3] === 0) { slot = k; break; }
  if (slot < 0) {
    let oldest = Infinity;
    for (let k = 0; k < MAX_MONOLITHS; k++) if (m[k * 4 + 2] < oldest) { oldest = m[k * 4 + 2]; slot = k; }
  }
  m[slot * 4] = wx; m[slot * 4 + 1] = wz; m[slot * 4 + 2] = world.stats.time; m[slot * 4 + 3] = 1;
  world.monoPulse[slot] = world.stats.time + 1.2;
  emitEvent(world.events, EV_MONOLITH_PLACE, wx, wz, slot);
  return slot;
}

// Called once per ecology tick: pulls regional culture toward Mystical, nudges fertility, fires harmonic pulses.
function monolithEffects(world, dt) {
  const { culturalBias, fertility, mask } = world;
  const m = world.monoliths;
  for (let k = 0; k < MAX_MONOLITHS; k++) {
    if (m[k * 4 + 3] === 0) continue;
    const wx = m[k * 4], wz = m[k * 4 + 1];
    const gx = worldToGridX(wx), gz = worldToGridZ(wz);
    const R = TUNING.monolithRadius, rc = Math.ceil(R / CELL_SIZE) + 1;
    const inv = 1 / (2 * (R * 0.45) * (R * 0.45)), r2max = R * R;
    const x0 = Math.max(1, Math.floor(gx - rc)), x1 = Math.min(GRID_W - 2, Math.ceil(gx + rc));
    const z0 = Math.max(1, Math.floor(gz - rc)), z1 = Math.min(GRID_H - 2, Math.ceil(gz + rc));
    for (let z = z0; z <= z1; z++) {
      for (let x = x0; x <= x1; x++) {
        const i = z * GRID_W + x;
        if (mask[i] === 1) continue;
        const dx = (x - gx) * CELL_SIZE, dz = (z - gz) * CELL_SIZE;
        const d2 = dx * dx + dz * dz;
        if (d2 > r2max) continue;
        const w = Math.exp(-d2 * inv);
        culturalBias[i] += (1 - culturalBias[i]) * TUNING.monolithPull * dt * w;
        const f = fertility[i] + 0.01 * dt * w; fertility[i] = f > 1 ? 1 : f;
      }
    }
    if (world.stats.time >= world.monoPulse[k]) {
      emitEvent(world.events, EV_MONOLITH_PULSE, wx, wz, k);
      world.monoPulse[k] = world.stats.time + TUNING.monolithPulseEvery;
    }
  }
}

// ---- input/controller.js ----
const TOOL_SCULPT = 0, TOOL_CLOUD = 1, TOOL_MONOLITH = 2, TOOL_BREEZE = 3;
const OMEGA = 18.0, ZETA = 1.0;          // critically damped spring (spec 6.1)
const HOLD_MS = 400, TAP_MS = 300, MOVE_PX = 10;
const CLOUD_HOVER = 2.9;

// Pointer/touch input, analytical raymarch cursor, spring filtering, and tool application.
function createController(o) {
  const { canvas, camera, controls, world, cloud, onChange } = o;
  const st = {
    tool: TOOL_SCULPT, active: false, alt: false, isTouch: false, touches: 0,
    downX: 0, downY: 0, downT: 0, moved: false, holdTimer: 0,
    burstT: 0, burstAlt: false,
    lastX: 0, lastY: 0, hasPointer: false, hitOk: false,
    hit: { x: 0, y: 0, z: 0 }, spos: new Float64Array(3), svel: new Float64Array(3), sInit: false,
    alpha: 0, cloudVis: 0, rainAmt: 0, breezeAmt: 0,
    stats: { touchDown: 0, mouseDown: 0, tap: 0, hold: 0, multi: 0, moved: 0, onIsland: 0, offIsland: 0, pinch: 0, orbit: 0, log: [] },
    sculptClock: 0, rockClock: 0, dropClock: 0, chimeClock: 0, placedThisPress: false, radius: 1.5,
  };
  const v = new THREE.Vector3(), dir = new THREE.Vector3();
  const cA = new THREE.Color(1.0, 0.78, 0.38), cB = new THREE.Color(0.55, 0.6, 1.0), cC = new THREE.Color(0.45, 0.9, 1.0), cD = new THREE.Color(1.0, 0.85, 0.45), cE = new THREE.Color(0.7, 1.0, 0.85);

  const note = (what) => { const L = st.stats.log; if (L.length >= 40) L.shift(); L.push(what + '@' + Math.round(performance.now() / 100) / 10); };

  function pick(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    v.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1, 0.5);
    camera.updateMatrixWorld();
    v.unproject(camera);
    dir.copy(v).sub(camera.position).normalize();
    const ok = raymarchHeightfield(world.elev, camera.position.x, camera.position.y, camera.position.z, dir.x, dir.y, dir.z, st.hit);
    // the cliff band is not a place to act on
    st.hitOk = ok && Math.hypot(st.hit.x, st.hit.z) < 8.7;
    return st.hitOk;
  }

  function beginAction(alt) {
    st.active = true; st.alt = alt; st.placedThisPress = false;
    controls.enabled = false;
  }
  function endAction() {
    st.active = false; st.placedThisPress = false;
    controls.enabled = true;
  }

  function onDown(e) {
    st.lastX = e.clientX; st.lastY = e.clientY; st.hasPointer = true;
    const touch = e.pointerType === 'touch' || e.pointerType === 'pen';
    st.isTouch = touch;
    if (touch) st.stats.touchDown++; else st.stats.mouseDown++;
    if (!touch) {
      const onIsland = pick(e.clientX, e.clientY);
      const modifier = e.ctrlKey || e.altKey || e.metaKey;
      if (e.button === 0 && onIsland && !modifier) { beginAction(e.shiftKey); try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } }
      else if (e.button === 2 && onIsland && !modifier) { beginAction(true); try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } }
      else controls.enabled = true;
      return;
    }
    st.touches++;
    if (st.touches > 1) { st.stats.multi++; note('multi-touch'); clearTimeout(st.holdTimer); st.downT = 0; endAction(); return; }   // pinch / two-finger pan belongs to the camera
    st.downX = e.clientX; st.downY = e.clientY; st.downT = performance.now(); st.moved = false;
    clearTimeout(st.holdTimer);
    if (pick(e.clientX, e.clientY)) {
      st.stats.onIsland++;
      st.holdTimer = setTimeout(() => { if (st.touches === 1 && !st.moved && pick(st.lastX, st.lastY)) { st.stats.hold++; note('hold-carve'); beginAction(true); } }, HOLD_MS);
    } else st.stats.offIsland++;
  }

  function onMove(e) {
    st.lastX = e.clientX; st.lastY = e.clientY; st.hasPointer = true;
    if (st.isTouch && st.touches === 1 && !st.moved && Math.hypot(e.clientX - st.downX, e.clientY - st.downY) > MOVE_PX) {
      st.moved = true; st.stats.moved++; note('drag'); clearTimeout(st.holdTimer);
    }
  }

  function onUp(e) {
    if (e.pointerType === 'mouse') { if (st.active) endAction(); return; }
    st.touches = Math.max(0, st.touches - 1);
    clearTimeout(st.holdTimer);
    if (st.active) { endAction(); return; }
    // a quick, stationary single touch is a tap with the current tool
    if (st.touches === 0 && st.downT && !st.moved && performance.now() - st.downT < TAP_MS) {
      if (pick(e.clientX, e.clientY)) { st.stats.tap++; note('tap:tool' + st.tool); tapAction(); }
    }
    st.downT = 0;
    if (st.touches === 0) { controls.enabled = true; st.hasPointer = st.isTouch ? false : st.hasPointer; }
  }

  function tapAction() {
    st.sInit = false;                 // snap the cursor spring to the tapped spot
    st.spos[0] = st.hit.x; st.spos[1] = st.hit.y; st.spos[2] = st.hit.z; st.svel.fill(0); st.sInit = true;
    if (st.tool === TOOL_SCULPT) { st.burstT = 0.3; st.burstAlt = false; }
    else if (st.tool === TOOL_CLOUD) { st.burstT = 2.5; st.burstAlt = false; }
    else if (st.tool === TOOL_MONOLITH) { placeMonolith(world, st.hit.x, st.hit.z); }
    else { st.burstT = 1.6; st.burstAlt = false; emitEvent(world.events, EV_CHIME, st.hit.x, st.hit.z, 1); }
  }

  function onLeave(e) { if (e.pointerType === 'mouse') st.hasPointer = false; }
  function onCancel() { st.touches = 0; clearTimeout(st.holdTimer); endAction(); st.hasPointer = false; }

  canvas.addEventListener('pointerdown', onDown, { capture: true });
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onCancel);
  canvas.addEventListener('pointerleave', onLeave);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('blur', onCancel);

  function setTool(i) {
    st.tool = i;
    st.burstT = 0;
    if (onChange) onChange(i);
  }

  // Critically damped second-order follower for one axis (semi-implicit Euler, 2 substeps).
  function spring(axis, target, dt) {
    const h = dt * 0.5;
    for (let s = 0; s < 2; s++) {
      const a = -OMEGA * OMEGA * (st.spos[axis] - target) - 2 * ZETA * OMEGA * st.svel[axis];
      st.svel[axis] += a * h;
      st.spos[axis] += st.svel[axis] * h;
    }
  }

  function update(dt, time) {
    if (st.hasPointer) pick(st.lastX, st.lastY);
    else st.hitOk = false;
    if (st.hitOk) {
      if (!st.sInit) { st.spos[0] = st.hit.x; st.spos[1] = st.hit.y; st.spos[2] = st.hit.z; st.svel.fill(0); st.sInit = true; }
      spring(0, st.hit.x, dt); spring(1, st.hit.y, dt); spring(2, st.hit.z, dt);
    } else if (st.burstT <= 0 && !st.active) st.sInit = st.sInit && st.alpha > 0.02;

    const using = st.active || st.burstT > 0;
    const alt = st.active ? st.alt : st.burstAlt;
    if (st.burstT > 0) st.burstT -= dt;
    const sx = st.spos[0], sy = st.spos[1], sz = st.spos[2];
    const showing = st.sInit && (st.hitOk || using);
    st.alpha += ((showing ? 1 : 0) - st.alpha) * Math.min(1, dt * 10);

    // cursor look per tool
    const u = SHARED.uCursor.value;
    const tool = st.tool;
    st.radius = tool === TOOL_SCULPT ? 1.5 : tool === TOOL_CLOUD ? 1.7 : tool === TOOL_MONOLITH ? 0.7 : 2.4;
    u.set(sx, sy, sz, st.radius * (1 + (using ? 0.06 * Math.sin(time * 14) : 0)));
    SHARED.uCursorCol.value.copy(tool === TOOL_SCULPT ? (alt ? cB : cA) : tool === TOOL_CLOUD ? cC : tool === TOOL_MONOLITH ? cD : cE);
    SHARED.uCursorA.value = st.alpha * (using ? 1.0 : 0.75);

    // tool effects (applied at the spring-filtered position)
    let rain = 0, breeze = 0;
    // a held press dragged off the island pauses sculpting (else it keeps digging at the frozen cursor); tap bursts still run
    if (tool === TOOL_SCULPT && using && st.sInit && (st.hitOk || !st.active)) {
      sculptAt(world, sx, sz, st.radius, (alt ? -1 : 1) * 0.9 * dt);
      st.sculptClock += dt; st.rockClock += dt;
      if (st.sculptClock > 0.28) { st.sculptClock = 0; emitEvent(world.events, EV_SCULPT, sx, sz, alt ? -1 : 1); }
      if (st.rockClock > 0.2) { st.rockClock = 0; emitEvent(world.events, EV_ROCKFALL, sx, sz, alt ? -1 : 1); }
    } else if (tool === TOOL_CLOUD && using && st.sInit) {
      rain = 1;
      rainAt(world, sx, sz, 1.6, dt);
      st.dropClock += dt;
      if (st.dropClock > 0.16) { st.dropClock = 0; emitEvent(world.events, EV_RAIN_DROP, sx + (Math.random() - 0.5), sz + (Math.random() - 0.5), 1); }
    } else if (tool === TOOL_MONOLITH && st.active && !st.placedThisPress && st.hitOk) {
      placeMonolith(world, st.hit.x, st.hit.z);
      st.placedThisPress = true;
    } else if (tool === TOOL_BREEZE && (st.hitOk && !st.isTouch || using) && st.sInit) {
      breeze = 1;
      st.chimeClock += dt;
      const sp = Math.hypot(st.svel[0], st.svel[2]);
      if (sp > 1.4 && st.chimeClock > 0.45) { st.chimeClock = 0; emitEvent(world.events, EV_CHIME, sx, sz, Math.min(1, sp / 6)); }
    }

    // cloud + wind shaders
    const cloudTarget = tool === TOOL_CLOUD && (st.hitOk || using) ? 1 : 0;
    st.cloudVis += (cloudTarget - st.cloudVis) * Math.min(1, dt * 4);
    st.rainAmt += (rain - st.rainAmt) * Math.min(1, dt * 5);
    st.breezeAmt += (breeze - st.breezeAmt) * Math.min(1, dt * 6);
    if (cloud) cloud.userData.update(time, sx, sy + CLOUD_HOVER, sz, st.cloudVis);
    SHARED.uCloud.value.set(sx, sz, 2.6, st.rainAmt);
    SHARED.uBreeze.value.set(sx, sz, 2.6, st.breezeAmt);

    // keep the camera target on the island
    const t = controls.target;
    const rr = Math.hypot(t.x, t.z);
    if (rr > 6) { t.x *= 6 / rr; t.z *= 6 / rr; }
    if (t.y < -1) t.y = -1; else if (t.y > 2) t.y = 2;
  }

  return { st, setTool, update };
}

// ---- gl/waterfall.js ----
const SECTORS = 64, SEGS = 14;

// Cascade ribbons hugging the basalt skirt, one per compass sector; width/opacity follow the real rim outflow.
function createWaterfalls(world) {
  // vertex layout: x across the ribbon (-0.5..0.5), y = v along the fall (0..1), z unused; aSector per vertex
  const pos = [], sec = [], idx = [];
  for (let s = 0; s < SECTORS; s++) {
    const base = pos.length / 3;
    for (let j = 0; j <= SEGS; j++) for (let i = 0; i < 2; i++) { pos.push(i - 0.5, j / SEGS, 0); sec.push(s); }
    for (let j = 0; j < SEGS; j++) { const a = base + j * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aSector', new THREE.Float32BufferAttribute(sec, 1));
  g.setIndex(idx);
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, -3, 0), 14);

  const flow = new Float32Array(SECTORS);
  const uFlow = { value: flow };
  const mat = new THREE.ShaderMaterial({
    uniforms: { uFlow, uTime: SHARED.uTime, uNight: SHARED.uNight, uSunColor: SHARED.uSunColor, uSkyHor: SHARED.uSkyHor },
    vertexShader: /* glsl */`
      uniform float uFlow[${SECTORS}];
      attribute float aSector;
      varying vec2 vUv;
      varying float vFlow;
      void main() {
        int k = int(aSector + 0.5);
        float fl = uFlow[k];
        float ang = (aSector + 0.5) / ${SECTORS}.0 * 6.2831853;
        float v = position.y;
        float tt = mix(-0.08, 0.5, v);            // negative: the lip, from the land edge down to the skirt top
        float y, rad;
        if (tt < 0.0) { float u = -tt / 0.08; y = -0.6 + 0.85 * u; rad = 9.2 - 0.5 * u * u; }
        else { y = -0.6 - 8.9 * pow(tt, 0.92); rad = 9.2 * pow(1.0 - tt, 0.78) * 1.012 + 0.04; }
        float width = 0.95 * (0.3 + 0.7 * fl) * (1.0 - 0.35 * v);
        vec2 dir = vec2(cos(ang), sin(ang));
        vec2 tang = vec2(-dir.y, dir.x);
        vec3 p = vec3(dir * rad + tang * position.x * width, y);
        p = vec3(p.x, y, p.y);
        vUv = vec2(position.x + 0.5, v);
        vFlow = fl;
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      varying float vFlow;
      uniform float uTime;
      uniform float uNight;
      uniform vec3 uSunColor;
      uniform vec3 uSkyHor;

  const mesh = new THREE.Mesh(g, mat);

  mesh.renderOrder = 3;

  const cellSector = new Uint8Array(world.rimCells.length);
  for (let k = 0; k < world.rimCells.length; k++) {
    const c = world.rimCells[k];
    const x = (c % 128 + 0.5) / 128 * 20 - 10, z = (((c / 128) | 0) + 0.5) / 128 * 20 - 10;
    let a = Math.atan2(z, x); if (a < 0) a += Math.PI * 2;

    sums.fill(0);
    const rim = w.rimCells, out = w.rimOut;
    for (let k = 0; k < rim.length; k++) sums[cellSector[k]] += out[rim[k]];
    const a = 1 - Math.exp(-dt / 0.6);
    let any = 0;
    for (let s = 0; s < SECTORS; s++) {
      const target = Math.pow(Math.min(1, sums[s] / 0.006), 0.6);       // 0.006 ~ the strongest sector's mean outflow per substep
      flow[s] += (target - flow[s]) * a;
      if (flow[s] > 0.03) any++;

    mesh.visible = any > 0;
  };
  mesh.userData.flow = flow;

// ---- gl/geomkit.js ----
// Tiny low-poly builder. Every vertex carries aPart = (part id, second parameter) for the shaders.
function kitNew() { return { pos: [], part: [] }; }

function kitTri(b, a, c, d, pid, ya, yc, yd) {
  b.pos.push(a[0], a[1], a[2], c[0], c[1], c[2], d[0], d[1], d[2]);
  b.part.push(pid, ya, pid, yc, pid, yd);
}

// yOf(y) maps a local y to the second part parameter (normalised height, or a fixed t for stairs).
function kitBox(b, cx, cy, cz, sx, sy, sz, pid, yOf) {
  const x0 = cx - sx / 2, x1 = cx + sx / 2, y0 = cy - sy / 2, y1 = cy + sy / 2, z0 = cz - sz / 2, z1 = cz + sz / 2;
  const v = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
  const q = (a, c, d, e) => { kitTri(b, v[a], v[c], v[d], pid, yOf(v[a][1]), yOf(v[c][1]), yOf(v[d][1])); kitTri(b, v[a], v[d], v[e], pid, yOf(v[a][1]), yOf(v[d][1]), yOf(v[e][1])); };
  q(0, 1, 2, 3); q(5, 4, 7, 6); q(4, 0, 3, 7); q(1, 5, 6, 2); q(3, 2, 6, 7); q(4, 5, 1, 0);
}

function kitFrustum(b, cx, y0, cz, r0, r1, h, sides, pid, yOf, rot) {
  const ring = (r, y) => { const o = []; for (let k = 0; k < sides; k++) { const a = (k / sides) * Math.PI * 2 + (rot || 0); o.push([cx + Math.cos(a) * r, y, cz + Math.sin(a) * r]); } return o; };
  const lo = ring(r0, y0), hi = ring(r1, y0 + h);
  for (let k = 0; k < sides; k++) {
    const k1 = (k + 1) % sides;
    kitTri(b, lo[k], lo[k1], hi[k], pid, yOf(y0), yOf(y0), yOf(y0 + h));
    kitTri(b, lo[k1], hi[k1], hi[k], pid, yOf(y0), yOf(y0 + h), yOf(y0 + h));
    kitTri(b, hi[k], hi[k1], [cx, y0 + h, cz], pid, yOf(y0 + h), yOf(y0 + h), yOf(y0 + h));

    kitTri(b, ring[k1], ring[k], [cx, y0, cz], pid, yOf(y0), yOf(y0), yOf(y0));

// Triangular prism roof; ridge runs along z. w = span in x, d = length in z.
function kitRoof(b, cx, y0, cz, w, h, d, pid, yOf) {

  kitTri(b, r1, r0, t0, pid, yb, yb, yt); kitTri(b, r1, t0, t1, pid, yb, yt, yt);
  kitTri(b, l0, t0, r0, pid, yb, yt, yb); kitTri(b, l1, r1, t1, pid, yb, yb, yt);

function kitFinish(b) {

  g.setAttribute('aPart', new THREE.Float32BufferAttribute(b.part, 2));

}

// ---- sim/civ.js ----
// Roles
const ROLE_FORAGER = 0, ROLE_HAULER = 1, ROLE_MASON = 2, ROLE_MYSTIC = 3;
// Villager states
const ST_IDLE = 0, ST_WALK = 1, ST_FORAGE = 2, ST_HAUL = 3, ST_BUILD = 4, ST_MIGRATE = 5, ST_PROCESSION = 6, ST_REST = 7, ST_GREET = 8, ST_CONSECRATE = 9;
// Structure kinds
const KIND_DWELLING = 0, KIND_MONOLITH = 1, KIND_BRIDGE = 2, KIND_STEPS = 3, KIND_PAVING = 4, KIND_MYTH = 5;
const ST_GATHER = 10;
// Myth kinds (spec 1.2)
const MYTH_BRIDGE = 1, MYTH_REVIVE = 2, MYTH_MONOLITH = 3, MYTH_FLOOD = 4, MYTH_STEPS = 5, MYTH_LANTERNS = 6;
const MYTH_MAX = 12;
const ANNIVERSARY = 120;      // sim seconds between gatherings at a myth stone

const MAX_ORDERS = 12;
const HEAD_COS = new Float32Array([1, Math.cos(0.6), Math.cos(-0.6), Math.cos(1.2), Math.cos(-1.2)]);

function createCiv() {

    nV,

    vRole: new Uint8Array(nV), vState: new Uint8Array(nV),
    vHome: new Int32Array(nV).fill(-1), vJob: new Int32Array(nV).fill(-1), vAux: new Int32Array(nV).fill(-1),
    nS: 0, dwellings: 0, sEpoch: 0,   // sEpoch: bumped when an existing slot moves, so the renderer rewrites its matrices
    sX: f(nS), sZ: f(nS), sRot: f(nS), sBias: f(nS), sBuild: f(nS), sDecay: f(nS), sLum: f(nS), sDirX: f(nS), sDirZ: f(nS), sLen: f(nS),
    sKind: new Uint8Array(nS), sActive: new Uint8Array(nS),
    oX: f(MAX_ORDERS), oZ: f(MAX_ORDERS), oDirX: f(MAX_ORDERS), oDirZ: f(MAX_ORDERS), oLen: f(MAX_ORDERS), oProg: f(MAX_ORDERS), oDust: f(MAX_ORDERS),
    oKind: new Uint8Array(MAX_ORDERS), oState: new Uint8Array(MAX_ORDERS), oWorker: new Int32Array(MAX_ORDERS).fill(-1), oStruct: new Int32Array(MAX_ORDERS).fill(-1),
    food: 0, masons: 0, built: 0, bridges: 0, revived: 0, mythFirstBridge: false,
    monoStruct: new Int32Array(8).fill(-1), monoX: new Float32Array(8), monoZ: new Float32Array(8),
    nM: 0, mX: f(MYTH_MAX), mZ: f(MYTH_MAX), mT0: f(MYTH_MAX), mSeed: f(MYTH_MAX),
    mKind: new Uint8Array(MYTH_MAX), mStruct: new Int32Array(MYTH_MAX).fill(-1), mAnniv: new Int32Array(MYTH_MAX), mMotif: new Uint8Array(MYTH_MAX * 4), mythFlags: 0, mythClock: 0,
    orderClock: 0, lastOrderT: -1e9, foundClock: 0, secClock: 0, lanternClock: 0, eventCursor: { i: 0 },
