}

function cellOf(x, z) {
  let gx = Math.round(worldToGridX(x)), gz = Math.round(worldToGridZ(z));
  if (gx < 0) gx = 0; else if (gx > GRID_W - 1) gx = GRID_W - 1;
  if (gz < 0) gz = 0; else if (gz > GRID_H - 1) gz = GRID_H - 1;
  return gz * GRID_W + gx;
}

function slopeAtCell(elev, i) {
  const x = i % GRID_W, z = (i / GRID_W) | 0;
  const l = x > 0 ? elev[i - 1] : elev[i], r = x < GRID_W - 1 ? elev[i + 1] : elev[i];
  const u = z > 0 ? elev[i - GRID_W] : elev[i], d = z < GRID_H - 1 ? elev[i + GRID_W] : elev[i];
  const gx = (r - l) * 0.5, gz = (d - u) * 0.5;
  return Math.sqrt(gx * gx + gz * gz);
}

function addStructure(civ, kind, x, z, bias, build, dirX, dirZ, len) {
  if (civ.nS >= TUNING.structureCap) return -1;
  const s = civ.nS++;
  civ.sKind[s] = kind; civ.sActive[s] = 1;
  civ.sX[s] = x; civ.sZ[s] = z; civ.sBias[s] = bias; civ.sBuild[s] = build; civ.sDecay[s] = 0; civ.sLum[s] = 0;
  civ.sDirX[s] = dirX; civ.sDirZ[s] = dirZ; civ.sLen[s] = len;
  civ.sRot[s] = Math.atan2(dirX, dirZ);
  if (kind === KIND_DWELLING) civ.dwellings++;
  return s;
}

// Found the starting dwellings and place the villagers (spec 3.4).
function seedCivilization(world) {
  const civ = world.civ, rng = world.rng;
  civ.eventCursor.i = world.events.head;
  const want = TUNING.startDwellings;
  const minD2 = 1.7 * 1.7;
  for (let attempt = 0; attempt < 6000 && civ.dwellings < want; attempt++) {
    const x = rng.range(-6.6, 6.6), z = rng.range(-6.6, 6.6);
    if (!siteOk(world, x, z, minD2, 0.5)) continue;
    addStructure(civ, KIND_DWELLING, x, z, sampleGrid(world.culturalBias, x, z), 1, Math.sin(rng.next() * 6.28), Math.cos(rng.next() * 6.28), 0);
    civ.sRot[civ.nS - 1] = rng.next() * 6.283;
  }
  // relax: if the island is too wet/steep for 14 sites, take what we found (at least a few)
  for (let v = 0; v < civ.nV; v++) {
    const role = v < 68 ? ROLE_FORAGER : v < 92 ? ROLE_HAULER : v < 102 ? ROLE_MASON : ROLE_MYSTIC;
    civ.vRole[v] = role;
    if (role === ROLE_MASON) civ.masons++;
    const home = civ.dwellings > 0 ? v % civ.dwellings : -1;
    civ.vHome[v] = home;
    const hx = home >= 0 ? civ.sX[home] : 0, hz = home >= 0 ? civ.sZ[home] : 0;
    let px = hx, pz = hz;
    for (let t = 0; t < 30; t++) {
      const a = rng.next() * 6.283, r = 0.15 + rng.next() * 0.6;
      const cx = hx + Math.cos(a) * r, cz = hz + Math.sin(a) * r;
      if (world.water[cellOf(cx, cz)] < 0.006 && Math.hypot(cx, cz) < 8.2) { px = cx; pz = cz; break; }
    }
    civ.vX[v] = px; civ.vZ[v] = pz;
    civ.vTX[v] = civ.vX[v]; civ.vTZ[v] = civ.vZ[v];
    civ.vEnergy[v] = 0.6 + rng.next() * 0.4;
    civ.vTimer[v] = rng.next() * 1.5;
    civ.vPhase[v] = rng.next() * 6.283;
    civ.vHeading[v] = rng.next() * 6.283;
    civ.vState[v] = ST_IDLE;
  }
}

function siteOk(world, x, z, minD2, minFert) {
  if (Math.hypot(x, z) > 7.6) return false;
  const i = cellOf(x, z);
  if (world.water[i] > 0.004 || world.engCover[i] !== 0) return false;
  if (slopeAtCell(world.elev, i) > 0.026) return false;
  if (world.fertility[i] < minFert) return false;
  const civ = world.civ;
  for (let s = 0; s < civ.nS; s++) {
    if (civ.sKind[s] !== KIND_DWELLING && civ.sKind[s] !== KIND_MONOLITH) continue;
    const dx = civ.sX[s] - x, dz = civ.sZ[s] - z;
    if (dx * dx + dz * dz < minD2) return false;
  }
  return true;
}

function nearestDwelling(civ, x, z, needHealthy) {
  let best = -1, bd = 1e9;
  for (let s = 0; s < civ.nS; s++) {
    if (civ.sKind[s] !== KIND_DWELLING || civ.sBuild[s] < 1) continue;
    if (needHealthy && civ.sDecay[s] > 0.5) continue;
    const dx = civ.sX[s] - x, dz = civ.sZ[s] - z, d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

function nearestMonolith(world, x, z) {
  const m = world.monoliths;
  let best = -1, bd = 1e9;
  for (let k = 0; k < 8; k++) {
    if (m[k * 4 + 3] === 0) continue;
    const dx = m[k * 4] - x, dz = m[k * 4 + 1] - z, d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}

// Local cost of stepping on a world position (slope, wading, unbridged deep water, cliff edge).
function stepCost(world, x, z) {
  const i = cellOf(x, z);
  const cov = world.engCover[i];
  let c = slopeAtCell(world.elev, i) * 14;
  const w = world.water[i];
  if (cov === 0) { if (w > 0.025) c += 2.4; if (w > 0.07) c += 22; }
  else c -= 0.35;
  if (x * x + z * z > 8.5 * 8.5) c += 60;
  return c;
}

function pickFertile(world, x, z, radius, out) {
  // best of 7 random candidate cells within radius; returns fertility, writes the cell centre to out indices
  const rng = world.rng;
  let bf = -1, bx = x, bz = z;
  for (let k = 0; k < 7; k++) {
    const a = rng.next() * 6.283, r = Math.sqrt(rng.next()) * radius;
    const cx = x + Math.cos(a) * r, cz = z + Math.sin(a) * r;
    if (cx * cx + cz * cz > 7.8 * 7.8) continue;
    const i = cellOf(cx, cz);
    if (world.water[i] > 0.02) continue;
    const f = world.fertility[i] * (1 - world.compaction[i] * 0.5);
    if (f > bf) { bf = f; bx = cx; bz = cz; }
  }
  out[0] = bx; out[1] = bz;
  return bf;
}
const tmp2 = new Float32Array(2);

function decide(world, v) {
  const civ = world.civ, rng = world.rng;
  const x = civ.vX[v], z = civ.vZ[v], e = civ.vEnergy[v], c = civ.vCargo[v], role = civ.vRole[v];
  const home = civ.vHome[v];
  civ.vTimer[v] = 0.6 + rng.next() * 1.0;

  // Mason with an assigned job keeps walking to it
  if (civ.vJob[v] >= 0) { civ.vState[v] = ST_BUILD; civ.vTX[v] = civ.oX[civ.vJob[v]]; civ.vTZ[v] = civ.oZ[civ.vJob[v]]; return; }

  let bestU = 0.08, bestA = ST_IDLE, tx = x, tz = z;

  // rest
  if (home >= 0) {
    const u = (1 - e) * (1 - e) * 1.3;
    if (u > bestU) { bestU = u; bestA = ST_REST; tx = civ.sX[home]; tz = civ.sZ[home]; }
  }
  // haul cargo home
  if (c > 0.2) {
    const d = nearestDwelling(civ, x, z, true);
    if (d >= 0) { const u = c * (role === ROLE_HAULER ? 1.25 : 1.0); if (u > bestU) { bestU = u; bestA = ST_HAUL; tx = civ.sX[d]; tz = civ.sZ[d]; civ.vAux[v] = d; } }
  }
  // forage fertile ground
  if (c < 0.7 && e > 0.15) {
    const f = pickFertile(world, x, z, 3.2, tmp2);
    if (f > 0.3) {
      const w = role === ROLE_FORAGER ? 1.0 : role === ROLE_HAULER ? 0.85 : 0.45;
      const u = (1 - c) * (0.35 + 0.65 * e) * f * w * 1.1;
      if (u > bestU) { bestU = u; bestA = ST_FORAGE; tx = tmp2[0]; tz = tmp2[1]; }
    }
  }
  // migrate away from a barren or ruined home
  if (home >= 0) {
    const hf = sampleGrid(world.fertility, civ.sX[home], civ.sZ[home]);
    if (civ.sDecay[home] > 0.5 || hf < TUNING.ruinFertility) {
      const d = nearestHealthyOther(civ, home);
      if (d >= 0 && 1.0 > bestU) { bestU = 1.0; bestA = ST_MIGRATE; tx = civ.sX[d]; tz = civ.sZ[d]; civ.vAux[v] = d; }
    }
  }
  // processions to the nearest monolith
  const mono = nearestMonolith(world, x, z);
  if (mono >= 0) {
    const bias = sampleGrid(world.culturalBias, x, z);
    const u = role === ROLE_MYSTIC ? 0.95 : 0.2 + 0.35 * Math.max(0, bias);
    if (u > bestU) {
      const a = rng.next() * 6.283;
      bestU = u; bestA = ST_PROCESSION;
      tx = world.monoliths[mono * 4] + Math.cos(a) * 0.75; tz = world.monoliths[mono * 4 + 1] + Math.sin(a) * 0.75; civ.vAux[v] = mono;

      if (civ.sKind[s] !== KIND_DWELLING || civ.sDecay[s] < 0.6) continue;
      const dx = civ.sX[s] - x, dz = civ.sZ[s] - z, d = dx * dx + dz * dz;
      if (d < bd) { bd = d; ruin = s; }
    }
    if (ruin >= 0 && 0.9 > bestU) { bestU = 0.9; bestA = ST_CONSECRATE; tx = civ.sX[ruin]; tz = civ.sZ[ruin]; civ.vAux[v] = ruin; }
  }

function nearestHealthyOther(civ, home) {
  let best = -1, bd = 1e9;
  for (let s = 0; s < civ.nS; s++) {
    if (s === home || civ.sKind[s] !== KIND_DWELLING || civ.sBuild[s] < 1 || civ.sDecay[s] > 0.3) continue;
    const dx = civ.sX[s] - civ.sX[home], dz = civ.sZ[s] - civ.sZ[home], d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

function arrive(world, v) {
  const civ = world.civ;
  const st = civ.vState[v];
  if (st === ST_FORAGE) {
    civ.vCargo[v] = Math.min(1, civ.vCargo[v] + 0.35);
    const i = cellOf(civ.vX[v], civ.vZ[v]);
    world.fertility[i] = Math.max(0, world.fertility[i] - 0.01);
  } else if (st === ST_HAUL) {
    civ.food += civ.vCargo[v] * 10;
    civ.vCargo[v] = 0;
    civ.vEnergy[v] = Math.min(1, civ.vEnergy[v] + 0.15);
  } else if (st === ST_REST) {
    civ.vEnergy[v] = Math.min(1, civ.vEnergy[v] + 0.5);
  } else if (st === ST_MIGRATE) {
    if (civ.vAux[v] >= 0) civ.vHome[v] = civ.vAux[v];
  } else if (st === ST_CONSECRATE) {
    const s = civ.vAux[v];
    if (s >= 0 && civ.sDecay[s] > 0.4) { reviveStructure(world, s); }
  } else if (st === ST_GATHER) {
    civ.vTimer[v] = 8;
    civ.vState[v] = ST_IDLE;
    return;
  } else if (st === ST_PROCESSION) {
    civ.vTimer[v] = 2.5 + world.rng.next() * 2;
    civ.lanternClock += 0;
    if (world.rng.next() < 0.45) emitEvent(world.events, EV_LANTERN, civ.vX[v], civ.vZ[v], 1);
  }
  civ.vState[v] = ST_IDLE;

// A notable thing happened here: carve a standing stone with its glyph, keep a 4-note motif for the audio leitmotif.
function recordMyth(world, kind, x, z) {
  const civ = world.civ, rng = world.rng;
  let slot = civ.nM;
  if (slot >= MYTH_MAX) {
    slot = 0;
    for (let k = 1; k < MYTH_MAX; k++) if (civ.mT0[k] < civ.mT0[slot]) slot = k;
  } else civ.nM++;
  // find a dry spot just beside the event for the stone
  let sx = x + 0.55, sz = z + 0.25;
  for (let t = 0; t < 12; t++) {
    const a = rng.next() * 6.283, r = 0.5 + rng.next() * 0.35;
    const cx = x + Math.cos(a) * r, cz = z + Math.sin(a) * r;
    if (world.water[cellOf(cx, cz)] < 0.006 && Math.hypot(cx, cz) < 8.3) { sx = cx; sz = cz; break; }
  }
  civ.mX[slot] = sx; civ.mZ[slot] = sz; civ.mKind[slot] = kind; civ.mT0[slot] = world.stats.time;
  civ.mSeed[slot] = rng.next(); civ.mAnniv[slot] = 0;
  for (let j = 0; j < 4; j++) civ.mMotif[slot * 4 + j] = (kind * 2 + ((rng.next() * 5) | 0) + j * 2) % 7;
  const dirYaw = Math.atan2(-sx, -sz);   // the stone faces the island's centre
  let st = civ.mStruct[slot];
  if (st < 0) st = addStructure(civ, KIND_MYTH, sx, sz, civ.mSeed[slot], 1, Math.sin(dirYaw), Math.cos(dirYaw), 1);
  else { civ.sX[st] = sx; civ.sZ[st] = sz; civ.sBias[st] = civ.mSeed[slot]; civ.sDecay[st] = 0; civ.sEpoch++; }
  if (st >= 0) { civ.mStruct[slot] = st; civ.sRot[st] = dirYaw; civ.sDirX[st] = Math.sin(dirYaw); civ.sDirZ[st] = Math.cos(dirYaw); civ.sLen[st] = 1; }
  emitEvent(world.events, EV_MYTH, sx, sz, slot);
  return slot;
}

function reviveStructure(world, s) {
  const civ = world.civ;
  civ.sDecay[s] = 0; civ.sLum[s] = 1; civ.revived++;
  emitEvent(world.events, EV_REVIVE, civ.sX[s], civ.sZ[s], 1);
  if ((civ.mythFlags & 2) === 0) { civ.mythFlags |= 2; recordMyth(world, MYTH_REVIVE, civ.sX[s], civ.sZ[s]); }
}

function moveVillager(world, v, dt) {
  const civ = world.civ;
  const x = civ.vX[v], z = civ.vZ[v];
  const dx = civ.vTX[v] - x, dz = civ.vTZ[v] - z;
  const dist = Math.sqrt(dx * dx + dz * dz);
  const st = civ.vState[v];
  if (st === ST_IDLE || st === ST_GREET) { civ.vVX[v] *= 0.8; civ.vVZ[v] *= 0.8; return dist; }
  if (dist < 0.12) { civ.vVX[v] = 0; civ.vVZ[v] = 0; return dist; }
  const dirx = dx / dist, dirz = dz / dist;
  // five candidate headings, lowest local cost + remaining distance wins (gradient descent on the cost field)
  let bestC = 1e9, bx = dirx, bz = dirz;
  for (let k = 0; k < 5; k++) {
    const hx = dirx * HEAD_COS[k] - dirz * HEAD_SIN[k], hz = dirx * HEAD_SIN[k] + dirz * HEAD_COS[k];
    const nx = x + hx * 0.38, nz = z + hz * 0.38;
    const rx = civ.vTX[v] - nx, rz = civ.vTZ[v] - nz;
    const cst = stepCost(world, nx, nz) + Math.sqrt(rx * rx + rz * rz) * 2.0 + (k === 0 ? 0 : 0.15);
    if (cst < bestC) { bestC = cst; bx = hx; bz = hz; }

  const i = cellOf(x, z);
  const slope = slopeAtCell(world.elev, i);
  const wet = world.water[i] > 0.025 && world.engCover[i] === 0;
  let speed = TUNING.walkSpeed / (1 + slope * TUNING.slopePenalty);
  if (world.engCover[i] !== 0) speed *= 1.4;
  if (wet) speed *= 0.5;
  if (civ.vCargo[v] > 0.3) speed *= 0.88;
  civ.vVX[v] += (bx * speed - civ.vVX[v]) * Math.min(1, dt * 6);
  civ.vVZ[v] += (bz * speed - civ.vVZ[v]) * Math.min(1, dt * 6);
  civ.vX[v] = x + civ.vVX[v] * dt;
  civ.vZ[v] = z + civ.vVZ[v] * dt;
  civ.vPhase[v] += speed * dt * 9;
  civ.vEnergy[v] = Math.max(0, civ.vEnergy[v] - 0.012 * dt);

  // footfall: wear the path, and frustration where the way is steep or wet and nobody has built anything
  const c = world.compaction[i] + 0.05 * dt;
  world.compaction[i] = c > 1 ? 1 : c;
  if ((slope > TUNING.steepSlope || world.water[i] > 0.025) && world.engCover[i] === 0) {
    const f = world.frustration[i] + TUNING.frustrateRate * dt;
    world.frustration[i] = f > 1 ? 1 : f;
  }
  return dist;
}

function startOrder(world, i, kind, x, z, dirX, dirZ, len) {
  const civ = world.civ;
  civ.lastOrderT = world.stats.time;
  civ.oKind[i] = kind; civ.oState[i] = 1; civ.oX[i] = x; civ.oZ[i] = z; civ.oDirX[i] = dirX; civ.oDirZ[i] = dirZ; civ.oLen[i] = len;
  civ.oProg[i] = 0; civ.oWorker[i] = -1; civ.oStruct[i] = -1; civ.oDust[i] = 0;
}

function scanForOrders(world) {
  const civ = world.civ, rng = world.rng;
  let free = -1, open = 0;
  for (let o = 0; o < MAX_ORDERS; o++) { if (civ.oState[o] === 0) { if (free < 0) free = o; } else open++; }
  if (free < 0 || open >= TUNING.maxOpenOrders || civ.built >= TUNING.maxWorks || world.stats.time - civ.lastOrderT < TUNING.orderGap) return;
  let bestI = -1, bestF = TUNING.orderThreshold;
  for (let k = 0; k < 140; k++) {
    const i = (rng.next() * (GRID_W * GRID_H)) | 0;
    if (world.mask[i] === 1) continue;
    const f = world.frustration[i];
    if (f > bestF && world.engCover[i] === 0) { bestF = f; bestI = i; }
  }
  for (let k = 0; k < 40; k++) {
    const v = (rng.next() * civ.nV) | 0;
    const i = cellOf(civ.vX[v], civ.vZ[v]);
    const f = world.frustration[i];
    if (f > bestF && world.engCover[i] === 0 && world.mask[i] === 0) { bestF = f; bestI = i; }
  }
  if (bestI < 0) return;
  const gx = bestI % GRID_W, gz = (bestI / GRID_W) | 0;
  const x = -10 + (gx + 0.5) * CELL_SIZE, z = -10 + (gz + 0.5) * CELL_SIZE;
  for (let o = 0; o < MAX_ORDERS; o++) {
    if (civ.oState[o] === 0) continue;
    const dx = civ.oX[o] - x, dz = civ.oZ[o] - z;
    if (dx * dx + dz * dz < 2.0 * 2.0) return;
  }
  for (let q = 0; q < civ.nS; q++) {
    const k = civ.sKind[q];
    if (k < 2 || k > 4) continue;
    const dx = civ.sX[q] - x, dz = civ.sZ[q] - z;
    if (dx * dx + dz * dz < 1.6 * 1.6) return;
  }
  const wet = world.water[bestI] > 0.025;
  const slope = slopeAtCell(world.elev, bestI);
  if (wet) {
    // span across the flow: perpendicular to the local velocity (fall back to the water-surface gradient)
    let fx = world.vx[bestI], fz = world.vz[bestI];
    let m = Math.sqrt(fx * fx + fz * fz);
    if (m < 0.05) {
      const l = world.elev[bestI - 1] + world.water[bestI - 1], r = world.elev[bestI + 1] + world.water[bestI + 1];
      const u = world.elev[bestI - GRID_W] + world.water[bestI - GRID_W], d = world.elev[bestI + GRID_W] + world.water[bestI + GRID_W];
      fx = -(r - l); fz = -(d - u); m = Math.sqrt(fx * fx + fz * fz);
    }
    if (m < 1e-6) { fx = 1; fz = 0; m = 1; }
    const dirX = -fz / m, dirZ = fx / m;
    // measure the wet width along dirX/dirZ
    let half = 0.3;
    for (let s = 0; s < 12; s++) {
      const px = x + dirX * (0.1 + s * 0.1), pz = z + dirZ * (0.1 + s * 0.1), mx = x - dirX * (0.1 + s * 0.1), mz = z - dirZ * (0.1 + s * 0.1);
      const wp = world.water[cellOf(px, pz)], wm = world.water[cellOf(mx, mz)];
      if (wp > 0.012 || wm > 0.012) half = 0.1 + s * 0.1 + 0.25;
    }
    if (half * 2 > 1.5) return;      // a lake is not something you bridge
    startOrder(world, free, KIND_BRIDGE, x, z, dirX, dirZ, half * 2 + 0.3);
  } else if (slope > TUNING.steepSlope) {
    const l = world.elev[bestI - 1], r = world.elev[bestI + 1], u = world.elev[bestI - GRID_W], d = world.elev[bestI + GRID_W];
    let gxs = r - l, gzs = d - u; const m = Math.sqrt(gxs * gxs + gzs * gzs) || 1;
    startOrder(world, free, KIND_STEPS, x, z, -gxs / m, -gzs / m, 1.1);
  } else if (world.compaction[bestI] > 0.5) {
    startOrder(world, free, KIND_PAVING, x, z, 1, 0, 0.7);
  }
}

function assignOrders(world) {
  const civ = world.civ;
  for (let o = 0; o < MAX_ORDERS; o++) {
    if (civ.oState[o] !== 1) continue;
    let best = -1, bd = 1e9;
    for (let v = 0; v < civ.nV; v++) {
      if (civ.vRole[v] !== ROLE_MASON || civ.vJob[v] >= 0) continue;
      const dx = civ.vX[v] - civ.oX[o], dz = civ.vZ[v] - civ.oZ[o], d = dx * dx + dz * dz;
      if (d < bd) { bd = d; best = v; }
    }
    if (best < 0 && civ.masons < TUNING.maxMasons) {
      for (let v = 0; v < civ.nV; v++) {
        if (civ.vRole[v] === ROLE_MASON || civ.vRole[v] === ROLE_MYSTIC || civ.vJob[v] >= 0 || civ.vCargo[v] > 0.3) continue;
        const dx = civ.vX[v] - civ.oX[o], dz = civ.vZ[v] - civ.oZ[o], d = dx * dx + dz * dz;
        if (d < bd) { bd = d; best = v; }
      }
      if (best >= 0) { civ.vRole[best] = ROLE_MASON; civ.masons++; }
    }
    if (best < 0) continue;
    civ.oState[o] = 2; civ.oWorker[o] = best; civ.vJob[best] = o;
    civ.vState[best] = ST_BUILD; civ.vTX[best] = civ.oX[o]; civ.vTZ[best] = civ.oZ[o];
  }
}

function progressBuilds(world, dt) {
  const civ = world.civ;
  for (let o = 0; o < MAX_ORDERS; o++) {
    const st = civ.oState[o];
    if (st !== 2 && st !== 3) continue;
    const w = civ.oWorker[o];
    if (w < 0) { civ.oState[o] = 0; continue; }
    const dx = civ.vX[w] - civ.oX[o], dz = civ.vZ[w] - civ.oZ[o];
    if (st === 2) {
      if (dx * dx + dz * dz < 0.2 * 0.2) {
        const s = addStructure(civ, civ.oKind[o], civ.oX[o], civ.oZ[o], 0, 0, civ.oDirX[o], civ.oDirZ[o], civ.oLen[o]);
        if (s < 0) { civ.oState[o] = 0; civ.vJob[w] = -1; civ.oWorker[o] = -1; continue; }
        civ.oStruct[o] = s; civ.oState[o] = 3; civ.vState[w] = ST_IDLE; civ.vTimer[w] = 99;
      }
      continue;
    }
    civ.vState[w] = ST_IDLE; civ.vTimer[w] = 99; civ.vVX[w] = 0; civ.vVZ[w] = 0;
    civ.oProg[o] += dt / TUNING.buildTime;
    civ.sBuild[civ.oStruct[o]] = civ.oProg[o] > 1 ? 1 : civ.oProg[o];
    civ.oDust[o] -= dt;
    if (civ.oDust[o] <= 0) { civ.oDust[o] = 0.4; emitEvent(world.events, EV_DUST, civ.oX[o] + (world.rng.next() - 0.5) * 0.3, civ.oZ[o] + (world.rng.next() - 0.5) * 0.3, 1); }
    if (civ.oProg[o] >= 1) completeOrder(world, o);
  }
}

function completeOrder(world, o) {
  const civ = world.civ;
  const s = civ.oStruct[o], kind = civ.oKind[o];
  civ.sBuild[s] = 1;
  const radius = kind === KIND_PAVING ? 0.4 : 0.2;
  markCoverFor(world, civ.oX[o], civ.oZ[o], civ.oDirX[o], civ.oDirZ[o], kind === KIND_PAVING ? 0.5 : civ.oLen[o], radius, kind);
  civ.built++; if (kind === KIND_BRIDGE) civ.bridges++;
  emitEvent(world.events, EV_BUILD_DONE, civ.oX[o], civ.oZ[o], kind);
  if (kind === KIND_BRIDGE && (civ.mythFlags & 1) === 0) { civ.mythFlags |= 1; civ.mythFirstBridge = true; recordMyth(world, MYTH_BRIDGE, civ.oX[o], civ.oZ[o]); }
  if (kind === KIND_STEPS && (civ.mythFlags & 16) === 0) { civ.mythFlags |= 16; recordMyth(world, MYTH_STEPS, civ.oX[o], civ.oZ[o]); }
  const w = civ.oWorker[o];
  civ.vJob[w] = -1; civ.vTimer[w] = 0.3; civ.vState[w] = ST_IDLE;
  civ.oState[o] = 0; civ.oWorker[o] = -1; civ.oStruct[o] = -1;
}

function markCoverFor(world, x, z, dirX, dirZ, len, radius, kind) {
  const steps = Math.max(1, Math.ceil(len / (CELL_SIZE * 0.5)));
  const rc = Math.max(1, Math.ceil(radius / CELL_SIZE));
  for (let k = 0; k <= steps; k++) {
    const t = (k / steps - 0.5) * len;
    const gx = Math.round(worldToGridX(x + dirX * t)), gz = Math.round(worldToGridZ(z + dirZ * t));
    for (let dz = -rc; dz <= rc; dz++) {
      for (let dx = -rc; dx <= rc; dx++) {
        const X = gx + dx, Z = gz + dz;
        if (X < 0 || Z < 0 || X >= GRID_W || Z >= GRID_H) continue;
        world.engCover[Z * GRID_W + X] = kind;
      }
    }
  }
}

function secondTick(world) {
  const civ = world.civ;
  // ruins: dwellings in barren ground slump; luminescence fades unless a monolith sustains it
  for (let s = 0; s < civ.nS; s++) {
    if (civ.sKind[s] !== KIND_DWELLING || civ.sBuild[s] < 1) continue;
    const f = sampleGrid(world.fertility, civ.sX[s], civ.sZ[s]);
    if (f < TUNING.ruinFertility) civ.sDecay[s] = Math.min(1, civ.sDecay[s] + TUNING.ruinRate);
    else if (civ.sDecay[s] < 1 && f > 0.4) civ.sDecay[s] = Math.max(0, civ.sDecay[s] - 0.012);
    civ.sLum[s] = Math.max(0, civ.sLum[s] - 0.05);
    civ.sBias[s] = sampleGrid(world.culturalBias, civ.sX[s], civ.sZ[s]);
  }
  // monoliths revive nearby ruins
  const m = world.monoliths;
  for (let k = 0; k < 8; k++) {
    if (m[k * 4 + 3] === 0) continue;
    for (let s = 0; s < civ.nS; s++) {
      if (civ.sKind[s] !== KIND_DWELLING || civ.sDecay[s] < 0.3) continue;
      const dx = civ.sX[s] - m[k * 4], dz = civ.sZ[s] - m[k * 4 + 1];
      if (dx * dx + dz * dz < 2.8 * 2.8) reviveStructure(world, s);
    }
  }
  // cultural drift: engineering pushes toward Industrious, tilled land toward Pastoral
  for (let s = 0; s < civ.nS; s++) {
    const k = civ.sKind[s];
    if (k === KIND_BRIDGE || k === KIND_STEPS || k === KIND_PAVING) nudgeBias(world, civ.sX[s], civ.sZ[s], 2.0, -1, 0.05);
    else if (k === KIND_DWELLING && civ.sBuild[s] >= 1 && civ.sDecay[s] < 0.5) nudgeBias(world, civ.sX[s], civ.sZ[s], 1.6, 0, 0.02);
  }
  for (let k = 0; k < civ.nM; k++) if (civ.mStruct[k] >= 0) civ.sDecay[civ.mStruct[k]] = Math.min(1, (world.stats.time - civ.mT0[k]) / 900);
  // first monolith, floods, and anniversaries at myth stones
  if ((civ.mythFlags & 4) === 0) {
    for (let k = 0; k < 8; k++) if (m[k * 4 + 3] !== 0) { civ.mythFlags |= 4; recordMyth(world, MYTH_MONOLITH, m[k * 4], m[k * 4 + 1]); break; }
  }
  for (let s = 0; s < civ.nS; s++) {
    if (civ.sKind[s] !== KIND_DWELLING || civ.sBuild[s] < 1 || civ.sDecay[s] > 0.9) continue;
    if (world.water[cellOf(civ.sX[s], civ.sZ[s])] > 0.035 && world.stats.time - civ.mythClock > 90) {
      civ.mythClock = world.stats.time;
      civ.sDecay[s] = Math.min(1, civ.sDecay[s] + 0.5);
      recordMyth(world, MYTH_FLOOD, civ.sX[s], civ.sZ[s]);
    }
  }
  for (let k = 0; k < civ.nM; k++) {
    const n = Math.floor((world.stats.time - civ.mT0[k]) / ANNIVERSARY);
    if (n > civ.mAnniv[k]) {
      civ.mAnniv[k] = n;
      emitEvent(world.events, EV_MYTH, civ.mX[k], civ.mZ[k], 100 + k);
      let called = 0;
      for (let v = 0; v < civ.nV && called < 10; v++) {
        if (civ.vJob[v] >= 0 || civ.vState[v] === ST_BUILD) continue;
        const dx = civ.vX[v] - civ.mX[k], dz = civ.vZ[v] - civ.mZ[k];
        if (dx * dx + dz * dz > 6 * 6) continue;
        const a = world.rng.next() * 6.283, r = 0.35 + world.rng.next() * 0.35;
        civ.vState[v] = ST_GATHER; civ.vTX[v] = civ.mX[k] + Math.cos(a) * r; civ.vTZ[v] = civ.mZ[k] + Math.sin(a) * r; civ.vTimer[v] = 99;
        called++;
      }
    }
  }
  // growth: spend stored food on a new dwelling in fertile ground near the busiest part of the settlement
  if (civ.food >= TUNING.foodPerDwelling && civ.dwellings < TUNING.dwellingCap) {
    const rng = world.rng;
    for (let attempt = 0; attempt < 80; attempt++) {
      const base = (rng.next() * civ.nS) | 0;
      if (civ.sKind[base] !== KIND_DWELLING || civ.sDecay[base] > 0.4) continue;
      const a = rng.next() * 6.283, r = 1.2 + rng.next() * 1.8;
      const x = civ.sX[base] + Math.cos(a) * r, z = civ.sZ[base] + Math.sin(a) * r;
      if (!siteOk(world, x, z, 1.3 * 1.3, 0.5)) continue;
      const s = addStructure(civ, KIND_DWELLING, x, z, sampleGrid(world.culturalBias, x, z), 0, 0, 1, 0);
      if (s >= 0) { civ.sRot[s] = rng.next() * 6.283; civ.food -= TUNING.foodPerDwelling * 0.7; civ.sBuild[s] = 0.02; }
      break;
    }
  }
  // dwellings under construction by the community rise on their own
  for (let s = 0; s < civ.nS; s++) {
    if (civ.sKind[s] === KIND_DWELLING && civ.sBuild[s] > 0 && civ.sBuild[s] < 1) civ.sBuild[s] = Math.min(1, civ.sBuild[s] + TUNING.dwellingRise);
  }
}

function nudgeBias(world, x, z, radius, target, rate) {
  const gx = worldToGridX(x), gz = worldToGridZ(z);
  const rc = Math.ceil(radius / CELL_SIZE);
  const x0 = Math.max(0, Math.floor(gx - rc)), x1 = Math.min(GRID_W - 1, Math.ceil(gx + rc));
  const z0 = Math.max(0, Math.floor(gz - rc)), z1 = Math.min(GRID_H - 1, Math.ceil(gz + rc));
  const r2 = radius * radius;
  for (let zz = z0; zz <= z1; zz++) {
    for (let xx = x0; xx <= x1; xx++) {
      const dx = (xx - gx) * CELL_SIZE, dz = (zz - gz) * CELL_SIZE, d2 = dx * dx + dz * dz;
      if (d2 > r2) continue;
      const i = zz * GRID_W + xx;
      world.culturalBias[i] += (target - world.culturalBias[i]) * rate * (1 - d2 / r2);
    }
  }
}

// React to sim events that villagers care about (wind chimes: greet).
function readEvents(world) {
  const civ = world.civ;
  let k;
  while ((k = nextEvent(world.events, civ.eventCursor)) >= 0) {
    if (world.events.type[k] === EV_LANTERN && (civ.mythFlags & 32) === 0) { civ.mythFlags |= 32; recordMyth(world, MYTH_LANTERNS, world.events.x[k], world.events.z[k]); continue; }
    if (world.events.type[k] !== EV_CHIME) continue;
    const cx = world.events.x[k], cz = world.events.z[k];
    let greeted = 0;
    for (let v = 0; v < civ.nV && greeted < 6; v++) {
      const dx = civ.vX[v] - cx, dz = civ.vZ[v] - cz;
      if (dx * dx + dz * dz < 2.6 * 2.6 && civ.vJob[v] < 0) {
        civ.vState[v] = ST_GREET; civ.vTimer[v] = 1.6;
        civ.vHeading[v] = Math.atan2(dx * -1, dz * -1);
        greeted++;
      }
    }
    if (greeted > 0) emitEvent(world.events, EV_GREET, cx, cz, greeted);
  }
}

// Mirror the player's monoliths into the structure pool (they rise over 1.5 s; a recycled slot rises again elsewhere).
function syncMonoliths(world, dt) {
  const civ = world.civ, m = world.monoliths;
  for (let k = 0; k < 8; k++) {
    if (m[k * 4 + 3] === 0) continue;
    let s = civ.monoStruct[k];
    if (s < 0) {
      s = addStructure(civ, KIND_MONOLITH, m[k * 4], m[k * 4 + 1], 1, 0, 0, 1, 1);
      if (s < 0) continue;
      civ.sRot[s] = world.rng.next() * 6.283;
      civ.monoStruct[k] = s; civ.monoX[k] = m[k * 4]; civ.monoZ[k] = m[k * 4 + 1];
    } else if (civ.monoX[k] !== m[k * 4] || civ.monoZ[k] !== m[k * 4 + 1]) {
      civ.sX[s] = m[k * 4]; civ.sZ[s] = m[k * 4 + 1]; civ.sBuild[s] = 0; civ.sEpoch++;
      civ.monoX[k] = m[k * 4]; civ.monoZ[k] = m[k * 4 + 1];
    }
    if (civ.sBuild[s] < 1) civ.sBuild[s] = Math.min(1, civ.sBuild[s] + dt / 1.5);
  }
}

function civStep(world, dt) {
  const civ = world.civ;
  syncMonoliths(world, dt);
  if (civ.dwellings === 0) return;
  readEvents(world);
  for (let v = 0; v < civ.nV; v++) {
    civ.vTimer[v] -= dt;
    if (civ.vState[v] === ST_GREET) { if (civ.vTimer[v] <= 0) civ.vState[v] = ST_IDLE; continue; }
    if (civ.vTimer[v] <= 0) decide(world, v);
    const dist = moveVillager(world, v, dt);
    const st = civ.vState[v];
    if (st !== ST_IDLE && st !== ST_BUILD && dist < 0.14) arrive(world, v);
    if (civ.vVX[v] * civ.vVX[v] + civ.vVZ[v] * civ.vVZ[v] > 1e-4) {
      const h = Math.atan2(civ.vVX[v], civ.vVZ[v]);
      let dh = h - civ.vHeading[v];
      while (dh > Math.PI) dh -= 6.2832;
      while (dh < -Math.PI) dh += 6.2832;
      civ.vHeading[v] += dh * Math.min(1, dt * 8);
    }
  }
  civ.orderClock += dt;
  if (civ.orderClock > 0.7) { civ.orderClock = 0; scanForOrders(world); }
  assignOrders(world);
  progressBuilds(world, dt);
  civ.secClock += dt;
  if (civ.secClock >= 1) { civ.secClock = 0; secondTick(world); }
}

// ---- gl/structures.js ----
const GLOW_N = 24;

// One parametric block mesh holding every structure archetype; shaders show the parts that belong (spec 4.2 Pool 2).
function createStructureGeometry() {
  const b = kitNew();
  const yn = (y) => y / 1.1;
  const flat = (t) => () => t;

  // --- common plinth
  kitBox(b, 0, 0.04, 0, 0.64, 0.08, 0.64, 0, yn);

  // --- Pastoral cottage with a windmill (pid 1 wall, 2 thatch, 5 blades, 13 post)
  kitBox(b, 0, 0.21, 0, 0.44, 0.26, 0.36, 1, yn);
  kitRoof(b, 0, 0.34, 0, 0.58, 0.2, 0.46, 2, yn);
  kitBox(b, 0.12, 0.47, -0.08, 0.06, 0.12, 0.06, 1, yn);
  kitBox(b, 0.38, 0.22, 0.0, 0.05, 0.28, 0.05, 13, yn);
  for (let k = 0; k < 4; k++) {
    const a = (k / 4) * Math.PI * 2;
    kitBox(b, 0.38 + Math.cos(a) * 0.15, 0.40 + Math.sin(a) * 0.15, 0.06, Math.abs(Math.cos(a)) > 0.5 ? 0.3 : 0.05, Math.abs(Math.sin(a)) > 0.5 ? 0.3 : 0.05, 0.012, 5, yn);
  }

  // --- Industrious quarry house (pid 11 basalt blocks, 4 forge chimney, 14 aqueduct arch)
  kitBox(b, 0, 0.15, 0, 0.5, 0.14, 0.5, 11, yn);
  kitBox(b, 0, 0.29, 0, 0.38, 0.14, 0.38, 11, yn);
  kitBox(b, 0, 0.42, 0, 0.24, 0.12, 0.24, 11, yn);
  kitBox(b, 0.14, 0.62, 0.1, 0.07, 0.3, 0.07, 4, yn);
  kitBox(b, -0.34, 0.2, 0.3, 0.06, 0.24, 0.06, 14, yn);
  kitBox(b, 0.34, 0.2, 0.3, 0.06, 0.24, 0.06, 14, yn);
  kitBox(b, 0, 0.34, 0.3, 0.74, 0.06, 0.07, 14, yn);

  // --- Mystical crystal shrine (pid 3 spire, 10 lantern pylons, 15 gilded ring)
  kitPyramid(b, 0, 0.08, 0, 0.13, 0.9, 4, 3, yn, 0.4);
  kitPyramid(b, 0.17, 0.08, 0.08, 0.07, 0.45, 4, 3, yn, 0.9);
  kitPyramid(b, -0.15, 0.08, -0.1, 0.06, 0.38, 4, 3, yn, 0.1);
  for (const sx of [-1, 1]) {
    kitBox(b, sx * 0.3, 0.2, 0.28, 0.05, 0.24, 0.05, 10, yn);
    kitBox(b, sx * 0.3, 0.36, 0.28, 0.08, 0.07, 0.08, 10, yn);
  }
  kitFrustum(b, 0, 0.08, 0, 0.3, 0.28, 0.04, 10, 15, yn);

  // --- Harmonic monolith (pid 19 plinth, 8 basalt body, 18 gold bands, 17 gold cap)
  kitFrustum(b, 0, 0.0, 0, 0.22, 0.2, 0.1, 8, 19, yn);
  kitFrustum(b, 0, 0.1, 0, 0.11, 0.065, 0.95, 4, 8, yn, 0.785);
  kitFrustum(b, 0, 0.44, 0, 0.088, 0.086, 0.04, 4, 18, yn, 0.785);
  kitFrustum(b, 0, 0.74, 0, 0.076, 0.074, 0.04, 4, 18, yn, 0.785);
  kitPyramid(b, 0, 1.05, 0, 0.068, 0.17, 4, 17, yn, 0.785);

  // --- Bridge across x in [-0.5, 0.5] (pid 6 arch stone, 9 deck, 20 pillars/parapet, 22 lamp)
  const arch = (x) => 0.17 * (1 - (2 * x) * (2 * x)) + 0.02;
  const N = 8;
  for (let k = 0; k < N; k++) {
    const x0 = -0.5 + k / N, x1 = -0.5 + (k + 1) / N, xm = (x0 + x1) / 2;
    kitBox(b, xm, arch(xm) - 0.045, 0, (x1 - x0) * 1.04, 0.09, 0.3, 6, yn);
  }
  for (let k = 0; k < 10; k++) { const xm = -0.5 + (k + 0.5) / 10; kitBox(b, xm, arch(xm) + 0.01, 0, 0.1, 0.02, 0.32, 9, yn); }
  for (const sx of [-1, 1]) kitBox(b, sx * 0.5, 0.08, 0, 0.08, 0.16, 0.36, 20, yn);
  for (let k = 0; k < 8; k++) { const xm = -0.5 + (k + 0.5) / 8; for (const sz of [-1, 1]) kitBox(b, xm, arch(xm) + 0.05, sz * 0.15, 0.12, 0.05, 0.025, 20, yn); }
  for (const sx of [-1, 1]) {
    kitBox(b, sx * 0.5, 0.26, 0.19, 0.03, 0.2, 0.03, 20, yn);
    kitBox(b, sx * 0.5, 0.38, 0.19, 0.07, 0.07, 0.07, 22, yn);
  }

  // --- Switchback stairs: 6 slabs along x; aPart.y carries the slab's t (0..1) so each slab sits on the ground under it
  for (let k = 0; k < 6; k++) {
    const t = (k + 0.5) / 6;
    kitBox(b, -0.5 + t, 0.03 + k * 0.012, 0, 0.17, 0.06, 0.36, 7, flat(t));
  }

  // --- Lantern-lit cobble paving (pid 16 cobbles, 21 lantern post and lamp)
  kitBox(b, 0, 0.012, 0, 0.22, 0.025, 0.22, 16, yn);
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2 + 0.3;
    kitBox(b, Math.cos(a) * 0.27, 0.012, Math.sin(a) * 0.27, 0.2, 0.025, 0.2, 16, yn);
  }
  kitBox(b, 0, 0.18, 0, 0.04, 0.36, 0.04, 21, yn);
  kitBox(b, 0, 0.39, 0, 0.09, 0.09, 0.09, 21, yn);

  // --- Myth stone: carved slab facing the island centre (pid 23 slab, 24 base); the glyph is drawn in the fragment shader
  kitBox(b, 0, 0.04, 0, 0.34, 0.08, 0.18, 24, yn);
  kitBox(b, 0, 0.31, 0, 0.26, 0.46, 0.07, 23, yn);
  kitPyramid(b, 0, 0.54, 0, 0.13, 0.07, 4, 23, yn, 0.785);

  return kitFinish(b);
}

function createStructures(caps) {
  const cap = TUNING.structureCap;
  const geo = createStructureGeometry();
  const state = new THREE.InstancedBufferAttribute(new Float32Array(cap * 4), 4);
  const kindAttr = new THREE.InstancedBufferAttribute(new Float32Array(cap * 4), 4);
  state.setUsage(THREE.DynamicDrawUsage); kindAttr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aInstanceState', state);
  geo.setAttribute('aKind', kindAttr);

  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, metalness: 0, side: THREE.DoubleSide });
  if (!caps.floatLinear) mat.defines = { MANUAL_BILINEAR: '' };
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uSimTexA = SHARED.uSimTexA; shader.uniforms.uSimTexB = SHARED.uSimTexB;
    shader.uniforms.uSimTexC = SHARED.uSimTexC; shader.uniforms.uTime = SHARED.uTime; shader.uniforms.uCell = SHARED.uCell; shader.uniforms.uNight = SHARED.uNight;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${GLSL_SIM}\n${GLSL_TERRAIN_HEIGHT}\n${GLSL_STRUCT_PARS}`)
      .replace('#include <beginnormal_vertex>', GLSL_STRUCT_NORMAL)
      .replace('#include <begin_vertex>', GLSL_STRUCT_POS);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\n${GLSL_SIM}\n${GLSL_STRUCT_FRAG_PARS}`)
      .replace('#include <color_fragment>', GLSL_STRUCT_FRAG_COLOR)
      .replace('#include <emissivemap_fragment>', GLSL_STRUCT_FRAG_EMISSIVE)
      .replace('#include <lights_fragment_end>', GLSL_SHADE_FRAG);
  };

  const mesh = new THREE.InstancedMesh(geo, mat, cap);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  mesh.count = 0;

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pv = new THREE.Vector3(), sc = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0);
  let placed = 0, epoch = 0, glowClock = 0;
  const gl = SHARED.uGlow.value;

  // Sync instance buffers from the sim every frame (allocation-free).
  mesh.userData.update = function update(world, dt) {
    const civ = world.civ;
    const n = civ.nS;
    mesh.count = n;
    mesh.visible = n > 0;
    if (civ.sEpoch !== epoch) { epoch = civ.sEpoch; placed = 0; }   // a recycled monolith/myth slot moved: rewrite all matrices
    for (; placed < n; placed++) {
      pv.set(civ.sX[placed], 0, civ.sZ[placed]);
      const k = civ.sKind[placed];
      // local +X is the span / descent direction for engineering; dwellings just use their stored yaw
      const theta = k === KIND_DWELLING || k === KIND_MONOLITH || k === KIND_MYTH ? civ.sRot[placed] : Math.atan2(-civ.sDirZ[placed], civ.sDirX[placed]);
      q.setFromAxisAngle(up, theta);
      m.compose(pv, q, sc);
      mesh.setMatrixAt(placed, m);
      mesh.instanceMatrix.needsUpdate = true;
    }
    const sa = state.array, ka = kindAttr.array;
    for (let i = 0; i < n; i++) {
      const o = i * 4;
      sa[o] = civ.sBias[i]; sa[o + 1] = civ.sBuild[i]; sa[o + 2] = civ.sDecay[i]; sa[o + 3] = civ.sLum[i];
      ka[o] = civ.sKind[i]; ka[o + 1] = civ.sLen[i] > 0 ? civ.sLen[i] : 1; ka[o + 2] = civ.sKind[i] === KIND_MYTH ? civ.sBias[i] : 0;
    }
    state.needsUpdate = true; kindAttr.needsUpdate = true;
    mesh.userData.dt = dt;

    // warm light pools: monoliths first, then lamps (bridges, paving), then hearths; refreshed twice a second
    glowClock += dt;
    if (glowClock > 0.5) {
      glowClock = 0;
      let g = 0;
      const mo = world.monoliths;
      for (let k = 0; k < 8 && g < GLOW_N; k++) if (mo[k * 4 + 3] !== 0) gl[g++].set(mo[k * 4], mo[k * 4 + 1], 1.5, 1.4);
      for (let i = 0; i < n && g < GLOW_N; i++) {
        const k = civ.sKind[i];
        if ((k === KIND_BRIDGE || k === KIND_PAVING) && civ.sBuild[i] >= 1) gl[g++].set(civ.sX[i], civ.sZ[i], 0.9, 0.9);
      }
      for (let i = 0; i < n && g < GLOW_N; i++) if (civ.sKind[i] === KIND_MYTH) gl[g++].set(civ.sX[i], civ.sZ[i], 0.7, 0.7 * (1 - 0.7 * civ.sDecay[i]));
      for (let i = 0; i < n && g < GLOW_N; i++) {
        if (civ.sKind[i] === KIND_DWELLING && civ.sBuild[i] >= 1 && civ.sDecay[i] < 0.5) gl[g++].set(civ.sX[i], civ.sZ[i], 0.8, 0.6 + civ.sLum[i]);
      }
      for (; g < GLOW_N; g++) gl[g].set(0, 0, 1, 0);
    }
    void KIND_STEPS;
  };
  return mesh;
}

// Cloaked figurine: pid 0 cloak, 1 head, 2 hood, 3 cargo bundle, 4 lantern, 5 lantern stick.
function createVillagerGeometry() {

  kitPyramid(b, 0, 0.31, 0, 0.056, 0.09, 6, 2, yn);
  kitBox(b, 0, 0.17, -0.095, 0.11, 0.12, 0.07, 3, yn);
  kitBox(b, 0.115, 0.15, 0.05, 0.012, 0.24, 0.012, 5, yn);

function createVillagers(caps) {
  const n = TUNING.villagers;
  const geo = createVillagerGeometry();
  const state = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4);
  state.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aInstanceState', state);

  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0, side: THREE.DoubleSide });
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uNight = SHARED.uNight;
    shader.uniforms.uSimTexC = SHARED.uSimTexC;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${GLSL_VILL_PARS}`)
      .replace('#include <begin_vertex>', GLSL_VILL_POS);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vVCol;\nvarying vec3 vVGlow;\nvarying float vShade;')
      .replace('#include <color_fragment>', GLSL_VILL_FRAG_COLOR)
      .replace('#include <emissivemap_fragment>', GLSL_VILL_FRAG_EMISSIVE)
      .replace('#include <lights_fragment_end>', GLSL_SHADE_FRAG);
  };
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.castShadow = false;
  mesh.receiveShadow = true;

  const m = new THREE.Matrix4(), nrm = new THREE.Vector3(), nrmS = new THREE.Vector3(), fwd = new THREE.Vector3(), right = new THREE.Vector3(), pos = new THREE.Vector3();
  const SCALE = 1.1;
  const sa = state.array;

  // Orient along velocity, pitch into the slope, bob with the walk cycle (spec 4.2 Pool 3).
  mesh.userData.update = function update(world) {
    const civ = world.civ, elev = world.elev;
    for (let i = 0; i < n; i++) {
      const x = civ.vX[i], z = civ.vZ[i];
      const gxs = (sampleGrid(elev, x + 0.1, z) - sampleGrid(elev, x - 0.1, z)) / 0.2;
      const gzs = (sampleGrid(elev, x, z + 0.1) - sampleGrid(elev, x, z - 0.1)) / 0.2;
      const moving = civ.vVX[i] * civ.vVX[i] + civ.vVZ[i] * civ.vVZ[i] > 0.004;
      const st = civ.vState[i];
      let bob = moving ? Math.abs(Math.sin(civ.vPhase[i])) * 0.03 : 0;
      if (st === ST_GREET) bob = Math.abs(Math.sin(civ.vTimer[i] * 9)) * 0.07;
      const y = sampleGrid(elev, x, z) + bob;
      nrm.set(-gxs, 1, -gzs).normalize();
      const h = civ.vHeading[i];
      fwd.set(Math.sin(h), 0, Math.cos(h));
      fwd.addScaledVector(nrm, -fwd.dot(nrm)).normalize();
      right.crossVectors(nrm, fwd);
      nrmS.copy(nrm).multiplyScalar(SCALE);
      m.makeBasis(right.multiplyScalar(SCALE), nrmS, fwd.multiplyScalar(SCALE));
      pos.set(x, y, z);
      m.setPosition(pos);
      mesh.setMatrixAt(i, m);
      const o = i * 4;
      sa[o] = civ.vRole[i]; sa[o + 1] = civ.vCargo[i]; sa[o + 2] = civ.vPhase[i];
      sa[o + 3] = st === ST_PROCESSION ? 1 : civ.vRole[i] === ROLE_MYSTIC ? 0.5 : 0;
    }
    mesh.instanceMatrix.needsUpdate = true;
    state.needsUpdate = true;
  };
  return mesh;
}

// ---- sim/particles.js ----
const PARTICLE_CAP = 1000;
const P_SPRAY = 0, P_RAIN = 1, P_EMBER = 2, P_ROCK = 3, P_LANTERN = 4;
// subtype 2 doubles as stone dust (flag in `aux`: 0 ember, 1 dust)

// Zero-GC particle sim (spec 4.2 Pool 4). Struct-of-arrays, oldest-first recycling.
function createParticles() {
  const f = () => new Float32Array(PARTICLE_CAP);
  return {
    x: f(), y: f(), z: f(), vx: f(), vy: f(), vz: f(), life: f(), maxLife: f(), size: f(), aux: f(), spin: f(),
    type: new Uint8Array(PARTICLE_CAP), alive: new Uint8Array(PARTICLE_CAP),
    next: 0, count: 0, cursor: { i: 0 }, sprayClock: 0, rainClock: 0, emberClock: 0, rainAccum: 0,
    rainSlots: 380,          // budget kept for ambient/cloud rain so it can't starve the other effects
  };
}

function spawn(p, type, x, y, z, vx, vy, vz, life, size, aux) {
  // Recycle the slot after the last one used; rain is limited to its own budget by the callers.
  const k = p.next; p.next = (p.next + 1) % PARTICLE_CAP;
  p.type[k] = type; p.alive[k] = 1;
  p.x[k] = x; p.y[k] = y; p.z[k] = z; p.vx[k] = vx; p.vy[k] = vy; p.vz[k] = vz;
  p.life[k] = 0; p.maxLife[k] = life; p.size[k] = size; p.aux[k] = aux; p.spin[k] = Math.random() * 6.28;
}

// world: sim world; wind: {x,z,amp}; camera target for ambient rain; rainAmt 0..1 (monsoon), cloud {x,y,z,on}
const FX_RNG = { next: Math.random };

function stepParticles(p, world, dt, time, rainAmt, windAmp, cloudOn, cx, cy, cz, tx, tz) {
  const civ = world.civ;
  const rng = FX_RNG;   // never world.rng: this runs per render frame, so drawing from it would make the sim depend on frame rate (SPEC 2.4)

  // -------- events -> spawns --------
  let k;
  while ((k = nextEvent(world.events, p.cursor)) >= 0) {
    const t = world.events.type[k], ex = world.events.x[k], ez = world.events.z[k], ea = world.events.a[k];
    const ey = visualHeight(world.elev, ex, ez);
    if (t === EV_ROCKFALL) {
      for (let n = 0; n < 5; n++) spawn(p, P_ROCK, ex + (Math.random() - 0.5) * 0.9, ey + 0.1, ez + (Math.random() - 0.5) * 0.9, (Math.random() - 0.5) * 0.9, 0.8 + Math.random() * 1.2, (Math.random() - 0.5) * 0.9, 1.4, 0.035 + Math.random() * 0.035, 0);
    } else if (t === EV_DUST) {
      for (let n = 0; n < 4; n++) spawn(p, P_EMBER, ex + (Math.random() - 0.5) * 0.3, ey + 0.05, ez + (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.25, 0.25 + Math.random() * 0.3, (Math.random() - 0.5) * 0.25, 1.6, 0.07 + Math.random() * 0.05, 1);
    } else if (t === EV_LANTERN) {
      spawn(p, P_LANTERN, ex, ey + 0.4, ez, (Math.random() - 0.5) * 0.1, 0.35 + Math.random() * 0.15, (Math.random() - 0.5) * 0.1, 14 + Math.random() * 6, 0.1, Math.random());
    } else if (t === EV_MONOLITH_PULSE || t === EV_MONOLITH_PLACE) {
      for (let n = 0; n < 3; n++) { const a = n * 2.09 + time; spawn(p, P_LANTERN, ex + Math.cos(a) * 0.5, ey + 0.8, ez + Math.sin(a) * 0.5, 0, 0.45, 0, 11, 0.08, Math.random()); }
    } else if (t === EV_RAIN_DROP) {
      void ea;
    }
  }

  // -------- ambient emitters --------
  // waterfall spray and rising mist from rim outflow
  p.sprayClock += dt;
  if (p.sprayClock > 0.03 && world.rimCells) {
    p.sprayClock = 0;
    for (let n = 0; n < 6; n++) {
      const c = world.rimCells[(rng.next() * world.rimCells.length) | 0];
      const out = world.rimOut[c];
      if (out > 0.0004 && rng.next() < Math.min(1, out * 90)) {
        const gx = (c % 128 + 0.5) / 128 * 20 - 10, gz = (((c / 128) | 0) + 0.5) / 128 * 20 - 10;
        const r = Math.hypot(gx, gz) || 1;
        const px = gx / r * 9.2, pz = gz / r * 9.2;
        const mist = rng.next() < 0.45;
        if (mist) {
          // mist gathers where the cascade meets the cliff foot (skirt radius ~5.4 at y ~ -5.2) and rolls outward
          const fr = 5.5 + Math.random() * 0.6;
          spawn(p, P_SPRAY, gx / r * fr, -5.1 - Math.random() * 0.8, gz / r * fr, gx / r * (0.15 + Math.random() * 0.3), 0.25 + Math.random() * 0.25, gz / r * (0.15 + Math.random() * 0.3), 3.2, 0.3, 1);
        } else {
          spawn(p, P_SPRAY, px, -0.55, pz, gx / r * (0.2 + Math.random() * 0.5), -0.4 - Math.random() * 0.8, gz / r * (0.2 + Math.random() * 0.5), 1.1, 0.05, 0);
        }
      }
    }
  }
  // forge embers from industrious dwellings
  p.emberClock += dt;
  if (p.emberClock > 0.25) {
    p.emberClock = 0;
    for (let n = 0; n < 8; n++) {
      const s = (rng.next() * civ.nS) | 0;
      if (civ.sKind[s] !== KIND_DWELLING || civ.sBuild[s] < 1 || civ.sDecay[s] > 0.5) continue;
      if (civ.sBias[s] > -0.35) continue;
      const y = visualHeight(world.elev, civ.sX[s], civ.sZ[s]);
      spawn(p, P_EMBER, civ.sX[s] + 0.06, y + 0.55, civ.sZ[s], (Math.random() - 0.5) * 0.12, 0.35 + Math.random() * 0.25, (Math.random() - 0.5) * 0.12, 2.0, 0.03, 0);
    }
  }
  // rain: monsoon over the whole island, plus a focused downpour under the raincloud tool
  p.rainAccum += dt * (rainAmt * 260 + (cloudOn ? 120 : 0));
  let alive = 0;
  for (let i = 0; i < PARTICLE_CAP; i++) if (p.alive[i] && p.type[i] === P_RAIN) alive++;
  while (p.rainAccum >= 1) {
    p.rainAccum -= 1;
    if (alive >= p.rainSlots) { p.rainAccum = 0; break; }
    const useCloud = cloudOn && (rainAmt < 0.05 || Math.random() < 0.45);
    let x, z, y;
    if (useCloud) { const a = Math.random() * 6.28, r = Math.sqrt(Math.random()) * 1.5; x = cx + Math.cos(a) * r; z = cz + Math.sin(a) * r; y = cy - 0.15; }
    else { const a = Math.random() * 6.28, r = Math.sqrt(Math.random()) * 8.5; x = Math.cos(a) * r; z = Math.sin(a) * r; y = 5.5 + Math.random() * 1.5; }
    spawn(p, P_RAIN, x, y, z, windAmp * 0.9 + 0.3, -7.5 - Math.random() * 2, 0.15, 2.0, 0.02, 0);
    alive++;
  }
  void tx; void tz;

  // -------- integrate --------
  let count = 0;
  for (let i = 0; i < PARTICLE_CAP; i++) {
    if (!p.alive[i]) continue;
    const t = p.type[i];
    p.life[i] += dt;
    if (p.life[i] >= p.maxLife[i]) { p.alive[i] = 0; continue; }
    count++;
    if (t === P_RAIN) {
      p.x[i] += p.vx[i] * dt; p.y[i] += p.vy[i] * dt; p.z[i] += p.vz[i] * dt;
      const gh = visualHeight(world.elev, p.x[i], p.z[i]);
      if (p.y[i] < gh + 0.02 || p.y[i] < -0.8) {
        p.alive[i] = 0;
        // a splash: tiny spray puff where the drop lands on the island
        if (Math.hypot(p.x[i], p.z[i]) < 8.6 && Math.random() < 0.25) spawn(p, P_SPRAY, p.x[i], gh + 0.02, p.z[i], 0, 0.25, 0, 0.35, 0.03, 0);
      }
    } else if (t === P_ROCK) {
      p.vy[i] -= 4.2 * dt;
      p.x[i] += p.vx[i] * dt; p.y[i] += p.vy[i] * dt; p.z[i] += p.vz[i] * dt;
      p.spin[i] += dt * 6;
      const gh = visualHeight(world.elev, p.x[i], p.z[i]);
      if (p.y[i] < gh + 0.015) { p.y[i] = gh + 0.015; p.vy[i] = -p.vy[i] * 0.3; p.vx[i] *= 0.6; p.vz[i] *= 0.6; if (Math.abs(p.vy[i]) < 0.12) p.vy[i] = 0; }
    } else if (t === P_LANTERN) {
      // buoyant: slow rise, lateral wind drift, gentle sway
      p.x[i] += (p.vx[i] + windAmp * 0.12 + 0.05 * Math.sin(time * 0.7 + p.aux[i] * 9)) * dt;
      p.z[i] += (p.vz[i] + 0.04 * Math.cos(time * 0.6 + p.aux[i] * 7)) * dt;
      p.y[i] += p.vy[i] * dt;
    } else {
      // spray / mist / embers / dust: light, rising or settling with a touch of wind
      const grav = t === P_SPRAY && p.aux[i] === 0 ? -2.4 : 0;
      p.vy[i] += grav * dt;
      p.x[i] += (p.vx[i] + windAmp * 0.08) * dt; p.y[i] += p.vy[i] * dt; p.z[i] += p.vz[i] * dt;
    }
  }
  p.count = count;
}

// Wind pushes sky-lanterns harder when the Breeze tool is active near them (spec 6.2).
function breezeLanterns(p, bx, bz, radius, strength, dt) {
  if (strength < 0.05) return;
  for (let i = 0; i < PARTICLE_CAP; i++) {
    if (!p.alive[i] || p.type[i] !== P_LANTERN) continue;
    const dx = p.x[i] - bx, dz = p.z[i] - bz, d2 = dx * dx + dz * dz;
    if (d2 > radius * radius) continue;
    const w = (1 - Math.sqrt(d2) / radius) * strength;
    const d = Math.sqrt(d2) + 1e-3;
    p.x[i] += dx / d * w * 1.6 * dt; p.z[i] += dz / d * w * 1.6 * dt; p.y[i] += w * 0.6 * dt;
  }
}

// ---- gl/particlepool.js ----
// Unified particle pool (spec 4.2 Pool 4): octahedra stretched along velocity per subtype in the vertex shader.
function createParticlePool() {
  const n = PARTICLE_CAP;
  const geo = new THREE.OctahedronGeometry(1, 0);
  const state = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4);
  const vel = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4);
  state.setUsage(THREE.DynamicDrawUsage); vel.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aInstanceState', state);
  geo.setAttribute('aVel', vel);
  const mat = new THREE.ShaderMaterial({
    vertexShader: GLSL_PART_VERT,
    fragmentShader: GLSL_PART_FRAG,
    uniforms: { uTime: SHARED.uTime },
    transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  });
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.renderOrder = 4;
  const ma = mesh.instanceMatrix.array;
  for (let i = 0; i < n; i++) { ma[i * 16] = 1; ma[i * 16 + 5] = 1; ma[i * 16 + 10] = 1; ma[i * 16 + 15] = 1; }
  const sa = state.array, va = vel.array;

  // Live particles are scattered over the ring buffer; pack them into slots 0..k-1 so only k instances are drawn and
  // uploaded (the shaders never use the instance index, so slot order does not matter).
  mesh.count = 0;
  mesh.userData.update = function update(p) {
    let k = 0;
    for (let i = 0; i < n; i++) {
      if (!p.alive[i]) continue;
      const o = k * 4;
      ma[k * 16 + 12] = p.x[i]; ma[k * 16 + 13] = p.y[i]; ma[k * 16 + 14] = p.z[i];
      sa[o] = p.type[i]; sa[o + 1] = p.life[i] / p.maxLife[i]; sa[o + 2] = p.size[i]; sa[o + 3] = p.aux[i];
      va[o] = p.vx[i]; va[o + 1] = p.vy[i]; va[o + 2] = p.vz[i]; va[o + 3] = p.spin[i];
      k++;
    }
    // with nothing alive, keep one zero-size instance in the draw: a zero-count pool is skipped before its program
    // compiles, which would move a shader compile hitch to the first rockfall (and the smoke test counts programs)
    if (k === 0) {
      mesh.count = 1;
      if (sa[2] !== 0) { sa[2] = 0; state.clearUpdateRanges(); state.addUpdateRange(0, 4); state.needsUpdate = true; }
      return;
    }
    mesh.count = k;
    mesh.instanceMatrix.clearUpdateRanges(); mesh.instanceMatrix.addUpdateRange(0, k * 16); mesh.instanceMatrix.needsUpdate = true;
    state.clearUpdateRanges(); state.addUpdateRange(0, k * 4); state.needsUpdate = true;
    vel.clearUpdateRanges(); vel.addUpdateRange(0, k * 4); vel.needsUpdate = true;
  };
  return mesh;
}

// ---- gl/glsl_flora.js ----
const GLSL_FLORA_VERT_PARS = /* glsl */`
attribute vec4 aInstanceState;
attribute vec2 aPart;
varying vec3 vFloraCol;
varying vec3 vGlow;
varying float vShade;
uniform sampler2D uSimTexC;
uniform vec4 uCloud;
uniform vec4 uBreeze;
uniform float uWind;
uniform float uNight;
${GLSL_SIM}
`;

const GLSL_FLORA_VERT_NORMAL = /* glsl */`
  vec3 objectNormal = normalize(mix(normal, vec3(0.0, 1.0, 0.0), 0.55));
`;

// Height/flatten/drown from sim state, wind + raincloud + breeze bending, colour banding by fertility, bioluminescence.
const GLSL_FLORA_VERT_POS = /* glsl */`
  vec3 fBase = instanceMatrix[3].xyz;
  vec2 fUv = worldToUv(fBase.xz);
  vec4 fA = simA(fUv);
  vShade = fetchBil(uSimTexC, fUv).r;
  vec4 fB = simB(fUv);
  float fert = fB.g, comp = fB.b, bias = fB.a, wat = fA.g;
  float arche = aInstanceState.x, grow = aInstanceState.y;
  float part = aPart.x, yn = aPart.y;
  float vis = (part > 0.25 && arche < 0.9) ? 0.0 : 1.0;
  float hgt = mix(0.22, 1.0, smoothstep(0.08, 0.85, fert)) * grow * (1.0 - 0.8 * comp) * (0.8 + 0.5 * arche);
  hgt *= 1.0 - smoothstep(0.015, 0.04, wat);
  float wid = mix(0.6, 1.0, hgt);
  vec3 transformed = position * vec3(wid, hgt, wid) * 0.58 * vis;

  float t = uTime;
  float gust = 0.5 + 0.5 * sin(t * 0.7 + fBase.x * 0.35 + fBase.z * 0.21);
  float sway = sin(t * 1.9 + fBase.x * 1.3 + fBase.z * 0.9) * 0.6 + sin(t * 3.1 + fBase.z * 2.1) * 0.3;
  vec2 wv = vec2(1.0, 0.35) * uWind * (0.07 + 0.12 * gust) * sway;
  vec2 dc = fBase.xz - uCloud.xy;
  float dcl = length(dc);
  float cf = uCloud.w * (1.0 - smoothstep(0.0, uCloud.z, dcl));
  wv += (dcl > 0.001 ? dc / dcl : vec2(0.0)) * cf * 0.45 + vec2(sin(t * 17.0 + fBase.x * 5.0), cos(t * 15.0 + fBase.z * 5.0)) * cf * 0.04;
  vec2 db = fBase.xz - uBreeze.xy;
  float dbl = length(db);
  float bf = uBreeze.w * (1.0 - smoothstep(0.0, uBreeze.z, dbl));
  wv += (dbl > 0.001 ? db / dbl : vec2(0.0)) * bf * 0.5;
  vec3 wW = vec3(wv.x, 0.0, wv.y);
  vec3 wObj = vec3(dot(wW, instanceMatrix[0].xyz), 0.0, dot(wW, instanceMatrix[2].xyz));
  transformed += wObj * (yn * yn) * (hgt + 0.3);
  transformed.y += fA.r;

  vec3 ochre = lin(vec3(0.62, 0.46, 0.24));
  vec3 grain = lin(vec3(0.86, 0.72, 0.28));
  vec3 emer = lin(vec3(0.14, 0.58, 0.26));
  vec3 fc = mix(ochre, grain, smoothstep(0.22, 0.38, fert));
  fc = mix(fc, emer, smoothstep(0.48, 0.68, fert));
  if (part > 0.25 && part < 0.75) fc = lin(vec3(0.35, 0.24, 0.15));
  else if (part >= 0.75) fc = mix(emer, fc, 0.35);
  float hv = hash12(fBase.xz * 13.7);
  fc *= (0.82 + 0.36 * hv) * mix(0.55, 1.18, yn);
  float lum = smoothstep(0.32, 0.52, bias);
  vec3 bio = mix(vec3(0.05, 0.85, 0.95), vec3(0.62, 0.22, 1.0), hv);
  float glowAmt = lum * (0.30 + 0.70 * uNight) * (0.25 + 0.75 * yn) + aInstanceState.w * (0.4 + 0.6 * yn);
  vFloraCol = mix(fc, bio * 0.5, lum * 0.6);
  vGlow = bio * glowAmt * 1.8 + fc * 0.40 * uNight;   // moonlit scatter keeps the crops readable after dark
`;

const GLSL_FLORA_FRAG_COLOR = /* glsl */`
  diffuseColor.rgb = vFloraCol;
`;
const GLSL_FLORA_FRAG_EMISSIVE = /* glsl */`
  #include <emissivemap_fragment>
  totalEmissiveRadiance += vGlow;
`;

const GLSL_FLORA_SHADE = /* glsl */`
  #include <lights_fragment_end>
  reflectedLight.directDiffuse *= vShade;
  reflectedLight.directSpecular *= vShade;
`;

// ---- sim/noise.js ----
// Seedable value noise (hash based, no tables, no allocation).
function hash2(ix, iz, seed) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(seed, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function valueNoise(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed);
  const c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}

// Normalised to [0,1].
function fbm(x, z, seed, octaves) {
  let sum = 0, amp = 0.5, norm = 0, f = 1;
  for (let o = 0; o < octaves; o++) {
    sum += amp * valueNoise(x * f, z * f, seed + o * 101);
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return sum / norm;
}

function smoothstep(a, b, x) {
  let t = (x - a) / (b - a);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return t * t * (3 - 2 * t);
}

// ---- gl/flora.js ----
const FLORA_MAX = 3500;

// Low-poly tuft: 6 tapered blades, plus a short stem and faceted canopy that only "tree" archetypes show.
// aPart = (part id, yNorm): part 0 blade, 0.5 stem, 1 canopy.
function createFloraGeometry() {
  const pos = [], part = [];
  const tri = (a, b, c, pa, pb, pc) => { pos.push(...a, ...b, ...c); part.push(...pa, ...pb, ...pc); };
  for (let b = 0; b < 6; b++) {
    const ang = (b / 6) * Math.PI * 2 + hash2(b, 1, 3) * 0.6;
    const h = 0.42 + hash2(b, 2, 3) * 0.34;
    const lean = 0.07 + hash2(b, 3, 3) * 0.07;
    const ca = Math.cos(ang), sa = Math.sin(ang), px = -sa, pz = ca;
    const r0 = 0.05, w0 = 0.045;
    const pt = (r, y, w, side) => [ca * r + px * w * side, y, sa * r + pz * w * side];
    const b0l = pt(r0, 0, w0, -1), b0r = pt(r0, 0, w0, 1);
    const m_l = pt(r0 + lean * 0.4, h * 0.5, w0 * 0.65, -1), m_r = pt(r0 + lean * 0.4, h * 0.5, w0 * 0.65, 1);
    const tip = pt(r0 + lean, h, 0, 0);
    tri(b0l, b0r, m_l, [0, 0], [0, 0], [0, 0.5]);
    tri(b0r, m_r, m_l, [0, 0], [0, 0.5], [0, 0.5]);
    tri(m_l, m_r, tip, [0, 0.5], [0, 0.5], [0, 1]);
  }
  // stem: 3-sided prism
  for (let k = 0; k < 3; k++) {
    const a0 = (k / 3) * Math.PI * 2, a1 = ((k + 1) / 3) * Math.PI * 2, r = 0.022, hs = 0.52;
    const p0 = [Math.cos(a0) * r, 0, Math.sin(a0) * r], p1 = [Math.cos(a1) * r, 0, Math.sin(a1) * r];
    const q0 = [Math.cos(a0) * r * 0.7, hs, Math.sin(a0) * r * 0.7], q1 = [Math.cos(a1) * r * 0.7, hs, Math.sin(a1) * r * 0.7];
    tri(p0, p1, q0, [0.5, 0], [0.5, 0], [0.5, 0.7]);
    tri(p1, q1, q0, [0.5, 0], [0.5, 0.7], [0.5, 0.7]);
  }
  // canopy: squashed octahedron-ish crown
  const cy = 0.62, rx = 0.2, ry = 0.17;
  const top = [0, cy + ry, 0], bot = [0, cy - ry * 0.7, 0];
  const ring = [];
  for (let k = 0; k < 6; k++) { const a = (k / 6) * Math.PI * 2 + 0.3; ring.push([Math.cos(a) * rx, cy + 0.02, Math.sin(a) * rx]); }
  for (let k = 0; k < 6; k++) {
    const a = ring[k], b = ring[(k + 1) % 6];
    tri(a, b, top, [1, 0.78], [1, 0.78], [1, 1]);
    tri(b, a, bot, [1, 0.78], [1, 0.78], [1, 0.72]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aPart', new THREE.Float32BufferAttribute(part, 2));
  g.computeVertexNormals();
  return g;
}

function createFlora(caps, count) {
  const n = Math.min(count, FLORA_MAX);
  const geo = createFloraGeometry();
  const state = new THREE.InstancedBufferAttribute(new Float32Array(FLORA_MAX * 4), 4);
  geo.setAttribute('aInstanceState', state);

  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, metalness: 0, side: THREE.DoubleSide });
  if (!caps.floatLinear) mat.defines = { MANUAL_BILINEAR: '' };
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uSimTexA = SHARED.uSimTexA; shader.uniforms.uSimTexB = SHARED.uSimTexB;
    shader.uniforms.uTime = SHARED.uTime; shader.uniforms.uCell = SHARED.uCell;
    shader.uniforms.uWind = SHARED.uWind; shader.uniforms.uNight = SHARED.uNight;
    shader.uniforms.uSimTexC = SHARED.uSimTexC; shader.uniforms.uCloud = SHARED.uCloud; shader.uniforms.uBreeze = SHARED.uBreeze;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${GLSL_FLORA_VERT_PARS}`)
      .replace('#include <beginnormal_vertex>', GLSL_FLORA_VERT_NORMAL)
      .replace('#include <begin_vertex>', GLSL_FLORA_VERT_POS);
    shader.vertexShader = shader.vertexShader.replace('void main() {', 'void main() {');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vFloraCol;\nvarying vec3 vGlow;\nvarying float vShade;')
      .replace('#include <color_fragment>', GLSL_FLORA_FRAG_COLOR)
      .replace('#include <emissivemap_fragment>', GLSL_FLORA_FRAG_EMISSIVE)
      .replace('#include <lights_fragment_end>', GLSL_FLORA_SHADE);
  };

  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.receiveShadow = true;
  mesh.castShadow = false;

  // Jittered-grid placement over the island interior (deterministic), then shuffled so that lowering
  // mesh.count (quality tiers) thins the flora evenly instead of eating whole rows.
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0);
  const G = 80, step = 20 / G;
  const cand = [];
  for (let gz = 0; gz < G; gz++) {
    for (let gx = 0; gx < G; gx++) {
      const x = -10 + (gx + 0.15 + 0.7 * hash2(gx, gz, 41)) * step;
      const z = -10 + (gz + 0.15 + 0.7 * hash2(gx, gz, 43)) * step;
      if (Math.hypot(x, z) > 8.3) continue;
      cand.push([x, z, gx, gz]);
    }
  }
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(hash2(i, 7, 61) * (i + 1)); const t = cand[i]; cand[i] = cand[j]; cand[j] = t; }
  let k = 0;
  for (; k < cand.length && k < n; k++) {
    const [x, z, gx, gz] = cand[k];
    q.setFromAxisAngle(up, hash2(gx, gz, 47) * Math.PI * 2);
    p.set(x, 0, z);
    m.compose(p, q, sc);
    mesh.setMatrixAt(k, m);
    const o = k * 4;
    state.array[o] = hash2(gx, gz, 53);                  // archetype 0..1 (tree if > 0.78)
    state.array[o + 1] = 0.75 + 0.5 * hash2(gx, gz, 59); // growth stage
    state.array[o + 2] = 0;                              // decay
    state.array[o + 3] = 0;                              // luminescence
  }
  mesh.count = k;
  mesh.userData.full = k;
  mesh.instanceMatrix.needsUpdate = true;
  state.needsUpdate = true;
  mesh.userData.state = state;
  return mesh;
}

// ---- gl/glsl_sky.js ----
// Sky dome shaders (kept apart from glsl.js; only needs hash/noise helpers).
const GLSL_SKY_COMMON = /* glsl */`
float skyHash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float skyNoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(skyHash(i), skyHash(i + vec2(1.0, 0.0)), u.x), mix(skyHash(i + vec2(0.0, 1.0)), skyHash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float skyFbm(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 4; i++) { s += a * skyNoise(p); p *= 2.03; a *= 0.5; }
  return s;
}
`;

const GLSL_SKY_VERT = /* glsl */`
varying vec3 vDir;
void main() {
  vDir = position;
  vec4 p = projectionMatrix * mat4(mat3(viewMatrix)) * vec4(position, 1.0);
  gl_Position = p.xyww;
}
`;

const GLSL_SKY_FRAG = /* glsl */`
precision highp float;
varying vec3 vDir;
uniform float uTime;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uSkyTop;
uniform vec3 uSkyHor;
uniform vec3 uFogColor;
uniform float uAurora;
uniform float uRain;
uniform float uNight;
${GLSL_SKY_COMMON}
void main() {
  vec3 d = normalize(vDir);
  float h = clamp(d.y, 0.0, 1.0);
  vec3 col = mix(uSkyHor, uSkyTop, pow(h, 0.55));
  // below the horizon the island floats over a sea of cloud: horizon haze deepening toward the nadir, with soft billows
  float below = smoothstep(0.0, -0.85, d.y);
  vec2 cq = d.xz / (abs(d.y) + 0.22);
  float billow = skyFbm(cq * 1.1 + vec2(uTime * 0.01, 0.0));
  vec3 seaCol = mix(uSkyHor, mix(uSkyTop, uFogColor, 0.35) * 0.8, below);
  seaCol *= 0.86 + 0.28 * billow;
  col = mix(col, seaCol, smoothstep(0.03, -0.04, d.y));

  // sun / moon disc and halo
  float sd = max(dot(d, normalize(uSunDir)), 0.0);
  col += uSunColor * (pow(sd, 900.0) * 6.0 + pow(sd, 10.0) * 0.30 * (1.0 - uAurora * 0.6));

  // stars (night only)
  float starAmt = clamp(uAurora + uNight * 0.3, 0.0, 1.0) * (1.0 - uRain);
  if (starAmt > 0.01 && d.y > 0.0) {
    vec2 su = vec2(atan(d.z, d.x) * 110.0, d.y * 210.0);
    vec2 cell = floor(su);
    vec2 lf = fract(su) - 0.5;
    float r = skyHash(cell);
    vec2 jit = vec2(skyHash(cell + 17.3), skyHash(cell + 41.7)) - 0.5;
    float tw = 0.6 + 0.4 * sin(uTime * 2.0 + r * 40.0);
    float star = step(0.93, r) * smoothstep(0.17, 0.0, length(lf - jit * 0.6)) * (0.35 + 0.65 * fract(r * 91.0));
    col += vec3(0.85, 0.9, 1.0) * star * tw * starAmt * smoothstep(0.0, 0.2, d.y) * 1.6;
  }

  // aurora curtains
  if (uAurora > 0.01 && d.y > 0.02) {
    vec2 q = d.xz / (d.y + 0.25);
    float w1 = skyNoise(vec2(q.x * 1.7 + uTime * 0.05, q.y * 0.8));
    float w2 = skyNoise(vec2(q.x * 4.2 - uTime * 0.08, q.y * 1.6 + 3.0));
    float centre = 0.30 + 0.16 * (w1 - 0.5) * 2.0;
    float band = exp(-pow((d.y - centre) * 5.5, 2.0));
    float streak = 0.35 + 0.65 * skyNoise(vec2(q.x * 11.0 + uTime * 0.25, uTime * 0.1 + w2 * 2.0));
    float vert = smoothstep(0.04, 0.18, d.y) * (1.0 - smoothstep(0.55, 0.95, d.y));
    vec3 g = vec3(0.10, 1.0, 0.50), t = vec3(0.10, 0.85, 0.90), v = vec3(0.60, 0.22, 0.98);
    vec3 ac = mix(mix(g, t, smoothstep(0.1, 0.5, w2)), v, smoothstep(0.32, 0.62, d.y + 0.18 * (w1 - 0.5)));
    col += ac * band * streak * vert * 3.6 * uAurora;
  }

  // monsoon cloud deck
  if (uRain > 0.01 && d.y > -0.05) {
    vec2 q = d.xz / (max(d.y, 0.0) + 0.18);
    float c = skyFbm(q * 0.9 + vec2(uTime * 0.02, -uTime * 0.012));
    float cover = smoothstep(0.30, 0.75, c);
    vec3 cloudCol = mix(vec3(0.10, 0.12, 0.15), vec3(0.34, 0.37, 0.42), skyFbm(q * 2.3 + 5.0));
    col = mix(col, cloudCol, cover * uRain * smoothstep(-0.05, 0.25, d.y) * 0.92);
  }
  gl_FragColor = vec4(col, 1.0);
}
`;
